<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dockly · Laboratorio de correo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEDF0; --bg-elevated:#F4F5F7; --card:#FFFFFF; --border:#E1E4E9;
    --text:#1C1F26; --muted:#6B7280; --accent:#E11D48; --accent-dark:#AF1338;
    --accent-soft:rgba(225,29,72,.09); --ok:#149A5C; --ok-soft:rgba(20,154,92,.09);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:460px;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(20,22,28,.05), 0 20px 44px -22px rgba(20,22,28,.18);border:1px solid var(--border);padding:32px 28px;}
  .tag{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-dark);padding:6px 14px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}
  h1{font-size:19px;font-weight:800;margin:0 0 6px;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.5;}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .field input{width:100%;padding:12px 13px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:var(--bg-elevated);color:var(--text);}
  .field input:focus{outline:none;border-color:var(--accent);}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;}
  button:disabled{background:#3A3F4A;cursor:not-allowed;}
  .result{margin-top:16px;padding:14px;border-radius:10px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',monospace;display:none;}
  .result.ok{background:var(--ok-soft);color:#0F5C36;display:block;}
  .result.err{background:var(--accent-soft);color:var(--accent-dark);display:block;}
  .step{display:none;}
  .step.active{display:block;}
</style>
</head>
<body>
  <div class="card">
    <span class="tag">Laboratorio</span>
    <h1>Probar envío de correo</h1>
    <p class="sub">Herramienta aislada — no toca citas, proveedores ni llegadas. Solo sirve para confirmar que Resend y tu dominio están bien configurados.</p>

    <div class="step active" id="stepLogin">
      <div class="field"><label>Usuario (personal interno)</label><input id="lu" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"></div>
      <button id="btnLogin">Entrar</button>
      <div class="result err" id="loginErr" style="display:none;"></div>
    </div>

    <div class="step" id="stepTest">
      <div class="field"><label>Enviar correo de prueba a</label><input id="toEmail" type="email" placeholder="tu-correo@ejemplo.com"></div>
      <button id="btnSend">Enviar correo de prueba</button>
      <div class="result" id="sendResult"></div>
    </div>
  </div>

<script>
let token = null;

document.getElementById('btnLogin').onclick = async ()=>{
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  const username = document.getElementById('lu').value.trim();
  const password = document.getElementById('lp').value;
  if(!username || !password){ errEl.textContent = 'Ingresa usuario y contraseña'; errEl.style.display='block'; return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    const r = await fetch('/api/auth', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Country':'GT', 'X-Facility':'ATLAS_MATERIALES' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'No se pudo iniciar sesión');
    if(data.role !== 'admin' && data.role !== 'superadmin'){ throw new Error('Solo Administración o el superusuario pueden usar este laboratorio'); }
    token = data.token;
    document.getElementById('stepLogin').classList.remove('active');
    document.getElementById('stepTest').classList.add('active');
  }catch(e){
    errEl.textContent = e.message || 'No se pudo iniciar sesión';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
};
document.getElementById('lp').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnLogin').click(); });

document.getElementById('btnSend').onclick = async ()=>{
  const resultEl = document.getElementById('sendResult');
  resultEl.className = 'result';
  resultEl.style.display = 'none';
  const to = document.getElementById('toEmail').value.trim();
  if(!to){ resultEl.className = 'result err'; resultEl.textContent = 'Escribe un correo de destino'; return; }
  const btn = document.getElementById('btnSend');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try{
    const r = await fetch('/api/test-email', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ to })
    });
    const data = await r.json();
    if(data.ok){
      resultEl.className = 'result ok';
      resultEl.textContent = '✅ Correo enviado correctamente.\n\nRevisa la bandeja de ' + to + ' (y spam, por si acaso).\n\nRespuesta de Resend:\n' + JSON.stringify(data.resendBody, null, 2);
    } else {
      resultEl.className = 'result err';
      resultEl.textContent = '❌ No se pudo enviar.\n\n' + (data.error || JSON.stringify(data.resendBody, null, 2));
    }
  }catch(e){
    resultEl.className = 'result err';
    resultEl.textContent = 'Error de conexión: ' + e.message;
  }
  btn.disabled = false; btn.textContent = 'Enviar correo de prueba';
};
</script>
</body>
</html>
