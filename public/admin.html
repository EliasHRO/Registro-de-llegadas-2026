<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Control · Llegadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEDF0;
    --bg-elevated:#F4F5F7;
    --card:#FFFFFF;
    --card-hover:#F7F8FA;
    --border:#E1E4E9;
    --border-soft:#EAECEF;
    --text:#1C1F26;
    --muted:#6B7280;
    --accent:#E11D48;
    --accent-dark:#AF1338;
    --accent-glow:rgba(225,29,72,.22);
    --accent-soft:rgba(225,29,72,.09);
    --ok:#149A5C;
    --ok-glow:rgba(20,154,92,.22);
    --ok-soft:rgba(20,154,92,.09);
    --gold:#B8860B;
    --gold-glow:rgba(184,134,11,.2);
    --info:#3457D5;
    --warn:#B7791F;
    --warn-soft:rgba(183,121,31,.12);
    --info-soft:rgba(52,87,213,.09);
    --radius:16px;
    --shadow:0 1px 2px rgba(20,22,28,.05), 0 20px 44px -22px rgba(20,22,28,.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s ease;}
  body.dashboard-bg{
    background-image:linear-gradient(rgba(238,240,244,.90),rgba(238,240,244,.90)), url('/assets/fleet-bg.jpg');
    background-size:cover;
    background-position:center 40%;
    background-attachment:fixed;
    background-repeat:no-repeat;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .bg-orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.16;z-index:0;pointer-events:none;transition:margin .5s ease-out;}
  .bg-orb.o1{width:520px;height:520px;background:var(--accent);top:-180px;left:-140px;animation:drift1 16s ease-in-out infinite, breathe1 6s ease-in-out infinite;}
  .bg-orb.o2{width:460px;height:460px;background:var(--gold);bottom:-200px;right:-160px;animation:drift2 19s ease-in-out infinite, breathe2 7s ease-in-out infinite;}
  .bg-orb.o3{width:380px;height:380px;background:var(--info);top:40%;left:60%;animation:drift3 22s ease-in-out infinite;opacity:.10;}
  .bg-orb.o4{width:260px;height:260px;background:var(--ok);top:10%;right:10%;animation:drift4 14s ease-in-out infinite;opacity:.10;}
  .bg-orb.o5{width:300px;height:300px;background:var(--accent);bottom:8%;left:8%;animation:drift5 18s ease-in-out infinite;opacity:.09;}
  @keyframes breathe1{0%,100%{opacity:.16;}50%{opacity:.24;}}
  @keyframes breathe2{0%,100%{opacity:.16;}50%{opacity:.22;}}
  @keyframes drift4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.15);}}
  @keyframes drift5{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(35px,-45px) scale(.9);}}
  @keyframes drift1{0%,100%{transform:translate(0,0);}33%{transform:translate(90px,60px);}66%{transform:translate(40px,110px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}33%{transform:translate(-80px,-55px);}66%{transform:translate(-30px,-100px);}}
  @keyframes drift3{0%,100%{transform:translate(0,0);}50%{transform:translate(-70px,80px);}}
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
    background-image:linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size:42px 42px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}

  .checkin-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
  .checkin-card{width:100%;max-width:440px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border);padding:38px 32px 30px;text-align:center;animation:fadeInUp .5s ease;}
  .brand-tag{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-dark);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:20px;border:1px solid rgba(225,29,72,.18);}
  .brand-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);animation:pulse 1.8s infinite;}

  .logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px;}
  .logo-row img{height:30px;width:auto;object-fit:contain;}
  .logo-divider{width:1px;height:24px;background:var(--border);}
  .logo-row-topbar{margin-bottom:0;margin-right:16px;padding-right:16px;border-right:1px solid var(--border);justify-content:flex-start;}
  .logo-row-topbar img{height:22px;}
  .logo-row-topbar .logo-divider{height:18px;}
  .login-icon{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  h1.title{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 28px;line-height:1.5;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em;}
  .field input{width:100%;padding:14px 15px;border-radius:11px;border:1.5px solid var(--border);font-size:16px;font-family:inherit;background:var(--bg-elevated);color:var(--text);transition:border-color .2s,box-shadow .2s;}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .type-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;}
  .type-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--muted);cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;transition:all .15s;}
  .type-opt-icon{font-size:18px;line-height:1;}
  .type-opt:hover{border-color:var(--accent);color:var(--text);}
  .type-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);box-shadow:0 0 0 3px var(--accent-soft);}
  button.primary{width:100%;padding:16px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;margin-top:8px;font-family:inherit;box-shadow:0 8px 24px -10px var(--accent-glow);}
  button.primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px var(--accent-glow);}
  button.primary:active{transform:scale(.98);}
  button.primary:disabled{background:#3A3F4A;box-shadow:none;cursor:not-allowed;}

  .confirm{padding:22px 0 4px;}
  .check-icon{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 0 0 8px rgba(46,217,136,.08);animation:popIn .5s ease;}
  .confirm h2{font-size:19px;font-weight:800;margin:0 0 8px;}
  .confirm p{color:var(--muted);font-size:14px;margin:0;}
  .confirm .meta{margin-top:20px;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:12px;padding:15px;font-size:13.5px;color:var(--text);text-align:left;}
  .confirm .meta div{display:flex;justify-content:space-between;padding:4px 0;}
  .confirm .meta span:first-child{color:var(--muted);}

  .footer-link{margin-top:24px;font-size:12.5px;color:var(--muted);text-decoration:none;border-top:1px solid var(--border-soft);padding-top:16px;display:block;transition:color .15s;}
  .footer-link:hover{color:var(--accent);}
  .err-msg{color:var(--accent-dark);font-size:12.5px;margin-top:-6px;margin-bottom:10px;min-height:16px;text-align:left;}

  .geo-banner{font-size:12.5px;padding:10px 13px;border-radius:10px;margin-bottom:16px;text-align:left;line-height:1.5;}
  .geo-banner.checking{background:var(--info-soft);color:var(--info);display:flex;align-items:center;gap:8px;}
  .geo-banner.ok{background:var(--ok-soft);color:var(--ok);}
  .geo-banner.blocked{background:var(--accent-soft);color:var(--accent-dark);}
  .geo-spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(52,87,213,.25);border-top-color:var(--info);animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-retry{margin-left:6px;border:none;background:var(--accent-dark);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;cursor:pointer;font-family:inherit;}

  .app-shell{display:flex;min-height:100vh;width:100%;}
  .sidebar{width:220px;flex-shrink:0;background:linear-gradient(180deg,#0B2A43,#0E3552);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar-logo{display:flex;align-items:center;gap:8px;padding:0 6px 20px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar-logo img{height:20px;filter:brightness(0) invert(1);opacity:.92;}
  .sidebar-logo .div{width:1px;height:16px;background:rgba(255,255,255,.25);}
  .sidebar-title{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.01em;padding:0 6px 16px;}
  .sidebar-nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .sidebar-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;background:transparent;color:#9FB4C8;font-size:13px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;}
  .sidebar-item svg{flex-shrink:0;}
  .sidebar-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar-item.active{background:#F2A93B;color:#0B2A43;box-shadow:0 4px 12px -4px rgba(242,169,59,.5);}
  .sidebar-divider{height:1px;background:rgba(255,255,255,.1);margin:10px 4px;}
  .sidebar-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:10px;}
  .sidebar-user{display:flex;align-items:center;gap:9px;padding:6px;margin-bottom:8px;}
  .sidebar-user-avatar{width:30px;height:30px;border-radius:50%;background:#F2A93B;color:#0B2A43;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .sidebar-user-name{color:#fff;font-size:12.5px;font-weight:700;}
  .sidebar-user-role{color:#9FB4C8;font-size:10.5px;}

  .main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
  .filter-bar{background:#fff;border-bottom:1px solid var(--border-soft);padding:14px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:9;}
  .filter-bar .fb-title{font-size:17px;font-weight:800;color:var(--text);margin-right:14px;white-space:nowrap;}
  .fb-select{padding:9px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);font-size:12.5px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer;}
  .fb-search{padding:9px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);font-size:12.5px;font-family:inherit;min-width:170px;margin-left:auto;}

  .week-strip{background:#fff;border-bottom:1px solid var(--border-soft);padding:12px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .week-strip .today-btn{padding:8px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);font-weight:700;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;}
  .week-strip .today-btn:hover{border-color:var(--accent);}
  .week-strip .cur-date{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;}
  .week-strip .wk-nav{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;}
  .week-strip .wk-nav:hover{color:var(--accent);}
  .week-days{display:flex;gap:6px;margin-left:auto;}
  .week-day-btn{display:flex;flex-direction:column;align-items:center;padding:6px 13px;border-radius:9px;border:1.5px solid transparent;background:transparent;cursor:pointer;font-family:inherit;}
  .week-day-btn .wd-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .week-day-btn .wd-num{font-size:12.5px;font-weight:700;color:var(--text);margin-top:2px;}
  .week-day-btn:hover{background:var(--bg-elevated);}
  .week-day-btn.active{background:var(--accent-soft);border-color:var(--accent);}
  .week-day-btn.active .wd-name,.week-day-btn.active .wd-num{color:var(--accent-dark);}

  .category-tabs{display:flex;gap:10px;padding:16px 26px 0;flex-wrap:wrap;}
  .cat-tab{padding:14px 10px;border-radius:9px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-weight:700;font-size:13px;text-align:center;cursor:pointer;font-family:inherit;flex:1;min-width:120px;transition:all .15s;}
  .cat-tab.active{background:var(--info-soft);border-color:var(--info);color:var(--info);}

  .cal-wrap{padding:16px 26px 40px;}
  .cal-layout{display:flex;gap:16px;align-items:flex-start;}
  .cal-grid-scroll{flex:1;min-width:0;overflow-x:auto;}
  .cal-grid{display:grid;border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;background:#fff;min-width:600px;}
  .cal-head-row{display:contents;}
  .cal-cell-head{background:var(--bg-elevated);padding:10px 8px;font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);position:sticky;top:0;}
  .cal-hour-label{background:var(--bg-elevated);padding:8px;font-size:11px;font-weight:700;color:var(--muted);border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);text-align:right;white-space:nowrap;}
  .cal-cell{border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:4px;min-height:58px;display:flex;flex-direction:column;gap:4px;}
  .load-card{border-radius:7px;border:1.5px solid var(--info);background:var(--info-soft);padding:6px 8px;font-size:10.5px;cursor:pointer;transition:transform .12s;animation:fadeIn .3s ease;}
  .load-card:hover{transform:scale(1.03);}
  .load-card.despachado{border-color:var(--ok);background:var(--ok-soft);}
  .load-card.en_descarga{border-color:var(--warn);background:var(--warn-soft);}
  .load-card.en_descarga .lc-badge{background:var(--warn);}
  .load-card .lc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .load-card .lc-plate{font-weight:800;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .load-card .lc-badge{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:99px;text-transform:uppercase;}
  .load-card.despachado .lc-badge{background:var(--ok);color:#fff;}
  .load-card:not(.despachado) .lc-badge{background:var(--info);color:#fff;}
  .load-card .lc-prov{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-empty{padding:60px 20px;text-align:center;color:var(--muted);}
  .cal-empty .big{font-weight:700;color:var(--text);margin-bottom:6px;font-size:15px;}

  .cal-unassigned-panel{width:220px;flex-shrink:0;background:var(--warn-soft);border:1px solid rgba(183,121,31,.3);border-radius:12px;padding:14px;}
  .cal-unassigned-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--warn);}
  .cal-unassigned-count{display:inline-block;margin:8px 0 12px;font-size:10.5px;font-weight:700;color:var(--warn);background:#fff;padding:3px 10px;border-radius:99px;}
  .cal-unassigned-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;}
  .cal-unassigned-empty{font-size:11px;color:var(--muted);text-align:center;padding:20px 6px;}

  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);}
  .topbar h1{font-size:17px;font-weight:800;margin:0;background:linear-gradient(135deg,var(--text),#5A6070);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .topbar .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:700;margin-left:12px;}
  .topbar .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok-glow);animation:pulse 1.8s infinite;}
  .topbar .clock{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--gold);margin-left:14px;padding-left:14px;border-left:1px solid var(--border);letter-spacing:.02em;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
  .topbar-right{display:flex;gap:8px;align-items:center;}
  .icon-btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;width:37px;height:37px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .15s;}
  .icon-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .icon-btn.active-view{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent);}

  .dash-body{padding:26px 28px 60px;max-width:1120px;margin:0 auto;width:100%;}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;}
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px;}
  .stat-card{position:relative;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);overflow:hidden;animation:fadeInUp .45s ease backwards;transition:transform .2s,border-color .2s;}
  .stat-card:hover{transform:translateY(-3px);border-color:var(--border-soft);}
  .stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
  .stat-card.c-patio::before{background:var(--accent);box-shadow:0 0 12px var(--accent-glow);}
  .stat-card.c-despachados::before{background:var(--ok);box-shadow:0 0 12px var(--ok-glow);}
  .stat-card.c-promedio::before{background:var(--info);}
  .stat-card.c-hoy::before{background:var(--gold);box-shadow:0 0 12px var(--gold-glow);}
  .stat-card .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .stat-card .icon-wrap{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-card .icon-wrap svg{width:12px;height:12px;}
  .stat-card.c-patio .icon-wrap{background:var(--accent-soft);color:var(--accent);}
  .stat-card.c-despachados .icon-wrap{background:var(--ok-soft);color:var(--ok);}
  .stat-card.c-promedio .icon-wrap{background:var(--info-soft);color:var(--info);}
  .stat-card.c-hoy .icon-wrap{background:rgba(232,185,63,.14);color:var(--gold);}
  .stat-card .num{font-size:21px;font-weight:800;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace;}
  .stat-card .lbl{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;}

  .search-row{display:flex;gap:10px;margin-bottom:18px;}
  .search-row input{flex:1;padding:12px 15px;border-radius:11px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:var(--card);color:var(--text);transition:border-color .2s,box-shadow .2s;}
  .search-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-row input::placeholder{color:#5C6270;}

  .period-tabs{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:20px;}
  .period-tabs button{border:none;background:transparent;padding:9px 17px;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s;}
  .period-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 4px 14px -4px var(--accent-glow);}
  .period-tabs button:not(.active):hover{color:var(--text);}

  .controls-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}

<script>
const app = document.getElementById('app');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);

function pad(n){return n.toString().padStart(2,'0');}
function fmtDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dias[dt.getDay()]+', '+dt.getDate()+' de '+meses[dt.getMonth()];
}
function fmtShortDate(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d+' '+meses[m-1];
}

function getToken(){ return sessionStorage.getItem('tc_token') || ''; }
function getRole(){ return sessionStorage.getItem('tc_role') || ''; }
function getUsername(){ return sessionStorage.getItem('tc_username') || ''; }
function isAdmin(){ return getRole() === 'admin'; }
function clearSession(){ sessionStorage.removeItem('tc_token'); sessionStorage.removeItem('tc_role'); sessionStorage.removeItem('tc_username'); }

async function apiGet(path){
  let r;
  try{
    r = await fetch(path, { headers: getToken() ? { 'Authorization': 'Bearer '+getToken() } : {} });
  }catch(e){
    throw new Error('No se pudo conectar con el servidor. Revisa tu conexión o que el sitio esté bien desplegado en Netlify.');
  }
  if(r.status === 403){ clearSession(); location.hash='panel'; throw new Error('Tu sesión expiró, inicia sesión de nuevo.'); }
  if(!r.ok) throw new Error('Error al consultar '+path);
  return r.json();
}
async function apiPost(path, body){
  let r;
  try{
    r = await fetch(path, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', ...(getToken() ? {'Authorization':'Bearer '+getToken()} : {}) },
      body: JSON.stringify(body)
    });
  }catch(e){
    throw new Error('No se pudo conectar con el servidor (Failed to fetch). Verifica que el sitio esté desplegado en Netlify con las funciones activas, y que no haya un bloqueador de contenido interfiriendo.');
  }
  const data = await r.json();
  if(!r.ok) throw new Error(data.error || 'Error al guardar');
  return data;
}
async function apiPatch(path, body){
  const r = await fetch(path, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json', ...(getToken() ? {'Authorization':'Bearer '+getToken()} : {}) },
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error || 'Error al actualizar');
  return data;
}
async function apiDelete(path, body){
  const r = await fetch(path, {
    method:'DELETE',
    headers:{ 'Content-Type':'application/json', ...(getToken() ? {'Authorization':'Bearer '+getToken()} : {}) },
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error || 'Error al eliminar');
  return data;
}

async function getSettings(){ try{ return await apiGet('/api/settings'); }catch(e){ return {}; } }
async function saveSettings(obj){ return apiPost('/api/settings', obj); }
async function loadArrivals(){ try{ return await apiGet('/api/arrivals'); }catch(e){ return []; } }
async function loadFormFields(){ try{ return await apiGet('/api/formfields'); }catch(e){ return []; } }

// ---------------- ROUTING ----------------
function route(){
  if(getToken()) renderDashboard();
  else renderLogin();
}
window.addEventListener('hashchange', route);

// ---------------- CHECK-IN VIEW ----------------
let geoState = { ok: true, checked: false, distance: null, coords: null };
let selectedTransportType = null;
let checkinCustomFields = [];
let checkinCategories = [];
let checkinFieldRequired = {};

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function renderCheckin(){

    <div class="checkin-wrap">
      <div class="checkin-card">
        <div class="logo-row">
          <img src="/assets/novex.png" alt="NOVEX">
          <div class="logo-divider"></div>
          <img src="/assets/vidri.png" alt="VIDRI">
        </div>
        <div class="brand-tag"><span class="dot"></span>CD NOVEX</div>
        <h1 class="title">Registro de llegada</h1>
        <p class="sub">Escanea, ingresa tus datos y quedas registrado. Sin filas, sin llamadas.</p>
        <div id="geoBanner"></div>
        <div id="formArea">
          <div class="field"><label id="lblProvider">Proveedor</label><input id="inProvider" type="text" placeholder="Ej. Transportes García" autocomplete="off"></div>
          <div class="field"><label id="lblDriverName">Nombre del motorista</label><input id="inName" type="text" placeholder="Ej. Juan Pérez" autocomplete="off"></div>
          <div class="field"><label id="lblPhone">Teléfono</label><input id="inPhone" type="tel" placeholder="Ej. +503 7123-4567" autocomplete="off"></div>
          <div class="field"><label id="lblPlate">Placa</label><input id="inPlate" type="text" placeholder="Ej. N-1234" autocomplete="off"></div>
          <div class="field">
            <label id="lblTransportType">Tipo de transporte</label>
            <div class="type-options" id="typeOptions"></div>
          </div>

          <button class="primary" id="btnSubmit">Registrar llegada</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('btnSubmit').onclick = submitArrival;
  document.getElementById('inPlate').addEventListener('keydown', e=>{ if(e.key==='Enter') submitArrival(); });

  Promise.all([getFieldLabels(), getFieldRequired()]).then(([labels, required])=>{
    checkinFieldRequired = required;

    document.querySelectorAll('.type-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.type-opt').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');

      });

async function initGeofenceCheck(){
  const settings = await getSettings();
  const banner = document.getElementById('geoBanner');
  const btn = document.getElementById('btnSubmit');
  if(!banner || !btn) return;

  if(!settings.geofenceEnabled || settings.geofenceLat==null || settings.geofenceLng==null){
    geoState = { ok:true, checked:true, distance:null, coords:null };
    return;
  }

  btn.disabled = true;
  banner.innerHTML = `<div class="geo-banner checking"><span class="geo-spin"></span>Verificando tu ubicación...</div>`;

  runGeofenceCheck(settings);
}

function runGeofenceCheck(settings){
  const banner = document.getElementById('geoBanner');
  const btn = document.getElementById('btnSubmit');
  if(!navigator.geolocation){
    geoState = { ok:false, checked:true, distance:null, coords:null };
    banner.innerHTML = `<div class="geo-banner blocked">Tu navegador no permite verificar la ubicación, así que no podemos confirmar que estás en CD NOVEX.</div>`;
    btn.disabled = true;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, settings.geofenceLat, settings.geofenceLng);
      const ok = dist <= settings.geofenceRadius;
      geoState = { ok, checked:true, distance:Math.round(dist), coords:{lat:pos.coords.latitude, lng:pos.coords.longitude} };
      if(ok){
        banner.innerHTML = `<div class="geo-banner ok">Ubicación verificada — estás dentro del área de CD NOVEX.</div>`;
        btn.disabled = false;
      } else {
        banner.innerHTML = `<div class="geo-banner blocked">Estás a ${Math.round(dist)} m del centro. Debes estar a menos de ${settings.geofenceRadius} m para registrarte. <button type="button" class="geo-retry" id="geoRetry">Reintentar</button></div>`;
        btn.disabled = true;
        document.getElementById('geoRetry').onclick = ()=>runGeofenceCheck(settings);
      }
    },
    ()=>{
      geoState = { ok:false, checked:true, distance:null, coords:null };
      banner.innerHTML = `<div class="geo-banner blocked">No pudimos acceder a tu ubicación. Activa el permiso de ubicación de tu navegador e intenta de nuevo. <button type="button" class="geo-retry" id="geoRetry">Reintentar</button></div>`;
      btn.disabled = true;
      document.getElementById('geoRetry').onclick = ()=>runGeofenceCheck(settings);
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}

}

function localDateParts(offsetDays){
  const local = new Date(nowElSalvador().getTime() + (offsetDays||0)*24*60*60*1000);
  return { y: local.getUTCFullYear(), m: local.getUTCMonth(), d: local.getUTCDate(), key: local.toISOString().slice(0,10) };
}

function dayLabel(offsetDays){
  const parts = localDateParts(offsetDays);
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const dt = new Date(Date.UTC(parts.y, parts.m, parts.d));
  let label = `${dias[dt.getUTCDay()]}, ${parts.d} de ${meses[parts.m]}`;
  if(offsetDays === 0) label = 'Hoy · ' + label;
  return label;
}

function updateDayNav(){
  const lbl = document.getElementById('dayLabel');
  const nextBtn = document.getElementById('dayNext');
  if(!lbl || !nextBtn) return;
  lbl.textContent = dayLabel(dayOffset);
  nextBtn.disabled = dayOffset >= 0;
}

function inPeriod(r, period){
  if(period === 'all') return true;
  const parts = localDateParts(period === 'day' ? dayOffset : 0);
  if(period === 'day') return r.date === parts.key;
  if(period === 'week'){
    const weekAgo = Date.now() - 7*24*60*60*1000;
    return r.ts >= weekAgo;
  }
  if(period === 'month'){
    const [ry, rm] = r.date.split('-').map(Number);
    return ry === parts.y && (rm-1) === parts.m;
  }
  return true;
}

function phoneToWhatsApp(phone){
  if(!phone) return '';
  const trimmed = phone.trim();
  const digits = trimmed.replace(/[^0-9]/g,'');
  if(!digits) return '';
  if(trimmed.startsWith('+')) return digits; // ya incluye código de país (+503, +502, +506...)
  if(digits.length > 8) return digits; // probablemente ya trae código de país sin el "+"
  return '503' + digits; // número local de 8 dígitos: se asume El Salvador
}

function fmtTimeMs(ms){
  if(!ms) return '';
  const local = new Date(ms - 6*60*60*1000);
  return pad(local.getUTCHours())+':'+pad(local.getUTCMinutes());
}

function fmtDuration(minutes){
  const m = Math.max(0, Math.round(minutes));
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), rem = m % 60;
  return h + 'h ' + rem + 'm';
}

function animateCountUp(el, from, to, duration){
  if(from === to){ el.textContent = to; return; }
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = Math.round(from + (to-from)*eased);
    el.textContent = val;
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = to;
  }
  requestAnimationFrame(step);
}

  const local = new Date(nowElSalvador().getTime() + dayOffset*24*60*60*1000);
  const dow = local.getUTCDay();
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const mondayOffset = dayOffset + diffToMonday;

  const dias = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let html = '';
  for(let i=0;i<7;i++){
    const off = mondayOffset + i;
    const p = localDateParts(off);
    const isActive = off === dayOffset;
    html += `<button type="button" class="week-day-btn ${isActive?'active':''}" data-off="${off}">
      <span class="wd-name">${dias[i]}</span><span class="wd-num">${p.d}</span>

  wd.innerHTML = html;

      renderCalendarShellState();
      renderCalendarView();
    });
  });
}

const CAL_HOURS = Array.from({length:15}, (_,i)=>i+6); // 06:00 a 20:00

function dockColumnsFor(records, configuredDocks){
  const docks = new Set(configuredDocks || []);
  records.forEach(r=>{ if(r.dock) docks.add(String(r.dock)); });
  let cols = Array.from(docks);
  if((!configuredDocks || configuredDocks.length === 0) && cols.length === 0) cols = ['1','2','3','4'];
  cols.sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  return cols;
}

async function renderCalendarView(){
  cachedArrivals = await loadArrivals();
  const configuredDocks = await loadDocks();
  const parts = localDateParts(dayOffset);
  let dayRecords = cachedArrivals.filter(r => r.date === parts.key);
  if(calCategory !== 'Todos') dayRecords = dayRecords.filter(r => r.transportType === calCategory);
  if(calSearchTerm){
    dayRecords = dayRecords.filter(r =>
      (r.plate||'').toLowerCase().includes(calSearchTerm) ||
      (r.provider||'').toLowerCase().includes(calSearchTerm) ||
      (r.driverName||'').toLowerCase().includes(calSearchTerm)
    );
  }
  if(calDockFilter !== 'Todos'){
    dayRecords = dayRecords.filter(r => (r.dock ? String(r.dock) : 'S/A') === calDockFilter);
  }

  const gridArea = document.getElementById('calGridArea');
  if(!gridArea) return;

  if(dayRecords.length === 0){
    gridArea.innerHTML = `<div class="cal-empty"><div class="big">No hay registros este día</div>Prueba otro día, categoría, muelle o búsqueda.</div>`;
    return;
  }

  const unassignedRecords = dayRecords.filter(r => !r.dock).sort((a,b)=>a.ts-b.ts);
  const assignedRecords = dayRecords.filter(r => r.dock);
  const showOnlyUnassigned = calDockFilter === 'S/A';
  const cols = showOnlyUnassigned ? [] : (calDockFilter !== 'Todos' ? [calDockFilter] : dockColumnsFor(assignedRecords, configuredDocks));
  const byCell = {};
  assignedRecords.forEach(r=>{
    const hour = Math.min(20, Math.max(6, parseInt((r.time||'06:00').split(':')[0], 10)));
    const col = String(r.dock);
    const key = `${hour}-${col}`;
    (byCell[key] = byCell[key] || []).push(r);
  });

  function loadCardHtml(r){
    const isDone = r.status === 'despachado';
    const isUnloading = r.status === 'en_descarga';
    const badge = isDone ? 'Listo' : (isUnloading ? 'Descarga' : r.time);
    return `<div class="load-card ${isDone?'despachado':''} ${isUnloading?'en_descarga':''}" data-edit="${r.id}">
      <div class="lc-top"><span class="lc-plate">${r.plate||'—'}</span><span class="lc-badge">${badge}</span></div>
      <div class="lc-prov">${r.provider||''}</div>
    </div>`;
  }

  let gridHtml = '';
  if(cols.length > 0){

function greenTintStyle(waitMinutes){
  const t = Math.min(1, Math.max(0, waitMinutes / 120)); // llega a verde completo tras 2 horas
  const r = Math.round(255 + (215 - 255) * t);
  const g = Math.round(255 + (241 - 255) * t);
  const b = Math.round(255 + (223 - 255) * t);
  const borderT = Math.min(1, t * 1.3);
  return `background-color:rgb(${r},${g},${b});border-color:rgba(20,154,92,${(borderT*.4).toFixed(2)});`;
}

const DEFAULT_CATEGORIES = ['Contenedor', 'Camión', 'Otros'];

  plate: 'Placa',
  transportType: 'Tipo de transporte'
};

  phone: true,
  plate: true,
  transportType: true
};
const CATEGORY_ICONS = { 'Contenedor':'📦', 'Camión':'🚛', 'Otros':'🔹' };
function categoryIcon(name){ return CATEGORY_ICONS[name] || '🏷️'; }

async function getFieldLabels(){
  const s = await getSettings();
  return Object.assign({}, DEFAULT_FIELD_LABELS, s.fieldLabels || {});
}
async function getFieldRequired(){
  const s = await getSettings();
  return Object.assign({}, DEFAULT_FIELD_REQUIRED, s.fieldRequired || {});
}
async function getTransportCategories(){
  const s = await getSettings();
  return (Array.isArray(s.transportCategories) && s.transportCategories.length) ? s.transportCategories : DEFAULT_CATEGORIES;
}
function buildTypeGroups(categories){
  return categories.map(c => ({ key: c, label: c, icon: categoryIcon(c) }));
}

        <label>WhatsApp de recepción — llegadas</label>
        <input id="setWhatsapp" value="${s.notifyWhatsapp||''}" placeholder="+503 7123-4567, +502 7234-5678">
        <div class="field-hint">Estos números se envían al webhook para que tu escenario de Zapier/Make les mande el mensaje de WhatsApp cuando alguien haga check-in. Separa varios con coma.</div>
      </div>
      <div class="field"><label>URL del webhook</label><input id="setWebhook" value="${s.webhookUrl||''}" placeholder="https://hooks.zapier.com/..."></div>

      <div class="section-label">Geocerca del registro</div>
      <p class="hint" style="margin-top:-6px;">Si la activas, solo se podrá registrar una llegada desde dentro del radio que definas alrededor de CD NOVEX.</p>
      <label class="checkbox-field">
        <input type="checkbox" id="setGeoEnabled" ${s.geofenceEnabled ? 'checked' : ''}>
        <span>Exigir ubicación dentro del radio para registrarse</span>
      </label>
      <div class="field"><label>Radio permitido (metros)</label><input id="setGeoRadius" type="number" min="10" value="${s.geofenceRadius||150}" placeholder="150"></div>
      <div class="field-row">
        <div class="field"><label>Latitud del centro</label><input id="setGeoLat" value="${s.geofenceLat||''}" placeholder="13.6929"></div>
        <div class="field"><label>Longitud del centro</label><input id="setGeoLng" value="${s.geofenceLng||''}" placeholder="-89.2182"></div>
      </div>
      <button type="button" class="btn-secondary" id="btnUseMyLocation" style="width:100%;margin-bottom:6px;">📍 Usar mi ubicación actual como centro</button>
      <div class="geo-hint" id="geoLocHint"></div>

      <div class="modal-actions">
        <button class="btn-secondary" id="setClose">Cancelar</button>
        <button class="btn-primary-sm" id="setSave">Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#setClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#btnUseMyLocation').onclick = ()=>{
    const hint = document.getElementById('geoLocHint');
    if(!navigator.geolocation){ hint.textContent = 'Tu navegador no soporta geolocalización.'; hint.className='geo-hint err'; return; }
    hint.textContent = 'Obteniendo tu ubicación...'; hint.className = 'geo-hint';
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        document.getElementById('setGeoLat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('setGeoLng').value = pos.coords.longitude.toFixed(6);
        hint.textContent = 'Ubicación capturada (precisión ~' + Math.round(pos.coords.accuracy) + ' m).';
        hint.className = 'geo-hint ok';
      },
      ()=>{ hint.textContent = 'No se pudo obtener tu ubicación. Revisa los permisos del navegador.'; hint.className='geo-hint err'; },
      { enableHighAccuracy:true, timeout:10000 }
    );
  };
  overlay.querySelector('#setSave').onclick = async ()=>{
    try{
      const lat = parseFloat(document.getElementById('setGeoLat').value);
      const lng = parseFloat(document.getElementById('setGeoLng').value);
      const radius = parseFloat(document.getElementById('setGeoRadius').value);
      await saveSettings({
        notifyEmail: document.getElementById('setEmail').value.trim(),
        suggestionsEmail: document.getElementById('setSuggEmail').value.trim(),
        notifyWhatsapp: document.getElementById('setWhatsapp').value.trim(),
        webhookUrl: document.getElementById('setWebhook').value.trim(),
        geofenceEnabled: document.getElementById('setGeoEnabled').checked,
        geofenceLat: isNaN(lat) ? null : lat,
        geofenceLng: isNaN(lng) ? null : lng,
        geofenceRadius: isNaN(radius) ? 150 : radius
      });
      overlay.remove();
      toast('Configuración guardada');
    }catch(e){
      toast(e.message || 'No se pudo guardar');
    }
  };
}

async function showEditModal(record){
  const docks = await loadDocks();
  const dockOptions = [...docks];
  if(record.dock && !dockOptions.includes(record.dock)) dockOptions.push(record.dock);
  const labels = await getFieldLabels();
  const categories = await getTransportCategories();
  const typeOptions = [...categories];
  if(record.transportType && !typeOptions.includes(record.transportType)) typeOptions.push(record.transportType);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const customEntries = Object.entries(record.customFields || {});
  overlay.innerHTML = `
    <div class="modal">
      <h3>Editar registro</h3>
      <p class="hint">Corrige los datos o elimina el registro por completo.</p>
      <div class="field"><label>${labels.provider}</label><input id="editProvider" value="${record.provider||''}"></div>
      <div class="field"><label>${labels.driverName}</label><input id="editDriver" value="${record.driverName||''}"></div>
      <div class="field"><label>${labels.phone}</label><input id="editPhone" value="${record.phone||''}"></div>
      <div class="field"><label>${labels.plate}</label><input id="editPlate" value="${record.plate||''}"></div>
      <div class="field"><label>${labels.transportType}</label>
        <select id="editType" style="width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);font-family:inherit;font-size:13.5px;background:var(--bg-elevated);color:var(--text);">
          ${typeOptions.map(t=>`<option value="${t}" ${record.transportType===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Muelle asignado</label>
        <select id="editDock" style="width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);font-family:inherit;font-size:13.5px;background:var(--bg-elevated);color:var(--text);">
          <option value="" ${!record.dock?'selected':''}>Sin muelle</option>
          ${dockOptions.map(d=>`<option value="${d}" ${record.dock===d?'selected':''}>${d}</option>`).join('')}
        </select>
        ${dockOptions.length===0 ? `<div class="field-hint">Aún no has configurado muelles — ve a "Muelles" en el menú para agregarlos.</div>` : ''}
      </div>
      <div class="field"><label>Estado</label>
        <select id="editStatus" style="width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);font-family:inherit;font-size:13.5px;background:var(--bg-elevated);color:var(--text);">
          <option value="esperando" ${record.status==='esperando'?'selected':''}>Esperando</option>
          <option value="en_descarga" ${record.status==='en_descarga'?'selected':''}>En descarga</option>
          <option value="despachado" ${record.status==='despachado'?'selected':''}>Despachado</option>
        </select>
        <div class="field-hint">Cambiar el estado aquí también actualiza las horas de inicio de descarga / despacho.</div>
      </div>
      ${customEntries.length ? `<div class="section-label">Campos adicionales</div>` + customEntries.map(([k,v])=>`<div class="field"><label>${k}</label><input class="edit-custom" data-key="${k}" value="${v}"></div>`).join('') : ''}
      <div class="modal-actions">
        <button class="btn-secondary" style="border-color:var(--accent);color:var(--accent-dark);" id="editDelete">Eliminar registro</button>
        <button class="btn-primary-sm" id="editSave">Guardar cambios</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#editDelete').onclick = async ()=>{
    if(!confirm('¿Eliminar este registro permanentemente? Esta acción no se puede deshacer.')) return;
    try{
      await apiDelete('/api/arrivals', { id: record.id });
      overlay.remove();
      toast('Registro eliminado');
      if(activeNavView === 'calendar') renderCalendarView(); else renderList();
    }catch(e){ toast(e.message || 'No se pudo eliminar'); }
  };
  overlay.querySelector('#editSave').onclick = async ()=>{
    try{
      const customFields = {};
      overlay.querySelectorAll('.edit-custom').forEach(inp=>{ customFields[inp.dataset.key] = inp.value.trim(); });
      await apiPatch('/api/arrivals', {
        id: record.id,
        provider: document.getElementById('editProvider').value.trim(),
        driverName: document.getElementById('editDriver').value.trim(),
        phone: document.getElementById('editPhone').value.trim(),
        plate: document.getElementById('editPlate').value.trim(),
        transportType: document.getElementById('editType').value,
        dock: document.getElementById('editDock').value.trim(),
        status: document.getElementById('editStatus').value,
        customFields
      });
      overlay.remove();
      toast('Registro actualizado');
      if(activeNavView === 'calendar') renderCalendarView(); else renderList();
    }catch(e){ toast(e.message || 'No se pudo guardar'); }
  };
}

    }
    list.innerHTML = currentFields.map((f,i)=>`
      <div class="admin-list-row">

    const list = document.getElementById('categoriesList');

    currentCategories.push(name);
    document.getElementById('newCategoryName').value = '';
    renderCategoriesList();
  };
  overlay.querySelector('#btnAddField').onclick = ()=>{
    const label = document.getElementById('newFieldLabel').value.trim();
    if(!label){ toast('Escribe una etiqueta para el campo'); return; }
    const id = 'f' + Date.now();
    currentFields.push({ id, label, type: document.getElementById('newFieldType').value, required: document.getElementById('newFieldRequired').checked });
    document.getElementById('newFieldLabel').value = '';
    document.getElementById('newFieldRequired').checked = false;
    renderFieldsList();
  };
  overlay.querySelector('#fieldsSave').onclick = async ()=>{
    try{
      const cleanCategories = currentCategories.map(c=>c.trim()).filter(Boolean);
      const newLabels = {
        provider: document.getElementById('lblFieldProvider').value.trim() || DEFAULT_FIELD_LABELS.provider,
        driverName: document.getElementById('lblFieldDriver').value.trim() || DEFAULT_FIELD_LABELS.driverName,
        phone: document.getElementById('lblFieldPhone').value.trim() || DEFAULT_FIELD_LABELS.phone,
        plate: document.getElementById('lblFieldPlate').value.trim() || DEFAULT_FIELD_LABELS.plate,
        transportType: document.getElementById('lblFieldType').value.trim() || DEFAULT_FIELD_LABELS.transportType
      };
      const newRequired = {
        provider: document.getElementById('reqField_provider').checked,
        driverName: document.getElementById('reqField_driverName').checked,
        phone: document.getElementById('reqField_phone').checked,
        plate: document.getElementById('reqField_plate').checked,
        transportType: document.getElementById('reqField_transportType').checked
      };
      const currentSettings = await getSettings();
      await saveSettings(Object.assign({}, currentSettings, { fieldLabels: newLabels, fieldRequired: newRequired, transportCategories: cleanCategories }));
      await apiPost('/api/formfields', { fields: currentFields });
      overlay.remove();
      toast('Campos del formulario actualizados');
      if(activeNavView === 'calendar') renderCalendarShell().then(renderCalendarView); else renderList();
    }catch(e){ toast(e.message || 'No se pudo guardar'); }
  };
}

async function showUsersModal(){

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Usuarios</h3>

      <div class="field"><label>Usuario</label><input id="newUsername" placeholder="ej. recepcion1" autocomplete="off"></div>

        <select id="newUserRole" style="flex:1;">
          <option value="viewer">Vista</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <button type="button" class="btn-secondary" id="btnAddUser" style="width:100%;margin-top:10px;">+ Crear usuario</button>
      <div class="modal-actions">
        <button class="btn-secondary" id="usersClose">Cerrar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  function renderUsersList(){
    const list = document.getElementById('usersList');
    if(users.length === 0){ list.innerHTML = `<div class="empty-list">No hay usuarios</div>`; return; }
    list.innerHTML = users.map(u=>`
      <div class="admin-list-row">
        <div><div class="name">${u.username}</div><div class="sub">${u.role==='admin'?'Administrador':'Vista'}</div></div>
        ${u.username===getUsername() ? '' : `<button class="del-btn" data-u="${u.username}" title="Eliminar usuario"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
      </div>
    `).join('');
    list.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm(`¿Eliminar al usuario "${btn.dataset.u}"?`)) return;
        try{
          await apiDelete('/api/users', { username: btn.dataset.u });
          users = users.filter(u=>u.username !== btn.dataset.u);
          renderUsersList();
          toast('Usuario eliminado');
        }catch(e){ toast(e.message || 'No se pudo eliminar'); }
      };
    });
  }
  renderUsersList();

  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#usersClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#btnAddUser').onclick = async ()=>{
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newUserPw').value;
    const role = document.getElementById('newUserRole').value;
    if(!username || !password){ toast('Completa usuario y contraseña'); return; }
    try{
      await apiPost('/api/users', { username, password, role });
      toast('Usuario creado');
      document.getElementById('newUsername').value = '';
      document.getElementById('newUserPw').value = '';
      users = await apiGet('/api/users');
      renderUsersList();
    }catch(e){ toast(e.message || 'No se pudo crear el usuario'); }
  };
}

  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#suggClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#suggSend').onclick = async ()=>{
    const message = document.getElementById('suggText').value.trim();
    if(!message){ toast('Escribe tu sugerencia'); return; }
    try{
      await apiPost('/api/suggestions', { message });
      overlay.remove();
      toast('¡Gracias! Tu sugerencia fue enviada');
    }catch(e){ toast(e.message || 'No se pudo enviar'); }
  };
}

route();
</script>
</body>
</html>
