<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Control · Llegadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEDF0;
    --bg-elevated:#F4F5F7;
    --card:#FFFFFF;
    --card-hover:#F7F8FA;
    --border:#E1E4E9;
    --border-soft:#EAECEF;
    --text:#1C1F26;
    --muted:#6B7280;
    --accent:#E11D48;
    --accent-dark:#AF1338;
    --accent-glow:rgba(225,29,72,.22);
    --accent-soft:rgba(225,29,72,.09);
    --ok:#149A5C;
    --ok-glow:rgba(20,154,92,.22);
    --ok-soft:rgba(20,154,92,.09);
    --gold:#B8860B;
    --gold-glow:rgba(184,134,11,.2);
    --info:#3457D5;
    --sky:#0EA5E9;
    --sky-soft:#E0F6FF;
    --warn:#B7791F;
    --warn-soft:rgba(183,121,31,.12);
    --info-soft:rgba(52,87,213,.09);
    --radius:16px;
    --shadow:0 1px 2px rgba(20,22,28,.05), 0 20px 44px -22px rgba(20,22,28,.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s ease;}
  body.dashboard-bg{
    background-image:linear-gradient(rgba(238,240,244,.90),rgba(238,240,244,.90)), url('/assets/fleet-bg.jpg');
    background-size:cover;
    background-position:center 40%;
    background-attachment:fixed;
    background-repeat:no-repeat;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .bg-orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.16;z-index:0;pointer-events:none;transition:margin .5s ease-out;}
  .bg-orb.o1{width:520px;height:520px;background:var(--accent);top:-180px;left:-140px;animation:drift1 16s ease-in-out infinite, breathe1 6s ease-in-out infinite;}
  .bg-orb.o2{width:460px;height:460px;background:var(--gold);bottom:-200px;right:-160px;animation:drift2 19s ease-in-out infinite, breathe2 7s ease-in-out infinite;}
  .bg-orb.o3{width:380px;height:380px;background:var(--info);top:40%;left:60%;animation:drift3 22s ease-in-out infinite;opacity:.10;}
  .bg-orb.o4{width:260px;height:260px;background:var(--ok);top:10%;right:10%;animation:drift4 14s ease-in-out infinite;opacity:.10;}
  .bg-orb.o5{width:300px;height:300px;background:var(--accent);bottom:8%;left:8%;animation:drift5 18s ease-in-out infinite;opacity:.09;}
  @keyframes breathe1{0%,100%{opacity:.16;}50%{opacity:.24;}}
  @keyframes breathe2{0%,100%{opacity:.16;}50%{opacity:.22;}}
  @keyframes drift4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.15);}}
  @keyframes drift5{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(35px,-45px) scale(.9);}}
  @keyframes drift1{0%,100%{transform:translate(0,0);}33%{transform:translate(90px,60px);}66%{transform:translate(40px,110px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}33%{transform:translate(-80px,-55px);}66%{transform:translate(-30px,-100px);}}
  @keyframes drift3{0%,100%{transform:translate(0,0);}50%{transform:translate(-70px,80px);}}
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
    background-image:linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size:42px 42px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}

  .checkin-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
  .checkin-card{width:100%;max-width:440px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border);padding:38px 32px 30px;text-align:center;animation:fadeInUp .5s ease;}
  .brand-tag{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-dark);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:20px;border:1px solid rgba(225,29,72,.18);}
  .brand-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);animation:pulse 1.8s infinite;}

  .logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px;}
  .logo-row img{height:30px;width:auto;object-fit:contain;}
  .logo-divider{width:1px;height:24px;background:var(--border);}
  .logo-row-topbar{margin-bottom:0;margin-right:16px;padding-right:16px;border-right:1px solid var(--border);justify-content:flex-start;}
  .logo-row-topbar img{height:22px;}
  .logo-row-topbar .logo-divider{height:18px;}
  .login-icon{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  h1.title{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 28px;line-height:1.5;}
  .field{text-align:left;margin-bottom:16px;}
  .field > label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.04em;}
  .field > input{width:100%;padding:14px 15px;border-radius:11px;border:1.5px solid var(--border);font-size:16px;font-family:inherit;background:var(--bg-elevated);color:var(--text);transition:border-color .2s,box-shadow .2s;}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .type-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;}
  .country-picker{display:flex;flex-direction:column;gap:8px;}
  .country-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--text);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;text-align:left;transition:all .15s;}
  .country-opt .co-flag{font-size:20px;line-height:1;}
  .country-opt:hover{border-color:var(--accent);}
  .country-opt.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
  .type-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--muted);cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;transition:all .15s;}
  .type-opt-icon{font-size:18px;line-height:1;}
  .type-opt:hover{border-color:var(--accent);color:var(--text);}
  .type-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);box-shadow:0 0 0 3px var(--accent-soft);}
  button.primary{width:100%;padding:16px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s;margin-top:8px;font-family:inherit;box-shadow:0 8px 24px -10px var(--accent-glow);}
  button.primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px var(--accent-glow);}
  button.primary:active{transform:scale(.98);}
  button.primary:disabled{background:#3A3F4A;box-shadow:none;cursor:not-allowed;}

  .confirm{padding:22px 0 4px;}
  .check-icon{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 0 0 8px rgba(46,217,136,.08);animation:popIn .5s ease;}
  .confirm h2{font-size:19px;font-weight:800;margin:0 0 8px;}
  .confirm p{color:var(--muted);font-size:14px;margin:0;}
  .confirm .meta{margin-top:20px;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:12px;padding:15px;font-size:13.5px;color:var(--text);text-align:left;}
  .confirm .meta div{display:flex;justify-content:space-between;padding:4px 0;}
  .confirm .meta span:first-child{color:var(--muted);}
  .dock-status-box{margin-top:14px;display:flex;align-items:center;gap:12px;border-radius:12px;padding:14px 15px;text-align:left;}
  .dock-status-box.waiting{background:var(--bg-elevated);border:1px solid var(--border-soft);color:var(--muted);}
  .dock-status-box.assigned{background:var(--ok-soft);border:1px solid rgba(46,217,136,.35);color:#1C1F26;}
  .dock-status-icon{flex:0 0 auto;}
  .dock-status-box.waiting .dock-status-icon{color:var(--muted);}
  .dock-status-box.assigned .dock-status-icon{color:#0F8A4F;}
  .dock-status-title{font-weight:800;font-size:14px;color:var(--text);}
  .dock-status-sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .footer-link{margin-top:24px;font-size:12.5px;color:var(--muted);text-decoration:none;border-top:1px solid var(--border-soft);padding-top:16px;display:block;transition:color .15s;}
  .footer-link:hover{color:var(--accent);}
  .err-msg{color:var(--accent-dark);font-size:12.5px;margin-top:-6px;margin-bottom:10px;min-height:16px;text-align:left;}

  .geo-banner{font-size:12.5px;padding:10px 13px;border-radius:10px;margin-bottom:16px;text-align:left;line-height:1.5;}
  .geo-banner.checking{background:var(--info-soft);color:var(--info);display:flex;align-items:center;gap:8px;}
  .geo-banner.ok{background:var(--ok-soft);color:var(--ok);}
  .geo-banner.blocked{background:var(--accent-soft);color:var(--accent-dark);}
  .geo-spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(52,87,213,.25);border-top-color:var(--info);animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-retry{margin-left:6px;border:none;background:var(--accent-dark);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;cursor:pointer;font-family:inherit;}

  .app-shell{display:flex;min-height:100vh;width:100%;position:relative;}
  .sidebar{width:220px;flex-shrink:0;background:linear-gradient(180deg,#0B2A43,#0E3552);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .25s ease;z-index:100;}
  .sidebar-toggle-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--text);cursor:pointer;flex-shrink:0;}
  .sidebar-backdrop{display:none;}
  .sidebar-logo{display:flex;align-items:center;gap:8px;padding:0 6px 20px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1);}
  .sidebar-logo img{height:20px;filter:brightness(0) invert(1);opacity:.92;}
  .sidebar-logo .div{width:1px;height:16px;background:rgba(255,255,255,.25);}
  .sidebar-title{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.01em;padding:0 6px 16px;}
  .sidebar-nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .sidebar-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;background:transparent;color:#9FB4C8;font-size:13px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;}
  .sidebar-item svg{flex-shrink:0;}
  .sidebar-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar-item.active{background:#F2A93B;color:#0B2A43;box-shadow:0 4px 12px -4px rgba(242,169,59,.5);}
  .sidebar-divider{height:1px;background:rgba(255,255,255,.1);margin:10px 4px;}
  .sidebar-submenu{flex-direction:column;gap:2px;padding-left:14px;margin-top:2px;}
  .sidebar-item.sub{font-size:12px;padding:8px 12px;color:#8AA0B5;}
  .sidebar-item.sub.active{background:rgba(242,169,59,.18);color:#F2A93B;}

  .insights-table-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:14px;background:#fff;}
  .insights-table{width:100%;border-collapse:collapse;font-size:13px;}
  .insights-table thead th{text-align:left;padding:12px 16px;background:var(--bg-elevated);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  .insights-table th.filterable-th{cursor:pointer;user-select:none;transition:background .15s,color .15s;}
  .insights-table th.filterable-th:hover{background:var(--border-soft);color:var(--text);}
  .insights-table th.filterable-th span{display:inline-flex;align-items:center;gap:5px;}
  .insights-table th.filterable-th svg{opacity:.5;flex-shrink:0;vertical-align:middle;margin-left:4px;}
  .insights-table th.filterable-th.has-filter{background:var(--accent-soft);color:var(--accent-dark);}
  .insights-table th.filterable-th.has-filter svg{opacity:1;color:var(--accent-dark);}
  .insights-table tbody td{padding:11px 16px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  .insights-table tbody tr:last-child td{border-bottom:none;}
  .insights-table tbody tr:hover{background:var(--bg-elevated);}
  .insights-table td.mono{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .insights-status-badge{font-size:10px;font-weight:800;padding:4px 11px;border-radius:99px;text-transform:uppercase;}
  .insights-status-badge.esperando{background:var(--accent-soft);color:var(--accent-dark);}
  .insights-status-badge.en_descarga{background:var(--warn-soft);color:var(--warn);}
  .insights-status-badge.despachado{background:var(--ok-soft);color:var(--ok);}
  .insights-table-count{padding:12px 16px;font-size:11.5px;color:var(--muted);text-align:right;}
  .sidebar-footer{border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:10px;}
  .sidebar-user{display:flex;align-items:center;gap:9px;padding:6px;margin-bottom:8px;}
  .sidebar-user-avatar{width:30px;height:30px;border-radius:50%;background:#F2A93B;color:#0B2A43;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .sidebar-user-name{color:#fff;font-size:12.5px;font-weight:700;}
  .sidebar-user-role{color:#9FB4C8;font-size:10.5px;}

  .main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
  .filter-bar{background:#fff;border-bottom:1px solid var(--border-soft);padding:14px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:9;}
  .filter-bar .fb-title{font-size:17px;font-weight:800;color:var(--text);margin-right:14px;white-space:nowrap;}
  .fb-select{padding:9px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);font-size:12.5px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer;}
  .fb-search{padding:9px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);font-size:12.5px;font-family:inherit;min-width:170px;margin-left:auto;}

  .week-strip{background:#fff;border-bottom:1px solid var(--border-soft);padding:12px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .week-strip .today-btn{padding:8px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg-elevated);font-weight:700;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;}
  .week-strip .today-btn:hover{border-color:var(--accent);}
  .week-strip .cur-date{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;}
  .week-strip .wk-nav{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;}
  .week-strip .wk-nav:hover{color:var(--accent);}
  .week-days{display:flex;gap:6px;margin-left:auto;}
  .week-day-btn{display:flex;flex-direction:column;align-items:center;padding:6px 13px;border-radius:9px;border:1.5px solid transparent;background:transparent;cursor:pointer;font-family:inherit;}
  .week-day-btn .wd-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .week-day-btn .wd-num{font-size:12.5px;font-weight:700;color:var(--text);margin-top:2px;}
  .week-day-btn:hover{background:var(--bg-elevated);}
  .week-day-btn.active{background:var(--accent-soft);border-color:var(--accent);}
  .week-day-btn.active .wd-name,.week-day-btn.active .wd-num{color:var(--accent-dark);}

  .category-tabs{display:flex;gap:10px;padding:16px 26px 0;flex-wrap:wrap;}
  .cat-tab{padding:14px 10px;border-radius:9px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-weight:700;font-size:13px;text-align:center;cursor:pointer;font-family:inherit;flex:1;min-width:120px;transition:all .15s;}
  .cat-tab.active{background:var(--info-soft);border-color:var(--info);color:var(--info);}

  .cal-wrap{padding:16px 26px 40px;}
  .cal-layout{display:flex;gap:16px;align-items:flex-start;}
  .cal-grid-scroll{flex:1;min-width:0;overflow-x:auto;}
  .cal-grid{display:grid;border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;background:#fff;min-width:600px;position:relative;}
  .cal-now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid #E11D48;z-index:6;pointer-events:none;}
  .cal-now-dot{position:absolute;left:85px;top:-5px;width:10px;height:10px;border-radius:50%;background:#E11D48;box-shadow:0 0 0 3px rgba(225,29,72,.2);}
  .cal-now-time{position:absolute;left:6px;top:-9px;background:#E11D48;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  .cal-head-row{display:contents;}
  .cal-cell-head{background:var(--bg-elevated);padding:10px 8px;font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);position:sticky;top:0;}
  .cal-hour-label{background:var(--bg-elevated);padding:8px;font-size:11px;font-weight:700;color:var(--muted);border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);text-align:right;white-space:nowrap;}
  .cal-cell{border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:4px;min-height:58px;display:flex;flex-direction:column;gap:4px;}
  .load-card{border-radius:7px;border:1.5px solid var(--info);background:var(--info-soft);padding:6px 8px;font-size:10.5px;cursor:pointer;transition:transform .12s;animation:fadeIn .3s ease;}
  .load-card:hover{transform:scale(1.03);}
  .load-card.despachado{border-color:var(--ok);background:var(--ok-soft);}
  .load-card.en_descarga{border-color:var(--warn);background:var(--warn-soft);}
  .load-card.en_descarga .lc-badge{background:var(--warn);}
  .load-card .lc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
  .load-card .lc-plate{font-weight:800;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .load-card .lc-badge{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:99px;text-transform:uppercase;}
  .load-card.despachado .lc-badge{background:var(--ok);color:#fff;}
  .load-card:not(.despachado) .lc-badge{background:var(--info);color:#fff;}
  .load-card .lc-prov{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .load-card .lc-scope{font-size:8.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;text-transform:uppercase;letter-spacing:.02em;}



  .cal-empty{padding:60px 20px;text-align:center;color:var(--muted);}
  .cal-empty .big{font-weight:700;color:var(--text);margin-bottom:6px;font-size:15px;}

  .cal-unassigned-panel{width:270px;flex-shrink:0;background:#F1F2F4;border:1px solid var(--border);border-radius:12px;padding:14px;}
  .cal-unassigned-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--warn);}
  .cal-unassigned-count{display:inline-block;margin:8px 0 12px;font-size:10.5px;font-weight:700;color:var(--warn);background:#fff;padding:3px 10px;border-radius:99px;}
  .cal-unassigned-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;}
  .cal-unassigned-empty{font-size:11px;color:var(--muted);text-align:center;padding:20px 6px;}

  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);}
  .topbar h1{font-size:17px;font-weight:800;margin:0;background:linear-gradient(135deg,var(--text),#5A6070);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .topbar .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:700;margin-left:12px;}
  .topbar .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok-glow);animation:pulse 1.8s infinite;}
  .topbar .clock{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--gold);margin-left:14px;padding-left:14px;border-left:1px solid var(--border);letter-spacing:.02em;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
  .topbar-right{display:flex;gap:8px;align-items:center;}
  .icon-btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;width:37px;height:37px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .15s;}
  .icon-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .icon-btn.active-view{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent);}

  .dash-body{padding:26px 28px 60px;max-width:1120px;margin:0 auto;width:100%;}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;}
  .cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px;}
  .stat-card{position:relative;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);overflow:hidden;animation:fadeInUp .45s ease backwards;transition:transform .2s,border-color .2s;}
  .stat-card:hover{transform:translateY(-3px);border-color:var(--border-soft);}
  .stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
  .stat-card.c-patio::before{background:var(--accent);box-shadow:0 0 12px var(--accent-glow);}
  .stat-card.c-despachados::before{background:var(--ok);box-shadow:0 0 12px var(--ok-glow);}
  .stat-card.c-promedio::before{background:var(--info);}
  .stat-card.c-hoy::before{background:var(--gold);box-shadow:0 0 12px var(--gold-glow);}
  .stat-card .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .stat-card .icon-wrap{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-card .icon-wrap svg{width:12px;height:12px;}
  .stat-card.c-patio .icon-wrap{background:var(--accent-soft);color:var(--accent);}
  .stat-card.c-despachados .icon-wrap{background:var(--ok-soft);color:var(--ok);}
  .stat-card.c-promedio .icon-wrap{background:var(--info-soft);color:var(--info);}
  .stat-card.c-hoy .icon-wrap{background:rgba(232,185,63,.14);color:var(--gold);}
  .stat-card .num{font-size:21px;font-weight:800;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace;}
  .stat-card .lbl{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;}

  .search-row{display:flex;gap:10px;margin-bottom:18px;}
  .search-row input{flex:1;padding:12px 15px;border-radius:11px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:var(--card);color:var(--text);transition:border-color .2s,box-shadow .2s;}
  .search-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .search-row input::placeholder{color:#5C6270;}

  .period-tabs{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:20px;}
  .period-tabs button{border:none;background:transparent;padding:9px 17px;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s;}
  .period-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 4px 14px -4px var(--accent-glow);}
  .period-tabs button:not(.active):hover{color:var(--text);}

  .controls-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .day-nav{display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:6px 8px;margin-bottom:20px;}
  .day-nav button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;}
  .day-nav button:hover:not(:disabled){background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-nav button:disabled{opacity:.35;cursor:not-allowed;}
  .day-nav span{font-size:12.5px;font-weight:700;color:var(--text);min-width:150px;text-align:center;}

  .layout-toggle{width:44px;border-radius:11px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
  .layout-toggle:hover{color:var(--text);border-color:var(--accent);}
  .layout-toggle.active-view{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent);}

  .cards-list{display:flex;flex-direction:column;gap:10px;}

  .type-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-items:start;width:100%;}

  .type-column{background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border:1px solid var(--border-soft);border-radius:16px;padding:14px;}
  .type-column-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;padding:2px 6px;}
  .type-column-head .tc-name{font-weight:800;font-size:13.5px;color:var(--text);display:flex;align-items:center;gap:7px;}
  .type-column-head .tc-substats{font-size:10px;color:var(--muted);margin-top:4px;font-weight:600;}
  .type-column-head .tc-count{background:var(--accent);color:#fff;font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:99px;min-width:24px;text-align:center;box-shadow:0 3px 10px -3px var(--accent-glow);flex-shrink:0;}
  .type-column-stack{display:flex;flex-direction:column;gap:10px;}
  .type-column-empty{text-align:center;color:var(--muted);font-size:12px;padding:28px 10px;border:1.5px dashed var(--border);border-radius:10px;}
  @media (max-width: 980px){ .type-columns{grid-template-columns:1fr;} }
  .cards-list{display:flex;flex-direction:column;gap:10px;}

  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
  .arrival-card{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;user-select:none;animation:fadeInUp .4s ease backwards;position:relative;}
  .arrival-card:hover{transform:translateY(-2px);border-color:rgba(255,59,92,.35);box-shadow:0 4px 14px rgba(0,0,0,.3),0 16px 32px -18px var(--accent-glow);}
  .arrival-card.pulse{animation:cardPulse .25s ease;}
  .arrival-card.view-only .card-time-status{cursor:default;}
  @keyframes cardPulse{0%{transform:scale(1);}50%{transform:scale(.97);}100%{transform:scale(1);}}

  .card-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:13px 13px 10px;}
  .card-info{flex:1;min-width:0;text-align:left;}
  .card-company{font-weight:800;font-size:13.5px;color:var(--text);letter-spacing:-.01em;word-break:break-word;}
  .card-scope-tag{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-dark);background:var(--accent-soft);display:inline-block;padding:2px 6px;border-radius:5px;margin-bottom:4px;}
  .card-subinfo{font-size:10.5px;color:var(--muted);margin-top:3px;word-break:break-word;}
  .card-info .plate-chip{display:inline-block;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:16px;background:var(--accent-soft);border:1.5px solid rgba(225,29,72,.3);padding:4px 12px;border-radius:8px;color:var(--accent-dark);font-weight:800;letter-spacing:.03em;}
  .card-info .order-chip{display:block;margin-top:5px;font-size:11px;font-weight:700;color:var(--muted);}
  .card-info .order-chip b{color:var(--text);font-family:'JetBrains Mono',monospace;letter-spacing:.02em;}

  .card-time-status{flex-shrink:0;text-align:right;padding:2px 4px 2px 8px;border-left:1px solid var(--border-soft);transition:background-color .8s ease;border-radius:8px;}
  .card-time-status.clickable{cursor:pointer;}
  .big-time{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.01em;line-height:1;}
  .card-time-status.despachado .big-time{color:var(--ok);}
  .card-time-status.en_descarga .big-time{color:var(--warn);}
  .big-date{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:3px;}

  .card-status-badge{margin:7px 0 0;width:fit-content;margin-left:auto;font-size:9px;font-weight:700;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.02em;}
  .card-status-badge.esperando{background:var(--accent-soft);color:var(--accent-dark);border:1px solid rgba(225,29,72,.25);}
  .card-status-badge.despachado{background:var(--ok-soft);color:var(--ok);border:1px solid rgba(46,217,136,.3);}
  .card-status-badge.en_descarga{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(183,121,31,.3);}

  .card-details-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--bg-elevated);border:none;border-top:1px solid var(--border-soft);padding:6px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;transition:color .15s;}
  .card-details-toggle:hover{color:var(--accent-dark);}
  .card-details-toggle .chev{transition:transform .2s;}
  .card-details-toggle.open .chev{transform:rotate(180deg);}
  .card-details{max-height:0;overflow:hidden;font-size:9.5px;color:var(--muted);text-align:center;line-height:1.6;background:var(--bg-elevated);transition:max-height .25s ease,padding .25s ease;padding:0 10px;}
  .card-details.open{max-height:80px;padding:8px 10px;}
  .card-details b{color:var(--text);font-weight:700;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;animation:fadeIn .4s ease;}
  .empty-state .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;}

  .gate-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate-card{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:34px;width:100%;max-width:340px;text-align:center;animation:fadeInUp .4s ease;}
  .gate-card h2{font-size:17px;margin:0 0 18px;font-weight:800;}
  .err{color:var(--accent-dark);font-size:12.5px;margin-top:8px;min-height:16px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,22,28,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fadeIn .2s ease;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;max-width:440px;width:100%;padding:28px;max-height:88vh;overflow-y:auto;animation:popIn .25s ease;display:flex;flex-direction:column;}
  .modal h3{margin:0 0 4px;font-size:16.5px;font-weight:800;}
  .modal .hint, .config-tab-panel .hint{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
  .modal .section-label, .config-tab-panel .section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-dark);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--border-soft);}
  .modal .section-label:first-of-type, .config-tab-panel .section-label:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .checkbox-field{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:14px;cursor:pointer;text-transform:none;}
  .multiselect-box{border:1.5px solid var(--border);border-radius:11px;padding:10px 13px;background:var(--bg-elevated);max-height:160px;overflow-y:auto;}
  .multiselect-box .checkbox-field{margin-bottom:4px;font-weight:500;font-size:13px;}
  .checkbox-field input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .geo-hint{font-size:12px;margin:-2px 0 14px;min-height:14px;color:var(--muted);}
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
  .geo-hint.ok{color:var(--ok);}
  .geo-hint.err{color:var(--accent-dark);}
  .modal .field, .config-tab-panel .field{margin-bottom:14px;}
  .modal .field input, .config-tab-panel .field input, .config-tab-panel .field select{padding:11px 13px;font-size:13.5px;}
  .modal-actions{display:flex;gap:10px;margin:20px -28px -28px;padding:14px 28px 20px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border-soft);border-radius:0 0 18px 18px;}
  .config-tab-bar{display:flex;align-items:center;gap:2px;background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:999px;padding:5px 7px;margin-bottom:20px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-ms-overflow-style:none;scrollbar-width:none;}
  .ps-filters-scroll{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-width:100%;-ms-overflow-style:none;scrollbar-width:none;}
  .ps-filters-scroll::-webkit-scrollbar{display:none;}
  .ps-filters-scroll>*{flex-shrink:0;}
  .config-tab-bar::-webkit-scrollbar{display:none;}
  .config-tab-btn{flex:0 0 auto;padding:9px 18px;background:transparent;border:none;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;cursor:pointer;font-family:inherit;line-height:1.3;transition:background .15s,color .15s,box-shadow .15s;white-space:nowrap;}
  .config-tab-btn.active{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(20,25,35,.12),0 1px 2px rgba(20,25,35,.08);}
  .config-tab-btn:hover:not(.active){background:rgba(20,25,35,.06);color:var(--text);}
  .config-tab-panel{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:22px 24px;max-width:640px;box-shadow:var(--shadow);}
  .btn-secondary{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .btn-secondary:hover{background:var(--card-hover);}
  .btn-primary-sm{flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px -8px var(--accent-glow);}
  .qr-box{text-align:center;padding:10px 0;}
  .qr-box img{width:220px;height:220px;border-radius:12px;border:1px solid var(--border);background:#fff;padding:8px;}
  .qr-url{font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:12px;font-family:'JetBrains Mono',monospace;background:var(--bg-elevated);border:1px solid var(--border-soft);padding:9px 11px;border-radius:8px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);border:1px solid var(--border);color:#fff;padding:12px 22px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:60;opacity:0;transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .toast::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px;box-shadow:0 0 8px var(--ok-glow);}

  .role-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;margin-left:10px;}
  .role-badge.admin{background:var(--accent-soft);color:var(--accent-dark);}
  .role-badge.viewer{background:var(--info-soft);color:var(--info);}

  .card-actions{display:flex;justify-content:center;gap:6px;margin-top:8px;}
  .card-action-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--muted);cursor:pointer;transition:all .15s;}
  .card-action-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--accent);}
  .card-action-btn.whatsapp:hover{color:#25D366;border-color:#25D366;background:rgba(37,211,102,.1);}
  .card-action-btn.danger:hover{color:var(--accent-dark);border-color:var(--accent);background:var(--accent-soft);}

  .admin-list{max-height:220px;overflow-y:auto;margin-bottom:14px;border:1px solid var(--border-soft);border-radius:10px;}
  .admin-list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .role-picker{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
  .role-option{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;cursor:pointer;background:var(--bg-elevated);transition:all .15s;}
  .role-option input{width:auto;margin-top:3px;flex-shrink:0;}
  .role-option .ro-name{font-weight:800;font-size:13px;color:var(--text);text-transform:none;}
  .role-option .ro-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;text-transform:none;}
  .role-option:hover{border-color:var(--accent);}
  .role-option.selected{border-color:var(--accent);background:var(--accent-soft);}

  .admin-list-row:last-child{border-bottom:none;}
  .admin-list-row .name{font-weight:600;}
  .admin-list-row .sub{font-size:11px;color:var(--muted);margin-top:1px;}
  .admin-list-row .del-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;}
  .admin-list-row .reset-btn{background:none;border:none;color:var(--info);cursor:pointer;padding:4px;border-radius:6px;}
  .admin-list-row .reset-btn:hover{background:var(--info-soft);}
  .admin-list-row .del-btn:hover{color:var(--accent-dark);background:var(--accent-soft);}

  .admin-list-row .edit-field-btn:hover{color:var(--info);background:var(--info-soft);}

  /* Programación de Citas */
  .modal-wide{max-width:900px !important;}
  .dtp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;}
  .dtp-header .dtp-title{font-weight:800;font-size:16px;}
  .dtp-nav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0;}
  .dtp-nav-btn:hover{background:var(--bg-elevated);}
  .dtp-nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .dtp-grid{display:grid;grid-template-columns:repeat(5,minmax(155px,1fr));gap:18px;overflow-x:auto;padding-bottom:6px;}
  @media (max-width:900px){ .dtp-grid{grid-template-columns:repeat(5,165px);} }
  .dtp-day-head{text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border-soft);}
  .dtp-day-name{font-size:13px;font-weight:700;color:var(--muted);text-transform:capitalize;}
  .dtp-day-date{font-size:14px;font-weight:800;color:var(--text);margin-top:2px;}
  .dtp-slots{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:4px;}
  .dtp-slot{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:13px 6px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;font-family:inherit;}
  .dtp-slot:hover{border-color:var(--accent);}

function authHeaders(){

async function safeParseJson(r){
  const text = await r.text();
  try{
    return JSON.parse(text);
  }catch(e){
    throw new Error(`El servidor respondió con un error inesperado (código ${r.status}). Vuelve a intentarlo; si persiste, avísale al desarrollador.`);
  }
}
async function apiGet(path){
  let r;
  try{
    r = await fetch(path, { headers: authHeaders() });
  }catch(e){
    throw new Error('No se pudo conectar con el servidor. Revisa tu conexión o que el sitio esté bien desplegado.');
  }
  if(r.status === 403){ clearSession(); location.hash='panel'; throw new Error('Tu sesión expiró, inicia sesión de nuevo.'); }
  if(!r.ok){ const data = await safeParseJson(r); throw new Error(data.error || ('Error al consultar '+path)); }
  return safeParseJson(r);
}
async function apiPost(path, body){
  let r;
  try{
    r = await fetch(path, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', ...authHeaders() },
      body: JSON.stringify(body)
    });
  }catch(e){
    throw new Error('No se pudo conectar con el servidor (Failed to fetch). Verifica que el sitio esté bien desplegado y que no haya un bloqueador de contenido interfiriendo.');
  }
  const data = await safeParseJson(r);
  if(!r.ok) throw new Error(data.error || 'Error al guardar');
  return data;
}
async function apiPatch(path, body){
  const r = await fetch(path, {
    method:'PATCH',
    headers:{ 'Content-Type':'application/json', ...authHeaders() },
    body: JSON.stringify(body)
  });
  const data = await safeParseJson(r);
  if(!r.ok) throw new Error(data.error || 'Error al actualizar');
  return data;
}
async function apiDelete(path, body){
  const r = await fetch(path, {
    method:'DELETE',
    headers:{ 'Content-Type':'application/json', ...authHeaders() },
    body: JSON.stringify(body)
  });
  const data = await safeParseJson(r);
  if(!r.ok) throw new Error(data.error || 'Error al eliminar');
  return data;
}

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function renderCheckin(){
  document.body.classList.remove('dashboard-bg');
  await loadCountryFacilities();
  const params = new URLSearchParams(location.search);
  const urlCountry = (params.get('pais') || params.get('country') || '').toUpperCase();
  const urlFacility = (params.get('bodega') || params.get('facility') || '').toUpperCase();
  if(urlCountry && COUNTRY_INFO[urlCountry]){
    localStorage.setItem('tc_checkin_country', urlCountry);
    if(countryNeedsFacility(urlCountry)){
      const valid = (COUNTRY_FACILITIES[urlCountry]||[]).some(f=>f.code===urlFacility);
      if(valid) localStorage.setItem('tc_checkin_facility', urlFacility);
    } else {
      localStorage.removeItem('tc_checkin_facility');
    }
  }
  const country = localStorage.getItem('tc_checkin_country') || '';
  if(!country || !COUNTRY_INFO[country]){
    renderCheckinCountryPicker();
    return;
  }
  if(countryNeedsFacility(country)){
    const facility = localStorage.getItem('tc_checkin_facility') || '';
    const valid = (COUNTRY_FACILITIES[country]||[]).some(f=>f.code===facility);
    if(!valid){
      renderCheckinFacilityPicker(country);
      return;
    }
  }
  renderCheckinForm();
}

// Rellena psCustomFieldsArea con los campos configurados, engancha inputs de archivo, y devuelve
// una función para leer/validar los valores al momento de guardar.
function wireProvSchedCustomFields(container, fields, existingValues){
  existingValues = existingValues || {};
  if(!fields.length){ container.innerHTML = ''; return { getValues: ()=>({}) }; }
  container.innerHTML = `<div class="section-label" style="margin-top:0;">Campos adicionales</div>` + fields.map(f=>provSchedCustomFieldInputHtml(f)).join('');
  fields.forEach(f=>{
    const val = existingValues[f.label];
    if(val === undefined || val === null || val === '') return;
    if(f.type === 'multiselect'){
      String(val).split(',').map(s=>s.trim()).forEach(v=>{
        const cb = container.querySelector(`[data-psms="${f.id}"][value="${v}"]`);
        if(cb) cb.checked = true;
      });
    } else if(f.type === 'file'){
      const hint = container.querySelector('#psfilehint_'+f.id);
      if(hint) hint.textContent = 'Archivo actual guardado (elige uno nuevo para reemplazarlo)';
    } else {
      const inp = container.querySelector('#pscustom_'+f.id);
      if(inp) inp.value = val;
    }
  });
  fields.forEach(f=>{
    if(f.type === 'file'){
      const inp = container.querySelector('#pscustom_'+f.id);
      inp.addEventListener('change', ()=>{
        const file = inp.files[0];
        const hint = container.querySelector('#psfilehint_'+f.id);
        if(!file){ inp.dataset.fileData = ''; if(hint) hint.textContent=''; return; }
        if(file.size > 900*1024){
          toast('El archivo es muy grande (máx. ~900 KB)');
          inp.value = ''; inp.dataset.fileData = ''; if(hint) hint.textContent='';
          return;
        }
        const reader = new FileReader();
        reader.onload = ()=>{ inp.dataset.fileData = reader.result; if(hint) hint.textContent = file.name; };
        reader.readAsDataURL(file);
      });
    }
  });
  function getValues(){
    const customFields = {};
    let error = null;
    for(const f of fields){
      let val = '';
      if(f.type === 'multiselect'){
        const checked = Array.from(container.querySelectorAll(`[data-psms="${f.id}"]:checked`)).map(c=>c.value);
        val = checked.join(', ');
      } else if(f.type === 'file'){
        const inp = container.querySelector('#pscustom_'+f.id);
        val = (inp && inp.dataset.fileData) ? inp.dataset.fileData : (existingValues[f.label] || '');
      } else {
        val = (container.querySelector('#pscustom_'+f.id)?.value || '').trim();
      }
      if(f.required && !val && !error){ error = `Completa el campo "${f.label}"`; }
      if(val) customFields[f.label] = val;
    }
    return { customFields, error };
  }
  return { getValues };
}

async function initGeofenceCheck(){
  const settings = await getSettings();
  const banner = document.getElementById('geoBanner');
  const btn = document.getElementById('btnSubmit');
  if(!banner || !btn) return;

  if(!settings.geofenceEnabled || settings.geofenceLat==null || settings.geofenceLng==null){
    geoState = { ok:true, checked:true, distance:null, coords:null };
    return;
  }

  btn.disabled = true;
  banner.innerHTML = `<div class="geo-banner checking"><span class="geo-spin"></span>Verificando tu ubicación...</div>`;

  runGeofenceCheck(settings);
}

function runGeofenceCheck(settings){
  const banner = document.getElementById('geoBanner');
  const btn = document.getElementById('btnSubmit');
  if(!navigator.geolocation){
    geoState = { ok:false, checked:true, distance:null, coords:null };
    banner.innerHTML = `<div class="geo-banner blocked">Tu navegador no permite verificar la ubicación, así que no podemos confirmar que estás en CD NOVEX.</div>`;
    btn.disabled = true;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, settings.geofenceLat, settings.geofenceLng);
      const ok = dist <= settings.geofenceRadius;
      geoState = { ok, checked:true, distance:Math.round(dist), coords:{lat:pos.coords.latitude, lng:pos.coords.longitude} };
      if(ok){
        banner.innerHTML = `<div class="geo-banner ok">Ubicación verificada — estás dentro del área de CD NOVEX.</div>`;
        btn.disabled = false;
      } else {
        banner.innerHTML = `<div class="geo-banner blocked">Estás a ${Math.round(dist)} m del centro. Debes estar a menos de ${settings.geofenceRadius} m para registrarte. <button type="button" class="geo-retry" id="geoRetry">Reintentar</button></div>`;
        btn.disabled = true;
        document.getElementById('geoRetry').onclick = ()=>runGeofenceCheck(settings);
      }
    },
    ()=>{
      geoState = { ok:false, checked:true, distance:null, coords:null };
      banner.innerHTML = `<div class="geo-banner blocked">No pudimos acceder a tu ubicación. Activa el permiso de ubicación de tu navegador e intenta de nuevo. <button type="button" class="geo-retry" id="geoRetry">Reintentar</button></div>`;
      btn.disabled = true;
      document.getElementById('geoRetry').onclick = ()=>runGeofenceCheck(settings);
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}

async function submitArrival(){
  const provider = document.getElementById('inProvider').value.trim();
  const driverName = document.getElementById('inName').value.trim();
  const phone = document.getElementById('inPhone').value.trim();
  const plate = document.getElementById('inPlate').value.trim();
  const orderNumber = document.getElementById('inOrderNumber').value.trim();
  const errEl = document.getElementById('formErr');
  errEl.textContent = '';
  if(!geoState.ok){
    errEl.textContent = 'No puedes registrarte fuera del área permitida.';
    return;
  }
  const req = Object.assign({}, DEFAULT_FIELD_REQUIRED, checkinFieldRequired);
  const values = { provider, driverName, phone, plate, transportType: selectedTransportType || '' };
  const missingLabels = [];
  const labelEls = { provider:'lblProvider', driverName:'lblDriverName', phone:'lblPhone', plate:'lblPlate', transportType:'lblTransportType' };
  for(const key of Object.keys(req)){
    if(req[key] && !values[key]){
      const el = document.getElementById(labelEls[key]);
      missingLabels.push(el ? el.textContent.replace('(opcional)','').trim() : key);
    }
  }
  if(missingLabels.length > 0){
    errEl.textContent = 'Completa: ' + missingLabels.join(', ');
    return;
  }
  const customFields = {};
  for(const f of checkinCustomFields){
    let val = '';
    if(f.type === 'multiselect'){
      const checked = Array.from(document.querySelectorAll(`[data-ms="${f.id}"]:checked`)).map(c=>c.value);
      val = checked.join(', ');
    } else if(f.type === 'file'){
      const inp = document.getElementById('custom_'+f.id);
      val = (inp && inp.dataset.fileData) ? inp.dataset.fileData : '';
    } else {
      val = (document.getElementById('custom_'+f.id)?.value || '').trim();
    }
    if(f.required && !val){
      errEl.textContent = 'Completa el campo "'+f.label+'"';
      return;
    }
    if(val) customFields[f.label] = val;
  }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Registrando...';

  try{
    const record = await apiPost('/api/arrivals', {
      provider, driverName, plate, phone, transportType: selectedTransportType, orderNumber, customFields,
      geoLat: geoState.coords ? geoState.coords.lat : null,
      geoLng: geoState.coords ? geoState.coords.lng : null,
      geoDistance: geoState.distance
    });
    const card = document.querySelector('.checkin-card');
    card.innerHTML = `
      <div class="confirm">
        <div class="check-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#2ED988" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2>Llegada registrada</h2>
        <p>${driverName ? 'Gracias, '+driverName+'. ' : ''}El equipo de la torre de control ya fue notificado.</p>
        <div class="meta">
          ${provider ? `<div><span>Proveedor</span><span>${provider}</span></div>` : ''}
          ${driverName ? `<div><span>Motorista</span><span>${driverName}</span></div>` : ''}
          ${phone ? `<div><span>Teléfono</span><span>${phone}</span></div>` : ''}
          ${plate ? `<div><span>Placa</span><span>${plate}</span></div>` : ''}
          ${orderNumber ? `<div><span>Orden de compra</span><span>${orderNumber}</span></div>` : ''}
          ${selectedTransportType ? `<div><span>Tipo</span><span>${selectedTransportType}</span></div>` : ''}
          <div><span>Hora</span><span>${record.time}</span></div>
        </div>
        <div id="dockStatusBox" class="dock-status-box waiting">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="dock-status-icon"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div>
            <div class="dock-status-title">Esperando asignación de muelle</div>
            <div class="dock-status-sub">Deja esta pantalla abierta — se actualiza sola en cuanto te asignen dónde estacionarte.</div>
          </div>
        </div>
      </div>
    `;
    startDockStatusPolling(record.id);
  }catch(e){
    errEl.textContent = e.message || 'No se pudo registrar. Intenta de nuevo.';
    btn.disabled = false; btn.textContent = 'Registrar llegada';
  }
}

// Consulta periódicamente el estado del registro (sin necesidad de login) para avisarle al
// transportista, directamente en esta misma pantalla, en cuanto le asignen muelle — sin depender
// de WhatsApp ni de que alguien le escriba manualmente.
function startDockStatusPolling(recordId){
  const statusLabelByCode = { esperando: 'Esperando', en_descarga: 'En descarga', despachado: 'Despachado' };
  let stopped = false;
  let attempts = 0;
  const maxAttempts = 480; // ~4 horas a 30s por intento, por si el registro tarda en atenderse
  async function tick(){
    if(stopped) return;
    attempts++;
    try{
      const res = await fetch(`/api/arrival-status?id=${encodeURIComponent(recordId)}`);
      if(res.ok){
        const data = await res.json();
        const box = document.getElementById('dockStatusBox');
        if(box){
          if(data.dock){
            box.classList.remove('waiting');
            box.classList.add('assigned');
            box.innerHTML = `
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="dock-status-icon"><rect x="3" y="4" width="7" height="16" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="4" width="7" height="16" rx="1.5" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 8v8M17.5 8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <div>
                <div class="dock-status-title">Estaciónate en: ${data.dock}</div>
                <div class="dock-status-sub">${statusLabelByCode[data.status] || ''}</div>
              </div>
            `;
          } else if(data.status && data.status !== 'esperando'){
            box.querySelector('.dock-status-sub') && (box.querySelector('.dock-status-sub').textContent = statusLabelByCode[data.status] || '');
          }
        }
      }
    }catch(e){ /* ignora fallos puntuales de red y reintenta en el siguiente ciclo */ }
    if(!stopped && attempts < maxAttempts) setTimeout(tick, 8000);
  }
  setTimeout(tick, 8000);
  window.addEventListener('beforeunload', ()=>{ stopped = true; });
}

// Solo se usa para saltar la selección de país/bodega en el login; el backend valida todo de nuevo.
const SUPERUSER_USERNAMES = ['elias', 'carlos'];

async function renderLogin(){
  document.body.classList.remove('dashboard-bg');
  await loadCountryFacilities();
  const preselected = sessionStorage.getItem('tc_country') || '';
  const preselectedFacility = sessionStorage.getItem('tc_facility') || '';
  app.innerHTML = `
    <div class="checkin-wrap">
      <div class="checkin-card login-card">
        <div class="logo-row">
          <img src="/assets/novex.png" alt="NOVEX">
          <div class="logo-divider"></div>
          <img src="/assets/vidri.png" alt="VIDRI">
        </div>
        <div class="login-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <h1 class="title">Iniciar sesión</h1>
        <p class="sub">Torre de Control · CD NOVEX. Ingresa tus credenciales para continuar.</p>

        <div class="field"><label>País</label>
          <div class="country-picker" id="countryPicker">
            ${Object.entries(COUNTRY_INFO).map(([code,info])=>`
              <button type="button" class="country-opt ${preselected===code?'selected':''}" data-country="${code}">
                <span class="co-flag">${info.flag}</span><span>${info.label}</span>
              </button>
            `).join('')}
          </div>
        </div>
        <div class="field" id="facilityFieldWrap" style="display:none;"><label>Bodega</label>
          <div class="country-picker" id="facilityPicker"></div>
        </div>
        <p class="hint" style="font-size:11px;margin:-6px 0 4px;">Si eres superusuario, puedes dejar el país sin elegir y entrar directo con tu usuario y contraseña.</p>

        <div class="field" style="margin-top:14px;"><label>Usuario</label><input id="loginUser" type="text" placeholder="admin" autocomplete="off"></div>
        <div class="field"><label>Contraseña</label><input id="loginPw" type="password" placeholder="••••••••"></div>
        <button class="primary" id="btnEnter">Entrar</button>
        <div class="err-msg" id="loginErr" style="text-align:center;margin-top:8px;"></div>
      </div>
    </div>
  `;
  let selectedCountry = preselected;
  let selectedFacility = preselectedFacility;

  function renderFacilityPicker(){
    const wrap = document.getElementById('facilityFieldWrap');
    const list = COUNTRY_FACILITIES[selectedCountry];
    if(!list || !list.length){ wrap.style.display = 'none'; selectedFacility = ''; return; }
    wrap.style.display = 'block';
    document.getElementById('facilityPicker').innerHTML = list.map(f=>`
      <button type="button" class="country-opt ${selectedFacility===f.code?'selected':''}" data-facility="${f.code}">
        <span>${f.label}</span>
      </button>
    `).join('');
    document.querySelectorAll('#facilityPicker .country-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('#facilityPicker .country-opt').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedFacility = btn.dataset.facility;
      });
    });
  }
  if(selectedCountry) renderFacilityPicker();

  document.querySelectorAll('#countryPicker .country-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#countryPicker .country-opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCountry = btn.dataset.country;
      selectedFacility = '';
      renderFacilityPicker();
    });
  });
  const doLogin = async ()=>{
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPw').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    const isSuperuserAttempt = SUPERUSER_USERNAMES.includes(username.toLowerCase());
    if(!isSuperuserAttempt){
      if(!selectedCountry){ errEl.textContent = 'Selecciona un país'; return; }
      if(countryNeedsFacility(selectedCountry) && !selectedFacility){ errEl.textContent = 'Selecciona una bodega'; return; }
    }
    if(!username || !password){ errEl.textContent = 'Ingresa usuario y contraseña'; return; }
    const btn = document.getElementById('btnEnter');
    btn.disabled = true; btn.textContent = 'Entrando...';
    if(isSuperuserAttempt){
      // El superusuario no necesita país/bodega para entrar: se le asigna un país activo por defecto tras iniciar sesión.
      sessionStorage.removeItem('tc_country');
      sessionStorage.removeItem('tc_facility');
    } else {
      setCountry(selectedCountry);
      setFacility(selectedFacility);
    }
    try{
      const res = await apiPost('/api/auth', { username, password });
      sessionStorage.setItem('tc_token', res.token);
      sessionStorage.setItem('tc_role', res.role);
      sessionStorage.setItem('tc_username', res.username);
      sessionStorage.setItem('tc_isowner', res.isOwner ? '1' : '0');
      sessionStorage.setItem('tc_global', res.global ? '1' : '0');
      sessionStorage.setItem('tc_allowedviews', Array.isArray(res.allowedViews) ? JSON.stringify(res.allowedViews) : '');
      sessionStorage.setItem('tc_multiscopes', Array.isArray(res.multiScopes) ? JSON.stringify(res.multiScopes) : '');
      if(res.global){
        // País activo por defecto para el superusuario (puede cambiarlo luego desde el panel sin volver a iniciar sesión).
        sessionStorage.setItem('tc_country', 'GT');
        sessionStorage.setItem('tc_facility', 'ATLAS_MATERIALES');
      } else {
        sessionStorage.setItem('tc_country', res.country || '');
        sessionStorage.setItem('tc_facility', res.facility || '');
      }
      renderDashboard();
    }catch(e){
      errEl.textContent = e.message || 'No se pudo iniciar sesión';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
  document.getElementById('btnEnter').onclick = doLogin;
  document.getElementById('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

function nowElSalvador(){ return new Date(Date.now() - 6*60*60*1000); }

function updateClock(){
  const el = document.getElementById('liveClock');
  if(!el) return;
  const n = nowElSalvador();
  const dias = ['dom','lun','mar','mié','jue','vie','sáb'];
  el.textContent = `${dias[n.getUTCDay()]} ${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())}`;
}

function localDateParts(offsetDays){
  const local = new Date(nowElSalvador().getTime() + (offsetDays||0)*24*60*60*1000);
  return { y: local.getUTCFullYear(), m: local.getUTCMonth(), d: local.getUTCDate(), key: local.toISOString().slice(0,10) };
}

function dayLabel(offsetDays){
  const parts = localDateParts(offsetDays);
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const dt = new Date(Date.UTC(parts.y, parts.m, parts.d));
  let label = `${dias[dt.getUTCDay()]}, ${parts.d} de ${meses[parts.m]}`;
  if(offsetDays === 0) label = 'Hoy · ' + label;
  return label;
}

function updateDayNav(){
  const lbl = document.getElementById('dayLabel');
  const nextBtn = document.getElementById('dayNext');
  if(!lbl || !nextBtn) return;
  lbl.textContent = dayLabel(dayOffset);
  nextBtn.disabled = dayOffset >= 0;
}

function inPeriod(r, period){
  if(period === 'all') return true;
  const parts = localDateParts(period === 'day' ? dayOffset : 0);
  if(period === 'day') return r.date === parts.key;
  if(period === 'week'){
    const weekAgo = Date.now() - 7*24*60*60*1000;
    return r.ts >= weekAgo;
  }
  if(period === 'month'){
    const [ry, rm] = r.date.split('-').map(Number);
    return ry === parts.y && (rm-1) === parts.m;
  }
  return true;
}

function phoneToWhatsApp(phone){
  if(!phone) return '';
  const trimmed = phone.trim();
  const digits = trimmed.replace(/[^0-9]/g,'');
  if(!digits) return '';
  if(trimmed.startsWith('+')) return digits; // ya incluye código de país (+503, +502, +506...)
  if(digits.length > 8) return digits; // probablemente ya trae código de país sin el "+"
  return '503' + digits; // número local de 8 dígitos: se asume El Salvador
}

function fmtTimeMs(ms){
  if(!ms) return '';
  const local = new Date(ms - 6*60*60*1000);
  return pad(local.getUTCHours())+':'+pad(local.getUTCMinutes());
}

function fmtDuration(minutes){
  const m = Math.max(0, Math.round(minutes));
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), rem = m % 60;
  return h + 'h ' + rem + 'm';
}

function animateCountUp(el, from, to, duration){
  if(from === to){ el.textContent = to; return; }
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = Math.round(from + (to-from)*eased);
    el.textContent = val;
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = to;
  }
  requestAnimationFrame(step);
}

  document.getElementById('calDockFilterSel').value = calDockFilter;
  document.getElementById('calDockFilterSel').addEventListener('change', (e)=>{ calDockFilter = e.target.value; renderCalendarView(); });
  document.getElementById('calToday').onclick = ()=>{ dayOffset = 0; renderCalendarShellState(); renderCalendarView(); };
  document.getElementById('calDayPrev').onclick = ()=>{ dayOffset -= 1; renderCalendarShellState(); renderCalendarView(); };
  document.getElementById('calDayNext').onclick = ()=>{ dayOffset += 1; renderCalendarShellState(); renderCalendarView(); };
  document.getElementById('calWeekPrev').onclick = ()=>{ dayOffset -= 7; renderCalendarShellState(); renderCalendarView(); };
  document.getElementById('calWeekNext').onclick = ()=>{ dayOffset += 7; renderCalendarShellState(); renderCalendarView(); };

function renderCalendarShellState(){
  const parts = localDateParts(dayOffset);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  document.getElementById('calDateLabel').textContent = `${parts.d} de ${meses[parts.m]} de ${parts.y}`;

  // calcula el lunes de la semana que contiene el día seleccionado
  const local = new Date(nowElSalvador().getTime() + dayOffset*24*60*60*1000);
  const dow = local.getUTCDay();
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const mondayOffset = dayOffset + diffToMonday;

  const dias = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let html = '';
  for(let i=0;i<7;i++){
    const off = mondayOffset + i;
    const p = localDateParts(off);
    const isActive = off === dayOffset;
    html += `<button type="button" class="week-day-btn ${isActive?'active':''}" data-off="${off}">
      <span class="wd-name">${dias[i]}</span><span class="wd-num">${p.d}</span>
    </button>`;
  }
  const wd = document.getElementById('weekDays');
  wd.innerHTML = html;
  wd.querySelectorAll('.week-day-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      dayOffset = parseInt(btn.dataset.off);
      renderCalendarShellState();
      renderCalendarView();
    });
  });
}

const CAL_HOURS = Array.from({length:15}, (_,i)=>i+6); // 06:00 a 20:00

function dockColumnsFor(records, configuredDocks){
  const docks = new Set(configuredDocks || []);
  records.forEach(r=>{ if(r.dock) docks.add(String(r.dock)); });
  let cols = Array.from(docks);
  if((!configuredDocks || configuredDocks.length === 0) && cols.length === 0) cols = ['1','2','3','4'];
  cols.sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  return cols;
}

async function renderCalendarView(){
  cachedArrivals = await loadArrivals();
  const configuredDocks = await loadDocks();
  const parts = localDateParts(dayOffset);
  let dayRecords = cachedArrivals.filter(r => r.date === parts.key);
  if(calCategory !== 'Todos') dayRecords = dayRecords.filter(r => r.transportType === calCategory);
  if(calSearchTerm){
    dayRecords = dayRecords.filter(r =>
      (r.plate||'').toLowerCase().includes(calSearchTerm) ||
      (r.provider||'').toLowerCase().includes(calSearchTerm) ||
      (r.driverName||'').toLowerCase().includes(calSearchTerm) ||
      (r.orderNumber||'').toLowerCase().includes(calSearchTerm)
    );
  }
  if(calDockFilter !== 'Todos'){
    dayRecords = dayRecords.filter(r => (r.dock ? String(r.dock) : 'S/A') === calDockFilter);
  }

  const gridArea = document.getElementById('calGridArea');
  if(!gridArea) return;

  if(dayRecords.length === 0){
    gridArea.innerHTML = `<div class="cal-empty"><div class="big">No hay registros este día</div>Prueba otro día, categoría, muelle o búsqueda.</div>`;
    return;
  }

  const unassignedRecords = dayRecords.filter(r => !r.dock).sort((a,b)=>a.ts-b.ts);
  const assignedRecords = dayRecords.filter(r => r.dock);
  const showOnlyUnassigned = calDockFilter === 'S/A';
  const cols = showOnlyUnassigned ? [] : (calDockFilter !== 'Todos' ? [calDockFilter] : dockColumnsFor(assignedRecords, configuredDocks));
  const byCell = {};
  assignedRecords.forEach(r=>{
    const hour = Math.min(20, Math.max(6, parseInt((r.time||'06:00').split(':')[0], 10)));
    const col = String(r.dock);
    const key = `${hour}-${col}`;
    (byCell[key] = byCell[key] || []).push(r);
  });

  function loadCardHtml(r){
    const isDone = r.status === 'despachado';
    const isUnloading = r.status === 'en_descarga';
    const badge = isDone ? 'Listo' : (isUnloading ? 'Descarga' : r.time);
    return `<div class="load-card ${isDone?'despachado':''} ${isUnloading?'en_descarga':''}" data-edit="${r.id}">
      <div class="lc-top"><span class="lc-plate">${r.plate||'—'}</span><span class="lc-badge">${badge}</span></div>
      <div class="lc-prov">${r.provider||''}</div>
      ${(getIsGlobal()||hasMultiScopes()) && r.scopeLabel ? `<div class="lc-scope">${r.scopeLabel}</div>` : ''}
    </div>`;
  }

  let gridHtml = '';
  if(cols.length > 0){
    gridHtml += `<div class="cal-grid" id="calGridInner" style="grid-template-columns:90px repeat(${cols.length},1fr);">`;
    gridHtml += `<div class="cal-cell-head"></div>`;
    cols.forEach(c=>{ gridHtml += `<div class="cal-cell-head">Muelle ${c}</div>`; });
    CAL_HOURS.forEach(hour=>{
      gridHtml += `<div class="cal-hour-label">${pad(hour)}:00</div>`;
      cols.forEach(col=>{
        const items = byCell[`${hour}-${col}`] || [];
        gridHtml += `<div class="cal-cell">${items.map(loadCardHtml).join('')}</div>`;
      });
    });
    gridHtml += `</div>`;
  } else {
    gridHtml = `<div class="cal-empty" style="padding:30px 10px;"><div class="big">Mostrando solo registros sin muelle</div>Quita el filtro para ver la cuadrícula por muelle.</div>`;
  }

  const unassignedHtml = `
    <div class="cal-unassigned-panel">
      <div class="cal-unassigned-head">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Sin muelle asignado
      </div>
      <div class="cal-unassigned-count">${unassignedRecords.length} en espera</div>
      <div class="cal-unassigned-list">
        ${unassignedRecords.length ? unassignedRecords.map(loadCardHtml).join('') : `<div class="cal-unassigned-empty">No hay transportistas esperando muelle</div>`}
      </div>
    </div>
  `;

  gridArea.innerHTML = `
    <div class="cal-layout">
      <div class="cal-grid-scroll">${gridHtml}</div>
      ${unassignedHtml}
    </div>
  `;

  gridArea.querySelectorAll('.load-card[data-edit]').forEach(card=>{
    card.addEventListener('click', ()=>{
      if(!canEditFields()){ toast('Tu rol no tiene permiso para editar registros'); return; }
      const record = cachedArrivals.find(r=>r.id === card.dataset.edit);
      if(record) showEditModal(record);
    });
  });

  renderNowLine();
}

function renderNowLine(){
  const gridEl = document.getElementById('calGridInner');
  if(!gridEl) return;
  if(dayOffset !== 0) return; // solo tiene sentido en el día de hoy
  const now = nowElSalvador();
  const hour = now.getUTCHours();
  const minute = now.getUTCMinutes();
  if(hour < CAL_HOURS[0] || hour > CAL_HOURS[CAL_HOURS.length-1]) return;

  let targetRow = null;
  gridEl.querySelectorAll('.cal-hour-label').forEach(el=>{
    if(el.textContent === pad(hour)+':00') targetRow = el;
  });
  if(!targetRow) return;

  const gridRect = gridEl.getBoundingClientRect();
  const rowRect = targetRow.getBoundingClientRect();
  const top = (rowRect.top - gridRect.top) + (minute/60)*rowRect.height;

  const line = document.createElement('div');
  line.className = 'cal-now-line';
  line.style.top = top + 'px';
  line.innerHTML = `<span class="cal-now-dot"></span><span class="cal-now-time">${pad(hour)}:${pad(minute)}</span>`;
  gridEl.appendChild(line);
}

// Arranca (o reinicia) el temporizador de "en vivo" usando el intervalo configurado en Configuración
// (Notificaciones y geocerca → Actualización automática). Por defecto 90 segundos si no se ha configurado.
async function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  let seconds = 90;
  try{
    const s = await getSettings();
    if(s && s.refreshSeconds) seconds = Math.max(20, s.refreshSeconds);
  }catch(e){}
  refreshTimer = setInterval(()=>{
    // No interrumpir si hay un modal abierto (editando algo) o si el usuario está escribiendo en un campo.
    if(document.querySelector('.modal-overlay')) return;
    // No consultar el servidor si la pestaña está en segundo plano (ahorra operaciones de KV).
    if(document.hidden) return;
    const active = document.activeElement;
    if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
    if(activeNavView==='dashboard') renderList();
    else if(activeNavView==='calendar') renderCalendarView();
    else if(activeNavView==='insights-arrivals') renderInsightsTable();
    else if(activeNavView==='provsched') renderProvSchedList();
    else if(activeNavView==='provsched-view') renderProvSchedList();
  }, seconds * 1000);
}

let lastInsightsExportRows = [];
let lastInsightsExportCols = [];

function exportInsightsToExcel(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el motor de Excel. Revisa tu conexión.'); return; }
  if(!lastInsightsExportRows.length){ toast('No hay registros para exportar con los filtros actuales'); return; }
  const statusLabel = { esperando:'Esperando', en_descarga:'En descarga', despachado:'Despachado' };
  const todayKey = localDateParts().key;
  const data = lastInsightsExportRows.map(r=>{
    const row = {};
    lastInsightsExportCols.forEach(({key,label})=>{
      if(key === 'status') row[label] = statusLabel[r.status] || 'Esperando';
      else if(key === 'time') row[label] = r.date + ' ' + r.time;
      else row[label] = fmtInsightsCell(key, r, todayKey);
    });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registros');
  const rangeLabel = { today:'hoy', week:'semana', all:'todos', custom:'rango' }[insightsRange.mode] || 'registros';
  const fname = `registro-llegadas_${rangeLabel}_${todayKey}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast('Excel descargado');
}
