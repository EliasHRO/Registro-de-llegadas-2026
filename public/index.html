function fmtInsightsCell(col, r, todayKey){
  if(col === 'scope') return r.scopeLabel || '—';
  if(col === 'provider') return r.provider || '—';
  if(col === 'driverName') return r.driverName || '—';
  if(col === 'phone') return r.phone || '—';
  if(col === 'plate') return r.plate || '—';
  if(col === 'orderNumber') return r.orderNumber || '—';
  if(col === 'transportType') return r.transportType || '—';
  if(col === 'dock') return r.dock || '—';
  if(col === 'time') return r.time + (r.date!==todayKey ? ' · '+fmtShortDate(r.date) : '');
  if(col === 'unloadingStartedAt') return r.unloadingStartedAt ? fmtTimeMs(r.unloadingStartedAt) : '—';
  if(col === 'dispatchedAt') return r.dispatchedAt ? fmtTimeMs(r.dispatchedAt) : '—';
  if(col === 'duration') return (r.dispatchedAt && r.unloadingStartedAt) ? fmtDuration((r.dispatchedAt-r.unloadingStartedAt)/60000) : '—';
  if(col.startsWith('custom:')){
    const label = col.slice(7);
    const val = (r.customFields||{})[label];
    if(!val) return '—';
    if(typeof val === 'string' && val.startsWith('data:')) return '📎 archivo';
    return val;
  }
  return '—';
}

function insightsRawValue(col, r){
  if(col === 'scope') return r.scopeLabel || '';
  if(col === 'status') return r.status || 'esperando';
  if(col === 'unloadingStartedAt') return r.unloadingStartedAt ? fmtTimeMs(r.unloadingStartedAt) : '';
  if(col === 'dispatchedAt') return r.dispatchedAt ? fmtTimeMs(r.dispatchedAt) : '';
  if(col === 'duration') return (r.dispatchedAt && r.unloadingStartedAt) ? fmtDuration((r.dispatchedAt-r.unloadingStartedAt)/60000) : '';
  if(col.startsWith('custom:')) return (r.customFields||{})[col.slice(7)] || '';
  return r[col] || '';
}

async function renderInsightsTable(){
  ensureInsightsColumnsInit();
  cachedArrivals = await loadArrivals();
  const wrap = document.getElementById('insightsTableWrap');
  if(!wrap) return;
  const todayKey = localDateParts().key;
  const search = (document.getElementById('insightsSearch')?.value || '').toLowerCase();

  let baseRows = cachedArrivals.slice();
  if(insightsRange.mode === 'today'){
    baseRows = baseRows.filter(r => r.date === todayKey);
  } else if(insightsRange.mode === 'week'){
    const weekAgo = Date.now() - 7*24*60*60*1000;
    baseRows = baseRows.filter(r => r.ts >= weekAgo);
  } else if(insightsRange.mode === 'custom' && insightsRange.from && insightsRange.to){
    baseRows = baseRows.filter(r => r.date >= insightsRange.from && r.date <= insightsRange.to);
  }
  if(search){
    baseRows = baseRows.filter(r => (r.provider||'').toLowerCase().includes(search) || (r.plate||'').toLowerCase().includes(search) || (r.orderNumber||'').toLowerCase().includes(search));
  }
  baseRows.sort((a,b)=>b.ts-a.ts);

  let rows = baseRows;
  Object.entries(insightsColumnFilters).forEach(([col, allowedSet])=>{
    if(allowedSet && allowedSet.size > 0){
      rows = rows.filter(r => allowedSet.has(insightsRawValue(col, r)));
    }
  });

  const statusLabel = { esperando:'Esperando', en_descarga:'En descarga', despachado:'Despachado' };
  const activeCols = INSIGHTS_BASE_COLUMNS.map(c=>c.key).filter(k=>insightsColumns[k]);
  const activeCustomCols = Object.keys(insightsColumns).filter(k=>k.startsWith('custom:') && insightsColumns[k]);
  const allCols = [...activeCols, ...activeCustomCols];
  const colLabel = (k)=> k.startsWith('custom:') ? k.slice(7) : (INSIGHTS_BASE_COLUMNS.find(c=>c.key===k)||{}).label;

  if(allCols.length === 0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">No hay columnas seleccionadas</div>Toca el ícono junto al buscador para elegir qué mostrar.</div>`;
    lastInsightsExportRows = [];
    lastInsightsExportCols = [];
    return;
  }

  lastInsightsExportRows = rows;
  lastInsightsExportCols = allCols.map(k=>({ key:k, label: colLabel(k) }));

  wrap.innerHTML = `
    <table class="insights-table">
      <thead>
        <tr>${allCols.map(k=>`
          <th class="filterable-th ${insightsColumnFilters[k]&&insightsColumnFilters[k].size>0?'has-filter':''}" data-col="${k}">
            <span>${colLabel(k)}</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M4 5h16l-6 8v6l-4-2v-4L4 5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </th>
        `).join('')}</tr>
      </thead>
      <tbody>
        ${rows.length ? rows.map(r=>`
          <tr>
            ${allCols.map(k=>{
              if(k === 'status') return `<td><span class="insights-status-badge ${r.status||'esperando'}">${statusLabel[r.status]||'Esperando'}</span></td>`;
              if(k === 'plate' || k === 'time' || k === 'unloadingStartedAt' || k === 'dispatchedAt' || k === 'duration') return `<td class="mono">${fmtInsightsCell(k,r,todayKey)}</td>`;
              return `<td>${fmtInsightsCell(k,r,todayKey)}</td>`;
            }).join('')}
          </tr>
        `).join('') : `<tr><td colspan="${allCols.length}" style="text-align:center;color:var(--muted);padding:30px;">Sin resultados con los filtros activos</td></tr>`}
      </tbody>
    </table>
    <div class="insights-table-count">${rows.length} registro${rows.length===1?'':'s'}${Object.values(insightsColumnFilters).some(s=>s&&s.size>0) ? ' (filtrado)' : ''}</div>
  `;

  wrap.querySelectorAll('.filterable-th').forEach(th=>{
    th.addEventListener('click', ()=> showInsightsColumnFilterModal(th.dataset.col, baseRows, colLabel(th.dataset.col)));
  });
}

function showInsightsColumnFilterModal(col, baseRows, label){
  const statusLabel = { esperando:'Esperando', en_descarga:'En descarga', despachado:'Despachado' };
  const valueSet = new Set();
  baseRows.forEach(r=>{ const v = insightsRawValue(col, r); if(v) valueSet.add(v); });
  const values = Array.from(valueSet).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  const currentFilter = insightsColumnFilters[col];
  const displayFor = (v)=> col==='status' ? (statusLabel[v]||v) : v;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:360px;">
      <h3>Filtrar por ${label}</h3>
      ${values.length === 0 ? `<p class="hint">No hay valores para filtrar en esta columna.</p>` : `
      <div class="inline-add-row" style="margin-bottom:6px;">
        <button type="button" class="btn-secondary" id="filterSelectAll" style="flex:1;">Seleccionar todos</button>
        <button type="button" class="btn-secondary" id="filterClearAll" style="flex:1;">Limpiar</button>
      </div>
      <div class="role-picker" style="max-height:260px;">
        ${values.map(v=>`
          <label class="checkbox-field" style="margin-bottom:0;padding:8px 4px;"><input type="checkbox" data-val="${v.replace(/"/g,'&quot;')}" ${(!currentFilter || currentFilter.size===0 || currentFilter.has(v)) ? 'checked' : ''}> <span>${displayFor(v)}</span></label>
        `).join('')}
      </div>
      `}
      <div class="modal-actions">
        <button class="btn-secondary" id="filterClose">Cerrar</button>
        ${values.length ? `<button class="btn-primary-sm" id="filterApply">Aplicar</button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#filterClose').onclick = ()=>overlay.remove();
  const selectAllBtn = overlay.querySelector('#filterSelectAll');
  const clearAllBtn = overlay.querySelector('#filterClearAll');
  if(selectAllBtn) selectAllBtn.onclick = ()=>{ overlay.querySelectorAll('[data-val]').forEach(c=>c.checked=true); };
  if(clearAllBtn) clearAllBtn.onclick = ()=>{ overlay.querySelectorAll('[data-val]').forEach(c=>c.checked=false); };
  const applyBtn = overlay.querySelector('#filterApply');
  if(applyBtn) applyBtn.onclick = ()=>{
    const checked = Array.from(overlay.querySelectorAll('[data-val]:checked')).map(c=>c.dataset.val);
    if(checked.length === values.length || checked.length === 0){
      delete insightsColumnFilters[col];
    } else {
      insightsColumnFilters[col] = new Set(checked);
    }
    overlay.remove();
    renderInsightsTable();
  };
}

function greenTintStyle(waitMinutes){
  const t = Math.min(1, Math.max(0, waitMinutes / 120)); // llega a verde completo tras 2 horas
  const r = Math.round(255 + (215 - 255) * t);
  const g = Math.round(255 + (241 - 255) * t);
  const b = Math.round(255 + (223 - 255) * t);
  const borderT = Math.min(1, t * 1.3);
  return `background-color:rgb(${r},${g},${b});border-color:rgba(20,154,92,${(borderT*.4).toFixed(2)});`;
}

function wireCardEvents(container){
  container.querySelectorAll('[data-wa]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const msg = encodeURIComponent(`Hola ${btn.dataset.wname||''}, te contactamos de CD NOVEX (Vidrí).`);
      window.open(`https://wa.me/${btn.dataset.wa}?text=${msg}`, '_blank');
    });
  });
  container.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const record = cachedArrivals.find(r=>r.id === btn.dataset.edit);
      if(record) showEditModal(record);
    });
  });
  container.querySelectorAll('[data-details]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const panel = document.getElementById(btn.dataset.details);
      const opening = !panel.classList.contains('open');
      panel.classList.toggle('open', opening);
      btn.classList.toggle('open', opening);
      btn.querySelector('span').textContent = opening ? 'Ocultar horarios' : 'Ver horarios';
    });
  });
  if(canChangeStatus() && !viewOnlyMode){
    container.querySelectorAll('.arrival-card').forEach(card=>{
      const timeBlock = card.querySelector('.card-time-status');
      if(timeBlock){
        timeBlock.addEventListener('click', (e)=>{
          e.stopPropagation();
          card.classList.add('pulse');
          setTimeout(()=>toggleStatus(card.dataset.id, card.dataset.next), 150);
        });
      }
    });
  }
}

async function renderList(){
  cachedArrivals = await loadArrivals();
  const categories = await getTransportCategories();
  const typeGroups = buildTypeGroups(categories);
  const search = (document.getElementById('searchBox')?.value || '').toLowerCase();

  let filtered = cachedArrivals.filter(r => inPeriod(r, currentPeriod));
  if(getIsGlobal() && cardsScopeFilter !== 'all'){
    filtered = filtered.filter(r => r.scopeKey === cardsScopeFilter || (r.scopeKey||'').startsWith(cardsScopeFilter+':'));
  }
  if(search){
    filtered = filtered.filter(r => r.provider.toLowerCase().includes(search) || (r.driverName||'').toLowerCase().includes(search) || (r.plate||'').toLowerCase().includes(search) || (r.transportType||'').toLowerCase().includes(search) || (r.phone||'').toLowerCase().includes(search) || (r.orderNumber||'').toLowerCase().includes(search));
  }
  filtered.sort((a,b)=>a.ts-b.ts);

  const globalEsperando = filtered.filter(r=>r.status==='esperando' || !r.status).length;
  const globalRegistrados = filtered.length;
  const globalEnDescarga = filtered.filter(r=>r.status==='en_descarga').length;
  const globalDespachado = filtered.filter(r=>r.status==='despachado').length;

  const kpiRow = document.getElementById('kpiRow');
  const isFirstPaint = kpiRow.children.length === 0;
  kpiRow.innerHTML = `
    <div class="stat-card c-patio" style="animation-delay:.02s">
      <div class="top-row"><span class="lbl">Cantidad esperando</span><span class="icon-wrap">${kpiIcon('patio')}</span></div>
      <div class="num" id="kpiEsperando">0</div>
    </div>
    <div class="stat-card c-hoy" style="animation-delay:.08s">
      <div class="top-row"><span class="lbl">Cantidad registrados</span><span class="icon-wrap">${kpiIcon('cal')}</span></div>
      <div class="num" id="kpiRegistrados">0</div>
    </div>
    <div class="stat-card c-promedio" style="animation-delay:.14s">
      <div class="top-row"><span class="lbl">Cantidad en descarga</span><span class="icon-wrap">${kpiIcon('timer')}</span></div>
      <div class="num" id="kpiEnDescarga">0</div>
    </div>
    <div class="stat-card c-despachados" style="animation-delay:.2s">
      <div class="top-row"><span class="lbl">Cantidad despachado</span><span class="icon-wrap">${kpiIcon('check')}</span></div>
      <div class="num" id="kpiDespachado">0</div>
    </div>
  `;
  const dur = isFirstPaint ? 700 : 500;
  animateCountUp(document.getElementById('kpiEsperando'), prevKpiValues.esperando||0, globalEsperando, dur);
  animateCountUp(document.getElementById('kpiRegistrados'), prevKpiValues.registrados||0, globalRegistrados, dur);
  animateCountUp(document.getElementById('kpiEnDescarga'), prevKpiValues.enDescarga||0, globalEnDescarga, dur);
  animateCountUp(document.getElementById('kpiDespachado'), prevKpiValues.despachado||0, globalDespachado, dur);
  prevKpiValues = { esperando: globalEsperando, registrados: globalRegistrados, enDescarga: globalEnDescarga, despachado: globalDespachado };

  const cardsArea = document.getElementById('cardsArea');
  if(filtered.length === 0){
    cardsArea.className = '';
    cardsArea.innerHTML = `<div class="empty-state"><div class="big">No hay llegadas en este período</div>Prueba con otro filtro o espera el próximo registro.</div>`;
    return;
  }

  if(cardViewMode === 'list'){
    // Vista "en fila": todos los registros en una sola columna, tarjetas a todo lo ancho, sin agrupar por tipo de transporte.
    cardsArea.className = 'cards-list';
    cardsArea.innerHTML = filtered.map((r,i)=>buildCardHtml(r,i)).join('');
  } else {
    // Vista "vertical" (por defecto): tablero de columnas agrupado por tipo de transporte (Contenedor/Camión/Otros).
    cardsArea.className = 'type-columns';
    cardsArea.innerHTML = typeGroups.map(g=>{
      const items = filtered.filter(r => r.transportType === g.key);
      const esperando = items.filter(r => r.status === 'esperando' || !r.status).length;
      const enDescarga = items.filter(r => r.status === 'en_descarga').length;
      const despachado = items.filter(r => r.status === 'despachado').length;
      return `
        <div class="type-column">
          <div class="type-column-head">
            <div>
              <span class="tc-name">${g.icon} ${g.label}</span>
              <div class="tc-substats">${esperando} esperando · ${enDescarga} descarga · ${despachado} listo</div>
            </div>
            <span class="tc-count">${items.length}</span>
          </div>
          <div class="type-column-stack">
            ${items.length ? items.map((r,i)=>buildCardHtml(r,i)).join('') : `<div class="type-column-empty">Sin registros</div>`}
          </div>
        </div>
      `;
    }).join('');
  }

  wireCardEvents(cardsArea);
}

function provSchedWeekRange(weekOffset){
  const todayParts = localDateParts(0);
  const todayUTC = new Date(Date.UTC(todayParts.y, todayParts.m, todayParts.d));
  const dow = todayUTC.getUTCDay(); // 0=dom..6=sáb
  const mondayOffset = (dow === 0 ? -6 : 1 - dow);
  const monday = new Date(todayUTC.getTime() + (mondayOffset + weekOffset*7) * 86400000);
  const sunday = new Date(monday.getTime() + 6*86400000);
  const toKey = (d)=> d.toISOString().slice(0,10);
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const label = `${monday.getUTCDate()} ${meses[monday.getUTCMonth()]} – ${sunday.getUTCDate()} ${meses[sunday.getUTCMonth()]} ${sunday.getUTCFullYear()}`;
  return { startKey: toKey(monday), endKey: toKey(sunday), label };
}

function provSchedMonthRange(monthOffset){
  const todayParts = localDateParts(0);
  let y = todayParts.y, m = todayParts.m + monthOffset;
  while(m < 0){ m += 12; y -= 1; }
  while(m > 11){ m -= 12; y += 1; }
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const startKey = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const lastDay = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  const endKey = `${y}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return { y, m, startKey, endKey, label: `${meses[m]} ${y}` };
}

function provSchedInPeriod(c){
  if(provSchedPeriod === 'all') return true;
  if(provSchedPeriod === 'day'){
    return c.date === localDateParts(provSchedDayOffset).key;
  }
  if(provSchedPeriod === 'week'){
    const r = provSchedWeekRange(provSchedWeekOffset);
    return c.date >= r.startKey && c.date <= r.endKey;
  }
  if(provSchedPeriod === 'month'){
    const r = provSchedMonthRange(provSchedMonthOffset);
    return c.date >= r.startKey && c.date <= r.endKey;
  }
  return true;
}

function dateKeyLabel(dateKey){
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const [y,m,d] = dateKey.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  let label = `${dias[dt.getUTCDay()]}, ${d} de ${meses[m-1]}`;
  if(dateKey === localDateParts(0).key) label = 'Hoy · ' + label;
  return label;
}

async function loadProvSchedConfig(force){
  if(provSchedConfig && !force) return provSchedConfig;
  try{ provSchedConfig = await apiGet('/api/provsched-config'); }
  catch(e){ provSchedConfig = { slotMinutes: 30, days: {
    mon:{enabled:true,start:'07:00',end:'17:00'}, tue:{enabled:true,start:'07:00',end:'17:00'},
    wed:{enabled:true,start:'07:00',end:'17:00'}, thu:{enabled:true,start:'07:00',end:'17:00'},
    fri:{enabled:true,start:'07:00',end:'17:00'}, sat:{enabled:true,start:'07:00',end:'12:00'},
    sun:{enabled:false,start:'07:00',end:'12:00'}
  }}; }
  return provSchedConfig;
}

function computeDaySlots(dateStr, config, citas, excludeId, docksCount){
  const dayKeyMap = ['sun','mon','tue','wed','thu','fri','sat'];
  const dt = new Date(dateStr + 'T00:00:00Z');
  const dayCfg = config.days[dayKeyMap[dt.getUTCDay()]];
  if(!dayCfg || !dayCfg.enabled) return [];
  const [startH,startM] = dayCfg.start.split(':').map(Number);
  const [endH,endM] = dayCfg.end.split(':').map(Number);
  let cur = startH*60+startM;
  const end = endH*60+endM;
  const step = config.slotMinutes || 30;
  // Cuenta cuántas citas activas ya ocupan cada horario ese día — con 2+ muelles, un mismo horario
  // puede tener varias citas a la vez (una por muelle), no solo una.
  const cap = Math.max(1, docksCount || 1);
  const takenCount = {};
  citas.filter(c=>c.status!=='cancelado' && c.status!=='no_presento' && c.date===dateStr && c.id!==excludeId)
    .forEach(c=>{ takenCount[c.time] = (takenCount[c.time]||0) + 1; });
  const today = localDateParts();
  const isToday = dateStr === today.key;
  const nowMinutes = isToday ? (nowElSalvador().getUTCHours()*60 + nowElSalvador().getUTCMinutes()) : -1;
  const slots = [];
  while(cur < end){
    const hh = String(Math.floor(cur/60)).padStart(2,'0');
    const mm = String(cur%60).padStart(2,'0');
    const timeStr = `${hh}:${mm}`;
    const isPast = isToday && cur <= nowMinutes;
    if((takenCount[timeStr]||0) < cap && !isPast) slots.push(timeStr);
    cur += step;
  }
  return slots;
}

function fmtSlotLabel(timeStr){
  const [h,m] = timeStr.split(':').map(Number);
  const period = h < 12 ? 'a.m.' : 'p.m.';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

// Texto corto de puntualidad para mostrar junto al estado "Llegó" de una cita vinculada.
function fmtPunctuality(punctuality, minutes){
  if(!punctuality) return '';
  const absMin = Math.abs(minutes||0);
  if(punctuality === 'tarde') return `🔴 ${absMin} min tarde`;
  return absMin > 0 ? `🟢 A tiempo (${absMin} min antes)` : '🟢 A tiempo';
}

// Widget reutilizable: cuadrícula de 5 días con horarios disponibles, como OpenDock.
function renderDateTimePicker(container, opts){
  const { config, citas, excludeId, onSelect, docksCount } = opts;
  let offset = 0;
  let selectedDate = opts.initialDate || null;
  let selectedTime = opts.initialTime || null;

  function paint(){
    const days = [0,1,2,3,4].map(i => localDateParts(offset+i));
    const diasNombre = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    container.innerHTML = `
      <div class="dtp-header">
        <button type="button" class="dtp-nav-btn" id="dtpPrev" ${offset<=0?'disabled':''} title="Días anteriores">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="dtp-title">Selecciona fecha y hora</span>
        <button type="button" class="dtp-nav-btn" id="dtpNext" title="Días siguientes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="dtp-grid">
        ${days.map(d=>{
          const slots = computeDaySlots(d.key, config, citas, excludeId, docksCount);
          return `
            <div>
              <div class="dtp-day-head">
                <div class="dtp-day-name">${diasNombre[new Date(d.key+'T00:00:00Z').getUTCDay()]}</div>
                <div class="dtp-day-date">${String(d.d).padStart(2,'0')}/${String(d.m+1).padStart(2,'0')}/${d.y}</div>
              </div>
              ${slots.length ? `
                <div class="dtp-slots" data-date="${d.key}">
                  ${slots.map(t=>`<button type="button" class="dtp-slot ${selectedDate===d.key&&selectedTime===t?'selected':''}" data-date="${d.key}" data-time="${t}">${fmtSlotLabel(t)}</button>`).join('')}
                </div>
              ` : `<div class="dtp-empty">Sin disponibilidad</div>`}
            </div>
          `;
        }).join('')}
      </div>
    `;
    container.querySelector('#dtpPrev').onclick = ()=>{ offset = Math.max(0, offset-5); paint(); };
    container.querySelector('#dtpNext').onclick = ()=>{ offset += 5; paint(); };
    container.querySelectorAll('.dtp-slot').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedDate = btn.dataset.date;
        selectedTime = btn.dataset.time;
        container.querySelectorAll('.dtp-slot').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        if(onSelect) onSelect(selectedDate, selectedTime);
      });
    });
  }
  paint();
}

async function showProvSchedFormModal(){
  const config = await loadProvSchedConfig();
  let citas = provSchedCitas.length ? provSchedCitas : await apiGet('/api/provsched-citas').catch(()=>[]);

      <div class="field"><label>Número de orden de compra</label><input id="psOrderNumber" placeholder="ej. OC-4521"></div>
      <div class="field"><label>Nombre del proveedor</label><input id="psProviderName" placeholder="ej. Distribuidora XYZ"></div>

      <div class="field"><label>Categoría</label>

            <div><div class="ro-name">Contenedores</div></div>
          </label>
        </div>
      </div>
      ${provSchedTargetScopeField()}
      <div id="psCustomFieldsArea"></div>
      <div id="psDatePickerWrap" style="margin-top:6px;"></div>
      <div class="err-msg" id="psErr"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="psCancel">Cancelar</button>
        <button class="btn-primary-sm" id="psSave">Programar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#psCancel').onclick = ()=>overlay.remove();

  const psFields = await loadProvSchedFormFields();
  const psFieldsCtl = wireProvSchedCustomFields(document.getElementById('psCustomFieldsArea'), psFields);

  overlay.querySelectorAll('#psCategoryPicker .role-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      overlay.querySelectorAll('#psCategoryPicker .role-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
    });
  });

  overlay.querySelector('#psDocumentFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    const infoEl = document.getElementById('psDocumentInfo');
    if(!file){ documentData = null; documentName = null; infoEl.textContent = ''; return; }
    if(file.size > 5*1024*1024){ toast('El documento debe pesar menos de 5 MB'); e.target.value = ''; documentData=null; documentName=null; infoEl.textContent=''; return; }
    documentName = file.name;
    documentData = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    infoEl.textContent = `Archivo listo: ${file.name}`;
  });

  let selDate = null, selTime = null;
  renderDateTimePicker(document.getElementById('psDatePickerWrap'), {
    config, citas, excludeId: null, docksCount,
    onSelect: (d,t)=>{ selDate = d; selTime = t; }
  });

  overlay.querySelector('#psSave').onclick = async ()=>{
    const errEl = document.getElementById('psErr');
    errEl.textContent = '';
    const orderNumber = document.getElementById('psOrderNumber').value.trim();
    const providerName = document.getElementById('psProviderName').value.trim();
    const category = overlay.querySelector('input[name="psCategory"]:checked').value;
    if(!orderNumber || !providerName){ errEl.textContent = 'Completa el número de orden y el nombre del proveedor'; return; }
    if(!selDate || !selTime){ errEl.textContent = 'Elige un día y una hora disponibles'; return; }
    const { customFields, error: psFieldsError } = psFieldsCtl.getValues();
    if(psFieldsError){ errEl.textContent = psFieldsError; return; }
    const body = { orderNumber, providerName, category, date: selDate, time: selTime, documentData, documentName, customFields };
    if(canPickScope()){
      const sel = document.getElementById('provSchedScope');
      if(sel){ const [c,f] = sel.value.split('|'); body.scope = f ? `${c}:${f}` : c; }
    }
    const btn = overlay.querySelector('#psSave');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      await apiPost('/api/provsched-citas', body);
      overlay.remove();
      toast('Programación creada');
      renderProvSchedList();
    }catch(e){
      errEl.textContent = e.message || 'No se pudo crear la programación';
      btn.disabled = false; btn.textContent = 'Programar';
    }
  };
}

            <div><div class="ro-name">Compras Locales</div></div>
          </label>
          <label class="role-option ${cita.category==='Contenedores'?'selected':''}" data-cat="Contenedores">
            <input type="radio" name="peCategory" value="Contenedores" ${cita.category==='Contenedores'?'checked':''}>
            <div><div class="ro-name">Contenedores</div></div>
          </label>
        </div>
      </div>
      <div class="field"><label>Documento de orden de compra</label>
        ${cita.documentData ? `<div class="field-hint" style="margin-bottom:6px;">Actual: ${cita.documentName||'documento'} · <a href="${cita.documentData}" target="_blank">ver</a> · <a href="#" id="peRemoveDoc">quitar</a></div>` : ''}
        <input id="peDocumentFile" type="file" accept=".pdf,.jpg,.jpeg,.png">
        <div id="peDocumentInfo" class="field-hint" style="margin-top:4px;"></div>
      </div>
      <div id="peCustomFieldsArea"></div>
      <div class="err-msg" id="peErr"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="peCancel">Cancelar</button>
        <button class="btn-primary-sm" id="peSave">Guardar cambios</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#peCancel').onclick = ()=>overlay.remove();

  const peFields = await loadProvSchedFormFields();
  const peFieldsCtl = wireProvSchedCustomFields(document.getElementById('peCustomFieldsArea'), peFields, cita.customFields || {});

  overlay.querySelectorAll('#peCategoryPicker .role-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      overlay.querySelectorAll('#peCategoryPicker .role-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
    });
  });

  const removeLink = overlay.querySelector('#peRemoveDoc');
  if(removeLink) removeLink.addEventListener('click', (e)=>{
    e.preventDefault();
    documentData = null; documentName = null;
    removeLink.parentElement.textContent = 'Se quitará el documento actual al guardar.';
  });

  overlay.querySelector('#peDocumentFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    const infoEl = document.getElementById('peDocumentInfo');
    if(!file){ return; }
    if(file.size > 5*1024*1024){ toast('El documento debe pesar menos de 5 MB'); e.target.value = ''; return; }
    documentName = file.name;
    documentData = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    infoEl.textContent = `Archivo listo: ${file.name}`;
  });

  overlay.querySelector('#peSave').onclick = async ()=>{
    const errEl = document.getElementById('peErr');
    errEl.textContent = '';
    const orderNumber = document.getElementById('peOrderNumber').value.trim();
    const providerName = document.getElementById('peProviderName').value.trim();
    const category = overlay.querySelector('input[name="peCategory"]:checked').value;
    if(!orderNumber || !providerName){ errEl.textContent = 'Completa el número de orden y el nombre del proveedor'; return; }
    const { customFields: peCustomFields, error: peFieldsError } = peFieldsCtl.getValues();
    if(peFieldsError){ errEl.textContent = peFieldsError; return; }
    const body = { id: cita.id, orderNumber, providerName, category, customFields: peCustomFields };
    if(documentData !== undefined){ body.documentData = documentData; body.documentName = documentName; }
    if(canPickScope() && cita.scopeKey) body.scope = cita.scopeKey;
    const btn = overlay.querySelector('#peSave');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      await apiPatch('/api/provsched-citas', body);
      overlay.remove();
      toast('Programación actualizada');
      renderProvSchedList();
    }catch(e){
      errEl.textContent = e.message || 'No se pudo guardar';
      btn.disabled = false; btn.textContent = 'Guardar cambios';
    }
  };
}

// Exporta a Excel exactamente las citas que están visibles según el período elegido (Día/Semana/Mes/Todos)
// y los filtros de categoría/estado/búsqueda activos — igual que "Exportar" en el Registro de llegadas.
function exportProvSchedToExcel(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el motor de Excel. Revisa tu conexión.'); return; }
  let rows = provSchedCitas.slice();
  rows = rows.filter(provSchedInPeriod);
  if(provSchedBodegaFilter !== 'all') rows = rows.filter(c=>c.scopeKey === provSchedBodegaFilter);
  if(provSchedFilterCat !== 'Todos') rows = rows.filter(c=>c.category === provSchedFilterCat);
  if(provSchedFilterEstado === 'activos') rows = rows.filter(c=>c.status !== 'cancelado');
  else if(provSchedFilterEstado === 'cancelados') rows = rows.filter(c=>c.status === 'cancelado');
  if(provSchedSearch){
    rows = rows.filter(c=> (c.providerName||'').toLowerCase().includes(provSchedSearch) || (c.orderNumber||'').toLowerCase().includes(provSchedSearch));
  }
  if(rows.length === 0){ toast('No hay citas para exportar con los filtros actuales'); return; }
  rows.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

  const statusLabelMap = { programado:'Programado', reprogramado:'Reprogramado', cancelado:'Cancelado', en_espera:'En espera (llegó)', en_descarga:'En descarga', completado:'Completado', no_presento:'No se presentó' };
  const showScopeCol = canPickScope() || new Set(rows.map(r=>r.scopeKey).filter(Boolean)).size > 1;
  const data = rows.map(c=>Object.assign(
    showScopeCol ? { 'País / Bodega': c.scopeLabel||'' } : {},
    {
      'Fecha': c.date||'', 'Hora': fmtSlotLabel(c.time||''), 'Proveedor': c.providerName||'', 'Orden de compra': c.orderNumber||'',
      'Categoría': c.category||'', 'Estado': statusLabelMap[c.status]||c.status||'',
      'Puntualidad': c.punctuality ? (c.punctuality==='tarde' ? `Tarde (${Math.abs(c.punctualityMinutes||0)} min)` : `A tiempo${c.punctualityMinutes? ' ('+Math.abs(c.punctualityMinutes)+' min antes)':''}`) : '',
      'Documento': c.documentData ? 'Sí' : 'No'
    }
  ));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Citas');
  const periodLabel = { day:'dia', week:'semana', month:'mes', all:'todos' }[provSchedPeriod] || 'citas';
  XLSX.writeFile(wb, `programacion-proveedores_${periodLabel}_${localDateParts().key}.xlsx`);
  toast('Excel descargado');
}

// Si las citas cargadas incluyen más de una bodega (ej. un admin de Guatemala viendo varias bodegas Atlas y CD Santa
// Elena juntas), muestra un filtro para ver solo una de ellas o ambas.
function renderProvSchedBodegaFilterRow(){
  const wrap = document.getElementById('psBodegaFilterRow');
  if(!wrap) return;
  const seen = new Map();
  provSchedCitas.forEach(c=>{ if(c.scopeKey) seen.set(c.scopeKey, c.scopeLabel || c.scopeKey); });
  if(seen.size < 2){ wrap.innerHTML = ''; return; }
  const entries = Array.from(seen.entries());
  wrap.innerHTML = `
    <div class="period-tabs" id="psBodegaTabs">
      <button data-scope="all" class="${provSchedBodegaFilter==='all'?'active':''}">Ambas</button>
      ${entries.map(([key,label])=>`<button data-scope="${key}" class="${provSchedBodegaFilter===key?'active':''}">${label}</button>`).join('')}
    </div>
  `;
  wrap.querySelector('#psBodegaTabs').onclick = (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    document.querySelectorAll('#psBodegaTabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    provSchedBodegaFilter = btn.dataset.scope;
    renderProvSchedList(true);
  };
}

async function renderProvSchedList(skipFetch){
  const listEl = document.getElementById('provSchedList');
  if(!listEl) return;
  if(!skipFetch){
    try{ provSchedCitas = await apiGet('/api/provsched-citas'); }
    catch(e){ toast(e.message || 'No se pudieron cargar las programaciones'); provSchedCitas = []; }
  }
  renderProvSchedBodegaFilterRow();
  const today = localDateParts().key;
  let rows = provSchedCitas.slice();
  rows = rows.filter(provSchedInPeriod);
  if(provSchedBodegaFilter !== 'all') rows = rows.filter(c=>c.scopeKey === provSchedBodegaFilter);
  if(provSchedFilterCat !== 'Todos') rows = rows.filter(c=>c.category === provSchedFilterCat);
  if(provSchedFilterEstado === 'activos') rows = rows.filter(c=>c.status !== 'cancelado');
  else if(provSchedFilterEstado === 'cancelados') rows = rows.filter(c=>c.status === 'cancelado');
  if(provSchedSearch){
    rows = rows.filter(c=> (c.providerName||'').toLowerCase().includes(provSchedSearch) || (c.orderNumber||'').toLowerCase().includes(provSchedSearch));
  }
  rows.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

  if(rows.length === 0){
    listEl.innerHTML = `<div class="empty-state"><div class="big">No hay programaciones</div>Crea una con "+ Nueva programación", o revisa otro período.</div>`;
    return;
  }

  if(provSchedPeriod === 'week' && provSchedViewMode === 'calendar'){
    renderProvSchedCalendarGrid(listEl, rows);
    return;
  }

  // Agrupa por día para poder revisarlas día por día dentro de la semana/mes seleccionado.
  const groups = [];
  let lastDate = null;
  rows.forEach(c=>{
    if(c.date !== lastDate){ groups.push({ date: c.date, items: [] }); lastDate = c.date; }
    groups[groups.length-1].items.push(c);
  });

  const statusLabel = { programado: 'Programado', reprogramado: 'Reprogramado', cancelado: 'Cancelado', en_espera: 'En espera (llegó)', en_descarga: 'En descarga', completado: 'Completado', no_presento: 'No se presentó' };
  listEl.innerHTML = groups.map(g => `
    <div class="provsched-day-group">
      <div class="provsched-day-header">${dateKeyLabel(g.date)} <span class="provsched-day-count">${g.items.length}</span></div>
      ${g.items.map(c=>{
        const isPast = c.date < today;
        const canAct = c.status !== 'cancelado';
        const canNoShow = canAct && c.status !== 'no_presento' && !c.linkedArrivalId && canCancelProvSched();
        return `
        <div class="provsched-row">
          <div style="flex:1;min-width:200px;">
            <div style="font-weight:700;font-size:13.5px;">${c.providerName} <span style="font-weight:500;color:var(--muted);">· Orden ${c.orderNumber}</span></div>
            <div class="hint" style="margin:3px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <span>${fmtSlotLabel(c.time)}</span>
              <span class="provsched-cat">${c.category}</span>
              ${c.scopeLabel ? `<span class="provsched-cat">${c.scopeLabel}</span>` : ''}
              ${isPast && c.status!=='cancelado' ? `<span style="color:var(--muted);">· ya pasó</span>` : ''}
              ${c.punctuality ? `<span class="provsched-cat">${fmtPunctuality(c.punctuality, c.punctualityMinutes)}</span>` : ''}
            </div>

            ${canAct ? `<button type="button" class="btn-secondary" data-act="reprog" data-id="${c.id}" style="padding:6px 10px;font-size:11.5px;">Reprogramar</button>` : ''}

          </div>
        </div>
      `;}).join('')}

async function imageUrlToDataUri(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('No se pudo cargar la imagen');
  const blob = await res.blob();
  return await new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function loadImageDims(dataUri){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = ()=>resolve({ w: 1, h: 1 });
    img.src = dataUri;
  });
}

async function generateQrPosterPdf({ logoUrl, placeLabel, qrImgUrl, baseUrl }){
  if(typeof window.jspdf === 'undefined'){ toast('No se pudo cargar el motor de PDF. Revisa tu conexión.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const centerX = pageW / 2;
  const accent = [225, 29, 72];
  const accentDark = [175, 19, 56];
  const textDark = [28, 31, 38];
  const muted = [107, 114, 128];
  const leftX = 70;
  const maxTextW = pageW - leftX - 70 - 22;

  const steps = [
    'Abra su aplicación de cámara y escanee el código.',
    'Toque el enlace que aparece.',
    'Siga las instrucciones en pantalla.',
    'Esté atento a sus mensajes; la asignación de muelle y otros detalles importantes se enviarán después del registro.'
  ];

  // --- Prepara imágenes y mide todo primero, para poder centrar el póster completo verticalmente ---
  let logoDataUri = null, logoW = 170, logoH = 0;
  try{
    logoDataUri = await imageUrlToDataUri(logoUrl);
    const dims = await loadImageDims(logoDataUri);
    logoH = logoW * (dims.h / dims.w);
  }catch(e){ logoH = 0; }

  let qrDataUri = null;
  try{ qrDataUri = await imageUrlToDataUri(qrImgUrl); }catch(e){ qrDataUri = null; }
  const qrBoxSize = 320;
  const qrPad = 24;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(12.5);
  const stepLines = steps.map(s => doc.splitTextToSize(s, maxTextW));
  const stepsBlockH = stepLines.reduce((sum, lines) => sum + lines.length * 16 + 10, 0);

  const gapAfterLogo = logoDataUri ? 30 : 6;
  const badgeH = 26, gapAfterBadge = 22;
  const titleH = 34, gapAfterTitle = 6;
  const subtitleH = 15, gapAfterSubtitle = 20;
  const gapAfterDivider = 32;
  const gapAfterQr = 36;
  const instrHeadH = 18, gapAfterInstrHead = 22;

  const totalH = logoH + gapAfterLogo + badgeH + gapAfterBadge + titleH + gapAfterTitle
    + subtitleH + gapAfterSubtitle + gapAfterDivider + (qrDataUri ? qrBoxSize : 40) + gapAfterQr
    + instrHeadH + gapAfterInstrHead + stepsBlockH;

  let y = Math.max(46, (pageH - totalH) / 2);

  // Logo (NOVEX)
  if(logoDataUri){
    doc.addImage(logoDataUri, 'PNG', centerX - logoW/2, y, logoW, logoH);
    y += logoH + gapAfterLogo;
  } else {
    y += gapAfterLogo;
  }

  // Insignia "CHECK-IN"
  const badgeW = 110;
  doc.setFillColor(...accentDark);
  doc.roundedRect(centerX - badgeW/2, y, badgeW, badgeH, 13, 13, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.text('CHECK-IN', centerX, y + badgeH/2 + 4, { align: 'center' });
  y += badgeH + gapAfterBadge;

  // Título
  doc.setTextColor(...textDark);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(30);
  doc.text('Registro rápido', centerX, y, { align: 'center' });
  y += titleH + gapAfterTitle;

  // Subtítulo dinámico: Centro de Distribución + país/bodega activo
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(13);
  doc.setTextColor(...muted);
  doc.text(`Centro de Distribución · ${placeLabel}`, centerX, y, { align: 'center' });
  y += subtitleH + gapAfterSubtitle;

  // Línea divisoria roja
  doc.setDrawColor(...accent);
  doc.setLineWidth(2.5);
  doc.line(centerX - 40, y, centerX + 40, y);
  y += gapAfterDivider;

  // Caja blanca con el QR
  if(qrDataUri){
    doc.setFillColor(255,255,255);
    doc.setDrawColor(230,230,235);
    doc.roundedRect(centerX - qrBoxSize/2, y, qrBoxSize, qrBoxSize, 14, 14, 'FD');
    doc.addImage(qrDataUri, 'PNG', centerX - (qrBoxSize-qrPad*2)/2, y + qrPad, qrBoxSize - qrPad*2, qrBoxSize - qrPad*2);
    y += qrBoxSize + gapAfterQr;
  } else {
    doc.setFontSize(11);
    doc.setTextColor(...muted);
    doc.text('(No se pudo incrustar la imagen del código QR)', centerX, y + 20, { align: 'center' });
    y += 40 + gapAfterQr;
  }

  // Instrucciones
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.setTextColor(...textDark);
  doc.text('Instrucciones:', leftX, y);
  y += gapAfterInstrHead;

  doc.setFontSize(12.5);
  steps.forEach((step, i)=>{
    const lines = stepLines[i];
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...textDark);
    doc.text(`${i+1}.`, leftX, y);
    doc.setFont('helvetica', 'normal');
    doc.text(lines, leftX + 22, y);
    y += lines.length * 16 + 10;
  });

  doc.save(`registro-rapido-qr-${placeLabel.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.pdf`);
}

function renderQrTab(panel){
  const country = getCountry();
  const facility = getFacility();
  const needsFacility = countryNeedsFacility(country);
  const baseUrl = location.origin + '/?pais=' + country + (needsFacility ? '&bodega=' + facility : '');
  const qrImg = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(baseUrl);
  const placeLabel = needsFacility ? `${COUNTRY_INFO[country]?.label||country} · ${facilityLabel(country, facility)}` : (COUNTRY_INFO[country]?.label||country);
  panel.innerHTML = `
    <p class="hint">Imprime este código y colócalo en el punto de recepción. Al escanearlo, el transportista llega directo al formulario de registro de <b>${placeLabel}</b>, sin necesidad de elegir nada.</p>

      <img src="${qrImg}" alt="QR de registro">

    <button type="button" class="btn-primary-sm" id="btnDownloadQrPoster" style="display:block;text-align:center;width:100%;max-width:220px;margin-top:14px;">Descargar</button>
  `;
  panel.querySelector('#btnDownloadQrPoster').onclick = async (e)=>{
    const btn = e.target;
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = 'Generando PDF...';
    try{
      await generateQrPosterPdf({ logoUrl: '/assets/novex.png', placeLabel, qrImgUrl: qrImg, baseUrl });

      toast('No se pudo generar el PDF: ' + (err.message || 'error desconocido'));

    };
    overlay.querySelector('#delPsFieldConfirm').onclick = doDelete;
    pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doDelete(); });
  }

  function renderCategoriesList(){
    const list = document.getElementById('categoriesList');
    if(currentCategories.length === 0){
      list.innerHTML = `<div class="empty-list">Sin categorías — se usarán "Contenedor, Camión, Otros" por defecto.</div>`;
      return;
    }
    list.innerHTML = currentCategories.map((name,i)=>`
      <div class="admin-list-row" style="gap:8px;">
        <input class="cat-name-input" data-i="${i}" value="${name}" style="flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:inherit;font-size:13px;background:var(--card);color:var(--text);">
        <button class="del-btn" data-i="${i}" title="Eliminar categoría"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    `).join('');
    list.querySelectorAll('.cat-name-input').forEach(inp=>{
      inp.addEventListener('input', ()=>{ currentCategories[parseInt(inp.dataset.i)] = inp.value; });
    });
    list.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = ()=>{ currentCategories.splice(parseInt(btn.dataset.i),1); renderCategoriesList(); };
    });
  }
  renderCategoriesList();

  panel.querySelector('#btnAddCategory').onclick = ()=>{
    const name = document.getElementById('newCategoryName').value.trim();
    if(!name){ toast('Escribe un nombre para la categoría'); return; }
    currentCategories.push(name);
    document.getElementById('newCategoryName').value = '';
    renderCategoriesList();
  };
  panel.querySelector('#btnAddField').onclick = ()=>{
    const label = document.getElementById('newFieldLabel').value.trim();
    if(!label){ toast('Escribe una etiqueta para el campo'); return; }
    const type = document.getElementById('newFieldType').value;
    const id = 'f' + Date.now();
    const visible = document.getElementById('newFieldVisible').checked;
    const newField = { id, label, type, required: visible && document.getElementById('newFieldRequired').checked, visible };
    if(OPTIONS_TYPES.includes(type)){
      const options = document.getElementById('newFieldOptions').value.split('\n').map(o=>o.trim()).filter(Boolean);
      if(options.length === 0){ toast('Agrega al menos una opción para este tipo de campo'); return; }
      newField.options = options;
    }
    currentFields.push(newField);
    document.getElementById('newFieldLabel').value = '';
    document.getElementById('newFieldOptions').value = '';
    document.getElementById('newFieldRequired').checked = false;
    document.getElementById('newFieldVisible').checked = true;
    renderFieldsList();
  };
  panel.querySelector('#btnAddPsField').onclick = ()=>{
    const label = document.getElementById('newPsFieldLabel').value.trim();
    if(!label){ toast('Escribe una etiqueta para el campo'); return; }
    const type = document.getElementById('newPsFieldType').value;
    const id = 'pf' + Date.now();
    const newField = { id, label, type, required: document.getElementById('newPsFieldRequired').checked };
    if(OPTIONS_TYPES.includes(type)){
      const options = document.getElementById('newPsFieldOptions').value.split('\n').map(o=>o.trim()).filter(Boolean);
      if(options.length === 0){ toast('Agrega al menos una opción para este tipo de campo'); return; }
      newField.options = options;
    }
    currentPsFields.push(newField);
    document.getElementById('newPsFieldLabel').value = '';
    document.getElementById('newPsFieldOptions').value = '';
    document.getElementById('newPsFieldRequired').checked = false;
    renderPsFieldsList();
  };
  panel.querySelector('#fieldsSave').onclick = async ()=>{
    try{
      const cleanCategories = currentCategories.map(c=>c.trim()).filter(Boolean);
      const newLabels = {
        provider: document.getElementById('lblFieldProvider').value.trim() || DEFAULT_FIELD_LABELS.provider,
        driverName: document.getElementById('lblFieldDriver').value.trim() || DEFAULT_FIELD_LABELS.driverName,
        phone: document.getElementById('lblFieldPhone').value.trim() || DEFAULT_FIELD_LABELS.phone,
        plate: document.getElementById('lblFieldPlate').value.trim() || DEFAULT_FIELD_LABELS.plate,
        transportType: document.getElementById('lblFieldType').value.trim() || DEFAULT_FIELD_LABELS.transportType
      };
      const newRequired = {
        provider: document.getElementById('reqField_provider').checked,
        driverName: document.getElementById('reqField_driverName').checked,
        phone: document.getElementById('reqField_phone').checked,
        plate: document.getElementById('reqField_plate').checked,
        transportType: document.getElementById('reqField_transportType').checked
      };
      const currentSettings = await getSettings();
      await saveSettings(Object.assign({}, currentSettings, { fieldLabels: newLabels, fieldRequired: newRequired, transportCategories: cleanCategories }));
      await apiPost('/api/formfields', { fields: currentFields });
      await apiPost('/api/provsched-formfields', { fields: currentPsFields });
      toast('Campos del formulario actualizados');
    }catch(e){ toast(e.message || 'No se pudo guardar'); }
  };
}

function renderBackupTab(panel){
  if(!getIsGlobal()){
    panel.innerHTML = `<div class="empty-state"><div class="big">No autorizado</div>Esta sección es exclusiva del superusuario.</div>`;
    return;
  }
  panel.innerHTML = `
    <p class="hint">Descarga una copia de lo que necesites del sistema — de todos los países y bodegas — en un solo archivo de Excel, con una hoja por tipo de dato que elijas.</p>
    <div class="section-label">¿Qué quieres incluir?</div>
    <label class="checkbox-field"><input type="checkbox" id="bkIncludeArrivals" checked> <span>Llegadas de Transportistas (registro activo + papelera)</span></label>
    <label class="checkbox-field"><input type="checkbox" id="bkIncludeCitas" checked> <span>Programación de Citas</span></label>
    <label class="checkbox-field"><input type="checkbox" id="bkIncludePerspectiva" checked> <span>Perspectiva (registro de llegadas)</span></label>
    <label class="checkbox-field"><input type="checkbox" id="bkIncludeUsers" checked> <span>Usuarios</span></label>
    <button type="button" class="btn-primary-sm" id="btnFullBackup" style="width:100%;max-width:320px;margin-top:6px;">📦 Descargar respaldo (Excel)</button>
    <div class="err-msg" id="backupErr" style="margin-top:10px;"></div>

    <div class="section-label">Respaldo automático programado</div>
    <p class="hint" style="margin-top:-6px;">El sistema genera solo, sin que nadie tenga que entrar, un respaldo <b>todos los días a las 6:00 a.m. UTC</b> y uno <b>completo cada lunes</b>. Se envía completo (con todos los datos) al webhook que configures abajo — desde tu escenario de Zapier/Make decides qué hacer con él: mandarlo por correo, guardarlo en Google Drive, etc. No usa ningún servicio de pago de Cloudflare.</p>
    <div class="field"><label>Correo para avisos de respaldo</label><input id="bkEmail" placeholder="ti@vidri.com"></div>
    <div class="field"><label>URL del webhook (Zapier/Make/Pipedream)</label><input id="bkWebhook" placeholder="https://hooks.zapier.com/..."></div>
    <button type="button" class="btn-secondary" id="btnSaveBackupCfg" style="width:100%;max-width:220px;margin-bottom:10px;">Guardar aviso</button>
    <div class="err-msg" id="bkCfgErr"></div>

    <div class="section-label">Probar ahora</div>
    <p class="hint" style="margin-top:-6px;">Envía un respaldo de prueba a tu webhook en este momento, sin esperar al horario programado.</p>
    <button type="button" class="btn-secondary" id="btnRunBackupNow" style="width:100%;max-width:260px;">Enviar respaldo de prueba ahora</button>
    <div class="err-msg" id="bkRunErr" style="margin-top:8px;"></div>
  `;

  // Cargar configuración de aviso guardada
  apiGet('/api/backup-settings').then(cfg=>{
    document.getElementById('bkEmail').value = cfg.email || '';
    document.getElementById('bkWebhook').value = cfg.webhookUrl || '';
  }).catch(()=>{});

  panel.querySelector('#btnSaveBackupCfg').onclick = async ()=>{
    const errEl = document.getElementById('bkCfgErr');
    errEl.textContent = '';
    try{
      await apiPost('/api/backup-settings', {
        email: document.getElementById('bkEmail').value.trim(),
        webhookUrl: document.getElementById('bkWebhook').value.trim()
      });
      toast('Aviso de respaldo guardado');
    }catch(e){ errEl.textContent = e.message || 'No se pudo guardar'; }
  };

  panel.querySelector('#btnRunBackupNow').onclick = async ()=>{
    const btn = document.getElementById('btnRunBackupNow');
    const errEl = document.getElementById('bkRunErr');
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Enviando...';
    try{
      const res = await apiPost('/api/backups?period=diario', {});
      if(res.sent) toast('Respaldo enviado al webhook');
      else errEl.textContent = res.note || 'No se envió — revisa que hayas guardado un webhook arriba.';
    }catch(e){ errEl.textContent = e.message || 'No se pudo generar el respaldo'; }
    finally{ btn.disabled = false; btn.textContent = 'Enviar respaldo de prueba ahora'; }
  };

  panel.querySelector('#btnFullBackup').onclick = async ()=>{
    const btn = document.getElementById('btnFullBackup');
    const errEl = document.getElementById('backupErr');
    errEl.textContent = '';
    if(typeof XLSX === 'undefined'){ errEl.textContent = 'No se pudo cargar el motor de Excel. Revisa tu conexión.'; return; }

    const wantArrivals = document.getElementById('bkIncludeArrivals').checked;
    const wantCitas = document.getElementById('bkIncludeCitas').checked;
    const wantPerspectiva = document.getElementById('bkIncludePerspectiva').checked;
    const wantUsers = document.getElementById('bkIncludeUsers').checked;
    // "Llegadas de Transportistas" y "Perspectiva" muestran el mismo registro de llegadas — cualquiera de las dos lo incluye.
    const wantRegistro = wantArrivals || wantPerspectiva;
    if(!wantRegistro && !wantArrivals && !wantCitas && !wantUsers){
      errEl.textContent = 'Marca al menos una opción para incluir en el respaldo.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Generando respaldo...';
    try{
      const [arrivals, archived, citas, users] = await Promise.all([
        wantRegistro ? apiGet('/api/arrivals').catch(()=>[]) : Promise.resolve([]),
        wantArrivals ? apiGet('/api/arrivals-archive').catch(()=>[]) : Promise.resolve([]),
        wantCitas ? apiGet('/api/provsched-citas').catch(()=>[]) : Promise.resolve([]),
        wantUsers ? apiGet('/api/users').catch(()=>[]) : Promise.resolve([])
      ]);
      const statusLabelArr = { esperando:'Esperando', en_descarga:'En descarga', despachado:'Despachado' };
      const statusLabelCita = { programado:'Programado', reprogramado:'Reprogramado', cancelado:'Cancelado', en_espera:'En espera (llegó)', en_descarga:'En descarga', completado:'Completado', no_presento:'No se presentó' };

      const wb = XLSX.utils.book_new();
      let sheetsAdded = 0;

      if(wantRegistro){
        const arrivalsRows = arrivals.map(r=>({
          'País/Bodega': r.scopeLabel||'', 'Proveedor': r.provider||'', 'Motorista': r.driverName||'', 'Teléfono': r.phone||'',
          'Placa': r.plate||'', 'Orden de compra': r.orderNumber||'', 'Tipo de transporte': r.transportType||'', 'Muelle': r.dock||'',
          'Fecha': r.date||'', 'Hora': r.time||'', 'Estado': statusLabelArr[r.status]||r.status||''
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(arrivalsRows), 'Registro de llegadas');
        sheetsAdded++;
      }

      if(wantArrivals){
        const archivedRows = archived.map(r=>({
          'País/Bodega': r.scopeLabel||'', 'Proveedor': r.provider||'', 'Motorista': r.driverName||'', 'Placa': r.plate||'',
          'Orden de compra': r.orderNumber||'', 'Fecha': r.date||'', 'Hora': r.time||'',
          'Eliminado el': r.archivedAt ? new Date(r.archivedAt).toLocaleString('es-SV') : '', 'Eliminado por': r.archivedBy||''
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(archivedRows), 'Papelera');
        sheetsAdded++;
      }

      if(wantCitas){
        const citasRows = citas.map(c=>({
          'País/Bodega': c.scopeLabel||'', 'Proveedor': c.providerName||'', 'Orden de compra': c.orderNumber||'', 'Categoría': c.category||'',
          'Fecha': c.date||'', 'Hora': c.time||'', 'Estado': statusLabelCita[c.status]||c.status||'',
          'Puntualidad': c.punctuality ? (c.punctuality==='tarde' ? `Tarde (${Math.abs(c.punctualityMinutes||0)} min)` : `A tiempo${c.punctualityMinutes? ' ('+Math.abs(c.punctualityMinutes)+' min antes)':''}`) : ''
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(citasRows), 'Programación Citas');
        sheetsAdded++;
      }

      if(wantUsers){
        const usersRows = users.map(u=>({
          'Usuario': u.username||'', 'Rol': (ROLE_INFO[u.role]||{}).label || u.role || '', 'País/Bodega': u.scopeLabel||''
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(usersRows), 'Usuarios');
        sheetsAdded++;
      }

      if(sheetsAdded === 0){ errEl.textContent = 'Marca al menos una opción para incluir en el respaldo.'; return; }

      XLSX.writeFile(wb, `respaldo-torre-control_${localDateParts().key}.xlsx`);
      toast('Respaldo descargado');
    }catch(e){
      errEl.textContent = e.message || 'No se pudo generar el respaldo';
    }finally{
      btn.disabled = false; btn.textContent = '📦 Descargar respaldo completo';
    }
  };
}

async function renderTrashTab(panel){
  let archived = [];
  try{ archived = await loadArchivedArrivals(); }catch(e){ toast(e.message || 'No se pudo cargar la papelera'); }
  panel.innerHTML = `
    <p class="hint">Cuando eliminas un registro de llegada desde el Registro o el Calendario, queda respaldado aquí en vez de borrarse de inmediato. Puedes restaurarlo o, si eres el propietario, eliminarlo en definitiva.</p>
    <div class="inline-add-row" style="margin-bottom:14px;">
      <button type="button" class="btn-secondary" id="btnExportTrash" style="flex:1;">Exportar papelera a Excel</button>
    </div>
    <div class="admin-list" id="trashList"></div>
  `;
  const statusLabel = { esperando:'Esperando', en_descarga:'En descarga', despachado:'Despachado' };

  function renderTrashList(){
    const list = document.getElementById('trashList');
    if(archived.length === 0){
      list.innerHTML = `<div class="empty-list">La papelera está vacía</div>`;
      return;
    }
    list.innerHTML = archived.map((r)=>{
      const when = r.archivedAt ? new Date(r.archivedAt).toLocaleString('es-SV') : '—';
      return `
      <div class="admin-list-row">
        <div>
          <div class="name">${r.provider||'Sin proveedor'} · ${r.plate||'Sin placa'}</div>
          <div class="sub">${r.scopeLabel?r.scopeLabel+' · ':''}Llegó ${r.date||''} ${r.time||''} · ${statusLabel[r.status]||'Esperando'} · Eliminado el ${when}${r.archivedBy?' por '+r.archivedBy:''}</div>
        </div>
        <div style="display:flex;gap:6px;flex:0 0 auto;">
          <button class="reset-btn" data-id="${r.id}" title="Restaurar registro"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 109-9M3 12V4m0 8h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          ${isSuperAdmin()
            ? `<button class="del-btn" data-id="${r.id}" data-label="${(r.provider||'')+' · '+(r.plate||'')}" title="Eliminar en definitiva (requiere contraseña)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
            : `<span title="Solo el superusuario puede eliminar en definitiva" style="color:var(--muted);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>`}
        </div>
      </div>
    `;}).join('');
    list.querySelectorAll('.reset-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('¿Restaurar este registro al Registro de llegadas?')) return;
        try{
          await apiPost('/api/arrivals-archive', { id: btn.dataset.id });
          archived = archived.filter(a=>a.id!==btn.dataset.id);
          renderTrashList();
          toast('Registro restaurado');
        }catch(e){ toast(e.message || 'No se pudo restaurar'); }
      };
    });
    list.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = ()=>showPermanentDeletePrompt(btn.dataset.id, btn.dataset.label);
    });
  }
  renderTrashList();

  function showPermanentDeletePrompt(id, label){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:360px;">
        <h3>Eliminar en definitiva</h3>
        <p class="hint">Vas a borrar "<b>${label}</b>" de la papelera para siempre. Esta acción no se puede deshacer. Ingresa tu contraseña para confirmar.</p>
        <div class="field"><label>Contraseña</label><input id="delTrashPw" type="password" placeholder="••••••••"></div>
        <div class="err-msg" id="delTrashErr"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="delTrashCancel">Cancelar</button>
          <button class="btn-primary-sm" id="delTrashConfirm" style="background:var(--accent);">Eliminar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#delTrashCancel').onclick = ()=>overlay.remove();
    const pwInput = overlay.querySelector('#delTrashPw');
    pwInput.focus();
    const doDelete = async ()=>{
      const password = pwInput.value;
      const errEl = document.getElementById('delTrashErr');
      if(!password){ errEl.textContent = 'Ingresa tu contraseña'; return; }
      const btn = overlay.querySelector('#delTrashConfirm');
      btn.disabled = true; btn.textContent = 'Eliminando...';
      try{
        await apiDelete('/api/arrivals-archive', { id, password });
        archived = archived.filter(a=>a.id!==id);
        overlay.remove();
        toast('Eliminado en definitiva');
        renderTrashList();
      }catch(e){
        errEl.textContent = e.message || 'No se pudo eliminar';
        btn.disabled = false; btn.textContent = 'Eliminar';
      }
    };
    overlay.querySelector('#delTrashConfirm').onclick = doDelete;
    pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doDelete(); });
  }

  document.getElementById('btnExportTrash').onclick = ()=>{
    if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el motor de Excel. Revisa tu conexión.'); return; }
    if(!archived.length){ toast('La papelera está vacía'); return; }
    const data = archived.map(r=>Object.assign(
      getIsGlobal() ? { 'País / Bodega': r.scopeLabel||'' } : {},
      {
        'Proveedor': r.provider||'', 'Motorista': r.driverName||'', 'Teléfono': r.phone||'', 'Placa': r.plate||'',
        'Tipo de transporte': r.transportType||'', 'Muelle': r.dock||'', 'Fecha': r.date||'', 'Hora de llegada': r.time||'',
        'Estado': statusLabel[r.status]||'Esperando',
        'Eliminado el': r.archivedAt ? new Date(r.archivedAt).toLocaleString('es-SV') : '',
        'Eliminado por': r.archivedBy||''
      }
    ));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Papelera');
    XLSX.writeFile(wb, `papelera-registros_${localDateParts().key}.xlsx`);
    toast('Excel descargado');
  };
}

async function renderDocksTab(panel){

    <button class="btn-primary-sm" id="docksSave" style="width:100%;max-width:220px;margin-top:8px;">Guardar cambios</button>
  `;

      return;
    }
    list.innerHTML = currentDocks.map((name,i)=>`
      <div class="admin-list-row" style="gap:8px;">
        <input class="dock-name-input" data-i="${i}" value="${name}" style="flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-family:inherit;font-size:13px;background:var(--card);color:var(--text);">
        <button class="del-btn" data-i="${i}" title="Eliminar muelle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    `).join('');
    list.querySelectorAll('.dock-name-input').forEach(inp=>{
      inp.addEventListener('input', ()=>{ currentDocks[parseInt(inp.dataset.i)] = inp.value; });
    });
    list.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = ()=>{ currentDocks.splice(parseInt(btn.dataset.i),1); renderDocksList(); };
    });
  }
  renderDocksList();

  panel.querySelector('#btnAddDock').onclick = ()=>{
    const name = document.getElementById('newDockName').value.trim();

    currentDocks.push(name);
    document.getElementById('newDockName').value = '';
    renderDocksList();
  };
  panel.querySelector('#docksSave').onclick = async ()=>{
    try{
      const clean = currentDocks.map(d=>d.trim()).filter(Boolean);
      await apiPost('/api/docks', { docks: clean });
      toast('Muelles actualizados');
    }catch(e){ toast(e.message || 'No se pudo guardar'); }
  };
}

      <h3>Editar usuario</h3>
      <p class="hint">Cambia el nombre de usuario, la contraseña y/o el rol. Deja la contraseña en blanco si no quieres cambiarla.${user.scopeLabel?` <br><b>País/bodega:</b> ${user.scopeLabel}`:''}</p>
      <div class="field"><label>Usuario</label><input id="editUserUsername" value="${user.username}" autocomplete="off"></div>
      <div class="field"><label>Nueva contraseña (opcional)</label><input id="editUserPw" type="password" placeholder="Dejar en blanco para no cambiarla"></div>
      <div class="field"><label>Rol de usuario</label>
        <div class="role-picker" id="editRolePicker">
          ${ASSIGNABLE_ROLES.map(([key,info])=>`
            <label class="role-option ${key===user.role?'selected':''}" data-role="${key}">
              <input type="radio" name="editUserRole" value="${key}" ${key===user.role?'checked':''}>
              <div><div class="ro-name">${info.label}</div><div class="ro-desc">${info.desc}</div></div>
            </label>
          `).join('')}
        </div>
      </div>
      ${getIsGlobal() ? allowedViewsCheckboxesHtml('editUserViews', user.allowedViews) : ''}
      ${getIsGlobal() ? multiScopesCheckboxesHtml('editUserScopes', user.multiScopes) : ''}
      <div class="modal-actions">
        <button class="btn-secondary" id="editUserClose">Cancelar</button>
        <button class="btn-primary-sm" id="editUserSave">Guardar cambios</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#editUserClose').onclick = ()=>overlay.remove();
  overlay.querySelectorAll('.role-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      overlay.querySelectorAll('.role-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
    });
  });
  overlay.querySelector('#editUserSave').onclick = async ()=>{
    const newUsername = document.getElementById('editUserUsername').value.trim();
    const newPassword = document.getElementById('editUserPw').value;
    const role = overlay.querySelector('input[name="editUserRole"]:checked').value;
    if(!newUsername){ toast('El usuario no puede quedar vacío'); return; }
    if(newPassword && newPassword.length < 4){ toast('La contraseña debe tener al menos 4 caracteres'); return; }
    try{
      const body = { username: user.username, role };
      if(getIsGlobal() && user.scopeKey) body.scope = user.scopeKey;
      if(getIsGlobal()) body.allowedViews = readAllowedViewsCheckboxes(overlay, 'editUserViews');
      if(getIsGlobal()) body.multiScopes = readMultiScopesCheckboxes(overlay, 'editUserScopes');
      if(newUsername.toLowerCase() !== user.username) body.newUsername = newUsername;
      if(newPassword) body.newPassword = newPassword;
      const res = await apiPatch('/api/users', body);
      overlay.remove();
      toast('Usuario actualizado');
      if(user.username === getUsername()){
        sessionStorage.setItem('tc_username', res.username || newUsername);
        sessionStorage.setItem('tc_role', role);
      }
      if(onSaved) onSaved(res.username || newUsername, role);
    }catch(e){ toast(e.message || 'No se pudo guardar'); }
  };
}

async function renderUsersTab(panel){
  let users = [];
  try{ users = await apiGet('/api/users'); }catch(e){ toast(e.message || 'No se pudieron cargar los usuarios'); }
  panel.innerHTML = `
    <p class="hint">Cada rol tiene un nivel de acceso distinto. Elige el que le corresponda a cada persona.${getIsGlobal()?' Como superusuario ves los usuarios de todos los países y bodegas.':''}</p>
    <div class="section-label">Usuarios existentes</div>
    <div class="admin-list" id="usersList"></div>
    <div class="section-label">Crear usuario</div>
    ${getIsGlobal() ? `<p class="hint" style="margin-top:-6px;">Si marcas países/bodegas abajo, el usuario iniciará sesión con el <b>primero que marques</b>. Si no marcas ninguno, se creará en tu país activo actual: <b>${COUNTRY_INFO[getCountry()]?.label||getCountry()}${countryNeedsFacility(getCountry())?' · '+facilityLabel(getCountry(),getFacility()):''}</b>.</p>` : ''}
    <div class="field"><label>Usuario</label><input id="newUsername" placeholder="ej. recepcion1" autocomplete="off"></div>
    <div class="field"><label>Contraseña</label><input id="newUserPw" type="password" placeholder="mínimo 4 caracteres"></div>
    <div class="field"><label>Rol de usuario</label>
      <div class="role-picker" id="rolePicker">
        ${ASSIGNABLE_ROLES.map(([key,info])=>`
          <label class="role-option" data-role="${key}">
            <input type="radio" name="newUserRole" value="${key}" ${key==='viewer'?'checked':''}>
            <div><div class="ro-name">${info.label}</div><div class="ro-desc">${info.desc}</div></div>
          </label>
        `).join('')}
      </div>
    </div>
    ${getIsGlobal() ? allowedViewsCheckboxesHtml('newUserViews', null) : ''}
    ${getIsGlobal() ? multiScopesCheckboxesHtml('newUserScopes', null, true) : ''}
    <button type="button" class="btn-secondary" id="btnAddUser" style="width:100%;margin-top:10px;">+ Crear usuario</button>
  `;

  panel.querySelectorAll('.role-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      panel.querySelectorAll('.role-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
    });
  });
  panel.querySelector('.role-option[data-role="viewer"]').classList.add('selected');

  function renderUsersList(){
    const list = document.getElementById('usersList');
    if(users.length === 0){ list.innerHTML = `<div class="empty-list">No hay usuarios</div>`; return; }
    list.innerHTML = users.map(u=>`
      <div class="admin-list-row">
        <div><div class="name">${u.username}</div><div class="sub">${(ROLE_INFO[u.role]||ROLE_INFO.viewer).label}${u.scopeLabel?' · '+u.scopeLabel:''}${u.multiScopes&&u.multiScopes.length?' · +'+u.multiScopes.length+' país/bodega extra':''}</div></div>
        <div style="display:flex;gap:6px;">
          <button class="edit-user-btn" data-u="${u.username}" data-scope="${u.scopeKey||''}" title="Editar usuario"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          ${u.username===getUsername() ? '' : `<button class="del-btn" data-u="${u.username}" data-scope="${u.scopeKey||''}" title="Eliminar usuario"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.del-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm(`¿Eliminar al usuario "${btn.dataset.u}"?`)) return;
        try{
          const body = { username: btn.dataset.u };
          if(getIsGlobal() && btn.dataset.scope) body.scope = btn.dataset.scope;
          await apiDelete('/api/users', body);
          users = users.filter(u=>!(u.username === btn.dataset.u && (u.scopeKey||'') === btn.dataset.scope));
          renderUsersList();
          toast('Usuario eliminado');
        }catch(e){ toast(e.message || 'No se pudo eliminar'); }
      };
    });
    list.querySelectorAll('.edit-user-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const u = users.find(x=>x.username === btn.dataset.u && (x.scopeKey||'') === btn.dataset.scope);
        if(u) showEditUserModal(u, (updatedUsername, updatedRole)=>{
          u.username = updatedUsername;
          u.role = updatedRole;
          renderUsersList();
        });
      };
    });
  }
  renderUsersList();

  panel.querySelector('#btnAddUser').onclick = async ()=>{
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newUserPw').value;
    const role = panel.querySelector('input[name="newUserRole"]:checked').value;
    if(!username || !password){ toast('Completa usuario y contraseña'); return; }
    const body = { username, password, role };
    if(getIsGlobal()){
      body.allowedViews = readAllowedViewsCheckboxes(panel, 'newUserViews');
      const multiScopes = readMultiScopesCheckboxes(panel, 'newUserScopes');
      body.multiScopes = multiScopes;
      // Si le asignas países/bodegas, la cuenta se crea directo en el primero que marcaste,
      // para que ese sea el país/bodega con el que el usuario inicia sesión (evita crearla sin querer en tu "país activo").
      if(multiScopes && multiScopes.length) body.scope = multiScopes[0];
    }
    const btn = panel.querySelector('#btnAddUser');
    btn.disabled = true; btn.textContent = 'Creando...';
    try{
      await apiPost('/api/users', body);
    }catch(e){
      toast(e.message || 'No se pudo crear el usuario');
      btn.disabled = false; btn.textContent = '+ Crear usuario';
      return;
    }
    // El usuario ya se creó en el servidor. Si al refrescar la lista algo falla (ej. de red),
    // no lo mostramos como si la creación hubiera fallado — solo avisamos que hay que recargar la lista.
    toast('Usuario creado');
    document.getElementById('newUsername').value = '';
    document.getElementById('newUserPw').value = '';
    btn.disabled = false; btn.textContent = '+ Crear usuario';
    try{
      users = await apiGet('/api/users');
      renderUsersList();
    }catch(e){
      toast('El usuario se creó, pero no se pudo actualizar la lista automáticamente. Recarga la página para verlo.');
    }
  };
}

// ---------------- SUGERENCIAS ----------------
function showSuggestionsModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Enviar sugerencia</h3>
      <p class="hint">Tu mensaje llega directo al administrador.</p>
      <textarea class="sugg-input" id="suggText" placeholder="Escribe tu sugerencia o comentario..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="suggClose">Cancelar</button>
        <button class="btn-primary-sm" id="suggSend">Enviar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#suggClose').onclick = ()=>overlay.remove();
  overlay.querySelector('#suggSend').onclick = async ()=>{
    const message = document.getElementById('suggText').value.trim();
    if(!message){ toast('Escribe tu sugerencia'); return; }
    try{
      await apiPost('/api/suggestions', { message });
      overlay.remove();
      toast('¡Gracias! Tu sugerencia fue enviada');
    }catch(e){ toast(e.message || 'No se pudo enviar'); }
  };
}

route();
