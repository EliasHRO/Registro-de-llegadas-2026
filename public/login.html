<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dockly · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEDF0;
    --bg-elevated:#F4F5F7;
    --card:#FFFFFF;
    --border:#E1E4E9;
    --border-soft:#EAECEF;
    --text:#1C1F26;
    --muted:#6B7280;
    --accent:#E11D48;
    --accent-dark:#AF1338;
    --accent-glow:rgba(225,29,72,.22);
    --accent-soft:rgba(225,29,72,.09);
    --radius:16px;
    --shadow:0 1px 2px rgba(20,22,28,.05), 0 20px 44px -22px rgba(20,22,28,.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    background-image:linear-gradient(rgba(238,240,244,.92),rgba(238,240,244,.92)), url('/assets/fleet-bg.jpg');
    background-size:cover;background-position:center 40%;background-attachment:fixed;background-repeat:no-repeat;
  }
  #app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .gate-card{width:100%;max-width:440px;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border);padding:36px 32px 30px;animation:fadeInUp .5s ease;}

  .logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px;}
  .logo-row img{height:28px;width:auto;object-fit:contain;}
  .logo-divider{width:1px;height:22px;background:var(--border);}

  .mode-tabs{display:flex;background:var(--bg-elevated);border-radius:12px;padding:5px;margin-bottom:24px;border:1px solid var(--border);}
  .mode-tab{flex:1;text-align:center;padding:11px 10px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;}
  .mode-tab svg{flex:0 0 auto;}
  .mode-tab.active{background:var(--card);color:var(--accent-dark);box-shadow:0 2px 6px rgba(0,0,0,.07);}

  h1.title{font-size:20px;font-weight:800;margin:0 0 5px;letter-spacing:-.01em;text-align:center;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.5;text-align:center;}

  .auth-tabs{display:flex;background:var(--bg-elevated);border-radius:11px;padding:4px;margin-bottom:20px;}
  .auth-tab{flex:1;text-align:center;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
  .auth-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .field{text-align:left;margin-bottom:14px;}
  .field > label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field > input{width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .country-picker{display:flex;flex-direction:column;gap:8px;}
  .country-opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg-elevated);color:var(--text);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;transition:all .15s;}
  .country-opt:hover{border-color:var(--accent);}
  .country-opt.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}

  button.primary{width:100%;padding:15px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit;box-shadow:0 8px 24px -10px var(--accent-glow);}
  button.link-btn{background:none;border:none;color:var(--accent-dark);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px;}
  button.primary:disabled{background:#3A3F4A;box-shadow:none;cursor:not-allowed;}

  .err-msg{color:var(--accent-dark);font-size:12.5px;margin:-4px 0 10px;min-height:16px;text-align:left;}
  .hint-sm{font-size:11px;color:var(--muted);margin:-8px 0 14px;}
</style>
</head>
<body>
<div id="app"></div>
<script>

// ---- Datos compartidos (mismos que usan admin.html / provider.html) ----
const COUNTRY_FACILITIES = { GT: [
  { code:'ATLAS_MATERIALES', label:'Atlas - Materiales de Construcción' },
  { code:'ATLAS_MISCELANEO', label:'Atlas - Misceláneo' },
  { code:'SANTAELENA', label:'CD Santa Elena' }
] };
const SUPERUSER_USERNAMES = ['elias','carlos'];

async function apiPost(path, body){
  let r;
  try{
    r = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  }catch(e){
    throw new Error('No se pudo conectar con el servidor. Revisa tu conexión.');
  }
  const text = await r.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('Respuesta inesperada del servidor.'); }
  if(!r.ok) throw new Error(data.error || 'Ocurrió un error');
  return data;
}

function providerRegFieldInputHtml(f){
  const optTag = f.required ? '' : ' <span style="text-transform:none;font-weight:500;color:var(--muted);">(opcional)</span>';
  if(f.type === 'textarea'){
    return `<div class="field"><label>${f.label}${optTag}</label><textarea id="reg_${f.id}" style="width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);min-height:70px;"></textarea></div>`;
  }
  if(f.type === 'select'){
    return `<div class="field"><label>${f.label}${optTag}</label><select id="reg_${f.id}" style="width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);"><option value="">Selecciona...</option>${(f.options||[]).map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
  }
  if(f.type === 'date'){
    return `<div class="field"><label>${f.label}${optTag}</label><input id="reg_${f.id}" type="date"></div>`;
  }
  if(f.type === 'number'){
    return `<div class="field"><label>${f.label}${optTag}</label><input id="reg_${f.id}" type="number"></div>`;
  }
  return `<div class="field"><label>${f.label}${optTag}</label><input id="reg_${f.id}" type="${f.type==='tel'?'tel':'text'}"></div>`;
}
function readProviderRegFieldValues(fields){
  const customFields = {};
  let error = null;
  for(const f of fields){
    const val = (document.getElementById('reg_'+f.id)?.value || '').trim();
    if(f.required && !val && !error){ error = `Completa el campo "${f.label}"`; }
    if(val) customFields[f.label] = val;
  }
  return { customFields, error };
}

let activeMode = 'almacen';

function renderResetPassword(token){
  document.body.className = 'dashboard-bg';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div style="text-align:center;"><span class="brand-tag"><span class="dot"></span>Dockly · Proveedores</span></div>
        <h1 class="title">Elige tu nueva contraseña</h1>
        <p class="sub">Escribe tu nueva contraseña para tu cuenta de proveedor.</p>
        <div class="field"><label>Nueva contraseña</label><input id="rpNewPw" type="password" placeholder="mínimo 6 caracteres"></div>
        <div class="field"><label>Confirmar contraseña</label><input id="rpNewPw2" type="password"></div>
        <div class="err-msg" id="gateErr"></div>
        <button class="primary" id="btnRpConfirm">Guardar y entrar</button>
      </div>
    </div>
  `;
  document.getElementById('btnRpConfirm').onclick = async ()=>{
    const errEl = document.getElementById('gateErr');
    errEl.textContent = '';
    const p1 = document.getElementById('rpNewPw').value;
    const p2 = document.getElementById('rpNewPw2').value;
    if(!p1 || p1.length < 6){ errEl.textContent = 'La contraseña debe tener al menos 6 caracteres'; return; }
    if(p1 !== p2){ errEl.textContent = 'Las contraseñas no coinciden'; return; }
    const btn = document.getElementById('btnRpConfirm');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      const res = await apiPost('/api/provider-auth', { action:'reset-password', token, newPassword: p1, country:'GT' });
      sessionStorage.setItem('provider_token', res.token);
      sessionStorage.setItem('provider_username', res.username);
      sessionStorage.setItem('provider_company', res.companyName);
      location.href = '/provider';
    }catch(e){
      errEl.textContent = e.message || 'No se pudo restablecer la contraseña';
      btn.disabled = false; btn.textContent = 'Guardar y entrar';
    }
  };
}

const resetTokenParam = new URLSearchParams(location.search).get('ptoken');

function renderGate(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="gate-card">
      <div class="logo-row">
        <img src="/assets/novex.png" alt="NOVEX">
        <div class="logo-divider"></div>
        <img src="/assets/vidri.png" alt="VIDRI">
      </div>
      <div class="mode-tabs">
        <div class="mode-tab ${activeMode==='almacen'?'active':''}" id="tabAlmacen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Almacén
        </div>
        <div class="mode-tab ${activeMode==='proveedor'?'active':''}" id="tabProveedor">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="7" height="16" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="4" width="7" height="16" rx="1.5" stroke="currentColor" stroke-width="1.7"/><path d="M6.5 8v8M17.5 8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Proveedores
        </div>
      </div>
      <div id="modeBody"></div>
    </div>
  `;
  document.getElementById('tabAlmacen').onclick = ()=>{ activeMode='almacen'; renderGate(); };
  document.getElementById('tabProveedor').onclick = ()=>{ activeMode='proveedor'; renderGate(); };
  if(activeMode==='almacen') paintAlmacen(); else paintProveedor();
}

// ---------------- ALMACÉN (personal interno) ----------------
function paintAlmacen(){
  const body = document.getElementById('modeBody');
  body.innerHTML = `
    <h1 class="title">Torre de control</h1>
    <p class="sub">Ingresa tus credenciales de personal interno.</p>
    <div class="field" id="facilityFieldWrap"><label>Bodega</label>
      <div class="country-picker" id="facilityPicker">
        ${COUNTRY_FACILITIES.GT.map(f=>`<button type="button" class="country-opt" data-facility="${f.code}">${f.label}</button>`).join('')}
      </div>
    </div>
    <p class="hint-sm">Si eres superusuario, puedes ignorar la bodega y entrar directo con tu usuario y contraseña.</p>
    <div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input id="loginPw" type="password" autocomplete="current-password"></div>
    <div class="err-msg" id="gateErr"></div>
    <button class="primary" id="btnEnter">Entrar</button>
  `;
  let selectedFacility = '';
  body.querySelectorAll('#facilityPicker .country-opt').forEach(btn=>{
    btn.onclick = ()=>{
      selectedFacility = btn.dataset.facility;
      body.querySelectorAll('#facilityPicker .country-opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });
  const doLogin = async ()=>{
    const errEl = document.getElementById('gateErr');
    errEl.textContent = '';
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPw').value;
    const isSuperuser = SUPERUSER_USERNAMES.includes(username.toLowerCase());
    if(!isSuperuser && !selectedFacility){ errEl.textContent = 'Selecciona una bodega'; return; }
    if(!username || !password){ errEl.textContent = 'Ingresa usuario y contraseña'; return; }
    const btn = document.getElementById('btnEnter');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      const headers = isSuperuser ? {} : { country:'GT', facility:selectedFacility };
      const r = await fetch('/api/auth', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', ...(isSuperuser?{}:{ 'X-Country':'GT', 'X-Facility':selectedFacility }) },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error || 'No se pudo iniciar sesión');
      sessionStorage.setItem('tc_token', data.token);
      sessionStorage.setItem('tc_role', data.role);
      sessionStorage.setItem('tc_username', data.username);
      sessionStorage.setItem('tc_isowner', data.isOwner ? '1' : '0');
      sessionStorage.setItem('tc_global', data.global ? '1' : '0');
      sessionStorage.setItem('tc_allowedviews', Array.isArray(data.allowedViews) ? JSON.stringify(data.allowedViews) : '');
      sessionStorage.setItem('tc_multiscopes', Array.isArray(data.multiScopes) ? JSON.stringify(data.multiScopes) : '');
      if(data.global){
        sessionStorage.setItem('tc_country', 'GT');
        sessionStorage.setItem('tc_facility', 'ATLAS_MATERIALES');
      } else {
        sessionStorage.setItem('tc_country', data.country || 'GT');
        sessionStorage.setItem('tc_facility', data.facility || selectedFacility);
      }
      location.href = '/admin';
    }catch(e){
      errEl.textContent = e.message || 'No se pudo iniciar sesión';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
  document.getElementById('btnEnter').onclick = doLogin;
  document.getElementById('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

// ---------------- PROVEEDORES ----------------
function paintProveedor(){
  const body = document.getElementById('modeBody');
  body.innerHTML = `
    <h1 class="title">Portal de proveedores</h1>
    <p class="sub">Consulta el estado de tus órdenes de compra y la cita asignada.</p>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabProvLogin">Iniciar sesión</div>
      <div class="auth-tab" id="tabProvRegister">Registrarme</div>
    </div>
    <div id="provFormArea"></div>
  `;
  const formArea = document.getElementById('provFormArea');
  const tabLogin = document.getElementById('tabProvLogin');
  const tabRegister = document.getElementById('tabProvRegister');

  function paintProvLogin(){
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    formArea.innerHTML = `
      <div class="field"><label>Usuario</label><input id="pLoginUser" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="pLoginPass" type="password" autocomplete="current-password"></div>
      <div class="err-msg" id="gateErr"></div>
      <button class="primary" id="btnProvLogin">Iniciar sesión</button>
      <button class="link-btn" id="btnForgotPw" style="display:block;margin:12px auto 0;">¿Olvidaste tu contraseña?</button>
    `;
    document.getElementById('btnForgotPw').onclick = (e)=>{ e.preventDefault(); paintForgotPassword(); };
    document.getElementById('btnProvLogin').onclick = async ()=>{
      const errEl = document.getElementById('gateErr');
      errEl.textContent = '';
      const username = document.getElementById('pLoginUser').value.trim();
      const password = document.getElementById('pLoginPass').value;
      if(!username || !password){ errEl.textContent = 'Completa usuario y contraseña'; return; }
      const btn = document.getElementById('btnProvLogin');
      btn.disabled = true; btn.textContent = 'Ingresando...';
      try{
        const res = await apiPost('/api/provider-auth', { action:'login', username, password, country:'GT' });
        sessionStorage.setItem('provider_token', res.token);
        sessionStorage.setItem('provider_username', res.username);
        sessionStorage.setItem('provider_company', res.companyName);
        location.href = '/provider';
      }catch(e){
        errEl.textContent = e.message || 'No se pudo iniciar sesión';
        btn.disabled = false; btn.textContent = 'Iniciar sesión';
      }
    };

    function paintForgotPassword(){
      formArea.innerHTML = `
        <p class="sub" style="margin-bottom:16px;">Escribe el correo con el que te registraste. Si existe una cuenta con ese correo, te enviaremos un enlace para elegir una nueva contraseña.</p>
        <div class="field"><label>Correo electrónico</label><input id="fpEmail" type="email"></div>
        <div class="err-msg" id="gateErr"></div>
        <div id="fpOk" style="display:none;color:#0F5C36;font-size:13px;font-weight:700;margin:-4px 0 14px;">✓ Si ese correo está registrado, revisa tu bandeja de entrada (y spam).</div>
        <button class="primary" id="btnFpSend">Enviar enlace</button>
        <button class="link-btn" id="btnFpBack" style="display:block;margin:12px auto 0;">Volver a iniciar sesión</button>
      `;
      document.getElementById('btnFpBack').onclick = (e)=>{ e.preventDefault(); paintProvLogin(); };
      document.getElementById('btnFpSend').onclick = async ()=>{
        const errEl = document.getElementById('gateErr');
        const okEl = document.getElementById('fpOk');
        errEl.textContent = ''; okEl.style.display = 'none';
        const email = document.getElementById('fpEmail').value.trim();
        if(!email || !email.includes('@')){ errEl.textContent = 'Escribe un correo válido'; return; }
        const btn = document.getElementById('btnFpSend');
        btn.disabled = true; btn.textContent = 'Enviando...';
        try{
          await apiPost('/api/provider-auth', { action:'forgot-password', email, country:'GT' });
          okEl.style.display = 'block';
        }catch(e){
          errEl.textContent = e.message || 'No se pudo procesar la solicitud';
        }
        btn.disabled = false; btn.textContent = 'Enviar enlace';
      };
    }
    document.getElementById('pLoginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnProvLogin').click(); });
  }

  async function paintProvRegister(){
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    formArea.innerHTML = `
      <div class="field"><label>Nombre de la empresa / proveedor</label><input id="pRegCompany" placeholder="ej. Distribuidora XYZ"></div>
      <div class="field"><label>Usuario</label><input id="pRegUser" placeholder="mínimo 3 caracteres"></div>
      <div class="field"><label>Contraseña</label><input id="pRegPass" type="password" placeholder="mínimo 6 caracteres"></div>
      <div class="field"><label>Correo electrónico</label><input id="pRegEmail" type="email"></div>
      <div class="field"><label>Nombre de contacto</label><input id="pRegContact"></div>
      <div class="field"><label>Teléfono</label><input id="pRegPhone"></div>
      <div id="pRegCustomFieldsArea"></div>
      <div class="err-msg" id="gateErr"></div>
      <button class="primary" id="btnProvRegister">Crear cuenta</button>
    `;
    let regFields = [];
    try{
      const r = await fetch('/api/provider-reg-formfields?country=GT');
      regFields = await r.json();
    }catch(e){ regFields = []; }
    const customArea = document.getElementById('pRegCustomFieldsArea');
    customArea.innerHTML = regFields.map(f=>providerRegFieldInputHtml(f)).join('');

    document.getElementById('btnProvRegister').onclick = async ()=>{
      const errEl = document.getElementById('gateErr');
      errEl.textContent = '';
      const companyName = document.getElementById('pRegCompany').value.trim();
      const username = document.getElementById('pRegUser').value.trim();
      const password = document.getElementById('pRegPass').value;
      const contactName = document.getElementById('pRegContact').value.trim();
      const phone = document.getElementById('pRegPhone').value.trim();
      const email = document.getElementById('pRegEmail').value.trim();
      if(!companyName || !username || !password){ errEl.textContent = 'Completa empresa, usuario y contraseña'; return; }
      if(!email || !email.includes('@')){ errEl.textContent = 'Escribe un correo electrónico válido'; return; }
      if(!contactName){ errEl.textContent = 'Escribe el nombre de contacto'; return; }
      if(!phone){ errEl.textContent = 'Escribe el teléfono'; return; }
      const { customFields, error: regFieldsError } = readProviderRegFieldValues(regFields);
      if(regFieldsError){ errEl.textContent = regFieldsError; return; }
      const btn = document.getElementById('btnProvRegister');
      btn.disabled = true; btn.textContent = 'Creando cuenta...';
      try{
        const res = await apiPost('/api/provider-auth', { action:'register', username, password, companyName, contactName, phone, email, customFields, country:'GT' });
        sessionStorage.setItem('provider_token', res.token);
        sessionStorage.setItem('provider_username', res.username);
        sessionStorage.setItem('provider_company', res.companyName);
        location.href = '/provider';
      }catch(e){
        errEl.textContent = e.message || 'No se pudo crear la cuenta';
        btn.disabled = false; btn.textContent = 'Crear cuenta';
      }
    };
  }

  tabLogin.onclick = paintProvLogin;
  tabRegister.onclick = paintProvRegister;
  paintProvLogin();
}

if(resetTokenParam){ renderResetPassword(resetTokenParam); } else { renderGate(); }
</script>
</body>
</html>
