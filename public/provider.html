<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dockly · Portal de proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEDF0;
    --bg-elevated:#F4F5F7;
    --card:#FFFFFF;
    --border:#E1E4E9;
    --border-soft:#EAECEF;
    --text:#1C1F26;
    --muted:#6B7280;
    --accent:#E11D48;
    --accent-dark:#AF1338;
    --accent-glow:rgba(225,29,72,.22);
    --accent-soft:rgba(225,29,72,.09);
    --ok:#149A5C;
    --ok-soft:rgba(20,154,92,.09);
    --info:#3457D5;
    --info-soft:rgba(52,87,213,.09);
    --gold:#B8860B;
    --gold-soft:rgba(184,134,11,.12);
    --radius:16px;
    --shadow:0 1px 2px rgba(20,22,28,.05), 0 20px 44px -22px rgba(20,22,28,.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  body.dashboard-bg{
    background-image:linear-gradient(rgba(238,240,244,.94),rgba(238,240,244,.94)), url('/assets/fleet-bg.jpg');
    background-size:cover;background-position:center 40%;background-attachment:fixed;background-repeat:no-repeat;
  }
  #app{height:100vh;display:flex;flex-direction:column;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:440px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border);padding:36px 32px 30px;animation:fadeInUp .5s ease;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{transform:scale(1.03);}100%{opacity:1;transform:scale(1);}}

  .brand-tag{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-dark);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:18px;border:1px solid rgba(225,29,72,.18);}
  .brand-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

  h1.title{font-size:22px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;text-align:center;}
  p.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px;line-height:1.5;text-align:center;}

  .auth-tabs{display:flex;background:var(--bg-elevated);border-radius:11px;padding:4px;margin-bottom:22px;}
  .auth-tab{flex:1;text-align:center;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
  .auth-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .field{text-align:left;margin-bottom:14px;}
  .field > label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field > input{width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  button.primary{width:100%;padding:15px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit;box-shadow:0 8px 24px -10px var(--accent-glow);}
  button.primary:disabled{background:#3A3F4A;box-shadow:none;cursor:not-allowed;}

  .err-msg{color:var(--accent-dark);font-size:12.5px;margin:-4px 0 10px;min-height:16px;text-align:left;}

  .dash-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex:0 0 auto;}
  .dash-topbar .co-name{font-weight:800;font-size:15px;}
  .dash-topbar .co-sub{font-size:11.5px;color:var(--muted);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{background:var(--bg-elevated);border:1px solid var(--border);border-radius:9px;padding:8px 14px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .icon-btn:hover{border-color:var(--muted);}

  .dash-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:16px 28px 18px;max-width:1500px;margin:0 auto;width:100%;}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;flex:0 0 auto;}
  .stat-card{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:14px;padding:18px 20px;text-align:left;}
  .stat-num{font-size:30px;font-weight:800;line-height:1;}
  .stat-label{font-size:12.5px;color:var(--muted);margin-top:7px;font-weight:600;}

  .filters-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;flex:0 0 auto;}
  .search-input{flex:1;min-width:200px;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);font-family:inherit;font-size:13.5px;background:rgba(255,255,255,.9);color:var(--text);}
  .search-input:focus{outline:none;border-color:var(--accent);}
  .period-tabs{display:flex;background:var(--bg-elevated);border-radius:10px;padding:4px;border:1px solid var(--border);}
  .period-tab{padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .period-tab.active{background:var(--card);color:var(--accent-dark);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .orders-table-wrap{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:14px;overflow:auto;flex:1 1 auto;min-height:0;}
  .orders-table{width:100%;border-collapse:collapse;}
  .orders-table thead th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg-elevated);position:sticky;top:0;z-index:1;}
  .orders-table tbody td{padding:16px 20px;font-size:14px;border-bottom:1px solid var(--border-soft);}
  .orders-table tbody tr{cursor:pointer;transition:background .12s;}
  .orders-table tbody tr:hover{background:var(--bg-elevated);}
  .orders-table tbody tr:last-child td{border-bottom:none;}
  .order-num{font-weight:800;}
  .row-chevron{color:var(--muted);text-align:right;}

  .status-pill{font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;white-space:nowrap;display:inline-block;}
  .status-pill.programado, .status-pill.reprogramado{background:var(--info-soft);color:var(--info);}
  .status-pill.en_espera{background:var(--gold-soft);color:var(--gold);}
  .status-pill.en_descarga{background:var(--gold-soft);color:var(--gold);}
  .status-pill.completado{background:var(--ok-soft);color:var(--ok);}
  .status-pill.cancelado, .status-pill.no_presento{background:var(--accent-soft);color:var(--accent-dark);}

  .dash-empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 20px;flex:1;}
  .refresh-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;flex:0 0 auto;}

  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;cursor:pointer;color:var(--text);font-weight:700;font-size:14px;}
  .back-row svg{flex:0 0 auto;}
  .detail-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;}
  @media (max-width:760px){ .detail-grid{grid-template-columns:1fr;} }

  .detail-side{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .detail-field{margin-bottom:16px;}
  .detail-field:last-child{margin-bottom:0;}
  .detail-field label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .detail-field .val{font-size:14px;font-weight:600;}

  .stepper-card{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:14px;padding:22px 20px;margin-bottom:16px;}
  .stepper{display:flex;align-items:flex-start;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
  .step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);border:2px solid var(--border);color:var(--muted);font-weight:800;font-size:13px;z-index:1;}
  .step.done .step-circle{background:var(--ok);border-color:var(--ok);color:#fff;}
  .step-line{position:absolute;top:16px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0;}
  .step.done .step-line{background:var(--ok);}
  .step:first-child .step-line{display:none;}
  .step-label{font-size:12px;font-weight:700;margin-top:9px;}
  .step-time{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .status-banner{border-radius:12px;padding:14px 16px;margin-bottom:16px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:10px;}
  .status-banner.cancelado, .status-banner.no_presento{background:var(--accent-soft);color:var(--accent-dark);}

  .expand-section{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .expand-head{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:700;font-size:13.5px;}
  .expand-head svg{transition:transform .15s;}
  .expand-head.open svg{transform:rotate(180deg);}
  .expand-body{padding:0 18px 16px;font-size:13px;color:var(--text);display:none;}
  .expand-body.open{display:block;}
  .expand-body .kv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);}
  .expand-body .kv-row:last-child{border-bottom:none;}
  .expand-body .kv-row span:first-child{color:var(--muted);}
  .expand-body .kv-row span:last-child{font-weight:600;text-align:right;}

  .dock-status-box{margin-bottom:16px;display:flex;align-items:center;gap:12px;border-radius:12px;padding:14px 16px;text-align:left;}
  .dock-status-box.waiting{background:var(--bg-elevated);border:1px solid var(--border-soft);color:var(--muted);}
  .dock-status-box.assigned{background:var(--ok-soft);border:1px solid rgba(46,217,136,.35);color:#1C1F26;}
  .dock-status-icon{flex:0 0 auto;}
  .dock-status-box.waiting .dock-status-icon{color:var(--muted);}
  .dock-status-box.assigned .dock-status-icon{color:#0F8A4F;}
  .dock-status-title{font-weight:800;font-size:14px;color:var(--text);}
  .dock-status-sub{font-size:12px;color:var(--muted);margin-top:1px;}
</style>
</head>
<body>
<div id="app"></div>
<script>

function getProviderToken(){ return sessionStorage.getItem('provider_token'); }
function getProviderCompany(){ return sessionStorage.getItem('provider_company'); }
function setProviderSession(token, username, companyName){
  sessionStorage.setItem('provider_token', token);
  sessionStorage.setItem('provider_username', username);
  sessionStorage.setItem('provider_company', companyName);
}
function clearProviderSession(){
  sessionStorage.removeItem('provider_token');
  sessionStorage.removeItem('provider_username');
  sessionStorage.removeItem('provider_company');
}

function providerRegFieldInputHtml(f){
  const optTag = f.required ? '' : ' <span style="text-transform:none;font-weight:500;color:var(--muted);">(opcional)</span>';
  if(f.type === 'textarea'){
    return `<div class="field"><label>${f.label}${optTag}</label><textarea id="reg_${f.id}" style="width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);min-height:70px;"></textarea></div>`;
  }
  if(f.type === 'select'){
    return `<div class="field"><label>${f.label}${optTag}</label><select id="reg_${f.id}" style="width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);"><option value="">Selecciona...</option>${(f.options||[]).map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
  }
  if(f.type === 'date'){
    return `<div class="field"><label>${f.label}${optTag}</label><input id="reg_${f.id}" type="date"></div>`;
  }
  if(f.type === 'number'){
    return `<div class="field"><label>${f.label}${optTag}</label><input id="reg_${f.id}" type="number"></div>`;
  }
  return `<div class="field"><label>${f.label}${optTag}</label><input id="reg_${f.id}" type="${f.type==='tel'?'tel':'text'}"></div>`;
}
function readProviderRegFieldValues(fields){
  const customFields = {};
  let error = null;
  for(const f of fields){
    const val = (document.getElementById('reg_'+f.id)?.value || '').trim();
    if(f.required && !val && !error){ error = `Completa el campo "${f.label}"`; }
    if(val) customFields[f.label] = val;
  }
  return { customFields, error };
}

async function providerApiPost(path, body){
  let r;
  try{
    r = await fetch(path, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', ...(getProviderToken()?{'Authorization':'Bearer '+getProviderToken()}:{}) },
      body: JSON.stringify(body)
    });
  }catch(e){ throw new Error('No se pudo conectar con el servidor. Revisa tu conexión.'); }
  const text = await r.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('Respuesta inesperada del servidor.'); }
  if(!r.ok) throw new Error(data.error || 'Ocurrió un error');
  return data;
}
async function providerApiGet(path){
  let r;
  try{
    r = await fetch(path, { headers: { 'Authorization':'Bearer '+getProviderToken() } });
  }catch(e){ throw new Error('No se pudo conectar con el servidor. Revisa tu conexión.'); }
  if(r.status === 403){ clearProviderSession(); renderAuthScreen(); throw new Error('Tu sesión expiró, inicia sesión de nuevo.'); }
  const text = await r.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('Respuesta inesperada del servidor.'); }
  if(!r.ok) throw new Error(data.error || 'Ocurrió un error');
  return data;
}

const STATUS_LABEL = {
  programado:'Programado', reprogramado:'Reprogramado', en_espera:'Llegó', en_descarga:'En progreso',
  completado:'Completado', cancelado:'Cancelado', no_presento:'No se presentó'
};
const STATUS_BUCKET = {
  programado:'programado', reprogramado:'programado',
  en_espera:'en_espera', en_descarga:'en_descarga',
  completado:'completado', cancelado:'cancelado', no_presento:'cancelado'
};

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h>=12?'p.m.':'a.m.';
  const h12 = h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function fmtDateTimeMs(ms){
  if(!ms) return '';
  const local = new Date(ms - 6*3600*1000);
  const d = String(local.getUTCDate()).padStart(2,'0');
  const mo = String(local.getUTCMonth()+1).padStart(2,'0');
  const h = String(local.getUTCHours()).padStart(2,'0');
  const mi = String(local.getUTCMinutes()).padStart(2,'0');
  return `${d}/${mo} · ${h}:${mi}`;
}

let dashPollTimer = null;
let allOrders = [];
let activePeriod = 'todos';
let searchTerm = '';
let currentView = 'list';
let currentOrderId = null;

function renderApp(){
  if(getProviderToken()){ renderDashboard(); } else { renderAuthScreen(); }
}

function renderAuthScreen(){
  if(dashPollTimer){ clearTimeout(dashPollTimer); dashPollTimer = null; }
  document.body.className = 'dashboard-bg';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div style="text-align:center;"><span class="brand-tag"><span class="dot"></span>Dockly · Proveedores</span></div>
        <h1 class="title">Portal de proveedores</h1>
        <p class="sub">Consulta el estado de tus órdenes de compra y la cita de entrega asignada.</p>
        <div class="auth-tabs">
          <div class="auth-tab active" id="tabLogin">Iniciar sesión</div>
          <div class="auth-tab" id="tabRegister">Registrarme</div>
        </div>
        <div id="authFormArea"></div>
      </div>
    </div>
  `;
  const formArea = document.getElementById('authFormArea');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');

  function paintLogin(){
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    formArea.innerHTML = `
      <div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username"></div>
      <div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div>
      <div class="err-msg" id="authErr"></div>
      <button class="primary" id="btnLogin">Iniciar sesión</button>
    `;
    document.getElementById('btnLogin').onclick = async ()=>{
      const errEl = document.getElementById('authErr');
      errEl.textContent = '';
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if(!username || !password){ errEl.textContent = 'Completa usuario y contraseña'; return; }
      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = 'Ingresando...';
      try{
        const res = await providerApiPost('/api/provider-auth', { action:'login', username, password, country:'GT' });
        setProviderSession(res.token, res.username, res.companyName);
        renderDashboard();
      }catch(e){
        errEl.textContent = e.message || 'No se pudo iniciar sesión';
        btn.disabled = false; btn.textContent = 'Iniciar sesión';
      }
    };
    document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnLogin').click(); });
  }

  async function paintRegister(){
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    formArea.innerHTML = `
      <div class="field"><label>Nombre de la empresa / proveedor</label><input id="regCompany" placeholder="ej. Distribuidora XYZ"></div>
      <div class="field"><label>Usuario</label><input id="regUser" autocomplete="username" placeholder="mínimo 3 caracteres"></div>
      <div class="field"><label>Contraseña</label><input id="regPass" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres"></div>
      <div class="field"><label>Correo electrónico</label><input id="regEmail" type="email"></div>
      <div class="field"><label>Nombre de contacto <span style="text-transform:none;font-weight:500;color:var(--muted);">(opcional)</span></label><input id="regContact"></div>
      <div class="field"><label>Teléfono <span style="text-transform:none;font-weight:500;color:var(--muted);">(opcional)</span></label><input id="regPhone"></div>
      <div id="regCustomFieldsArea"></div>
      <div class="err-msg" id="authErr"></div>
      <button class="primary" id="btnRegister">Crear cuenta</button>
    `;
    let regFields = [];
    try{
      const r = await fetch('/api/provider-reg-formfields?country=GT');
      regFields = await r.json();
    }catch(e){ regFields = []; }
    document.getElementById('regCustomFieldsArea').innerHTML = regFields.map(f=>providerRegFieldInputHtml(f)).join('');

    document.getElementById('btnRegister').onclick = async ()=>{
      const errEl = document.getElementById('authErr');
      errEl.textContent = '';
      const companyName = document.getElementById('regCompany').value.trim();
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value;
      const contactName = document.getElementById('regContact').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      if(!companyName || !username || !password){ errEl.textContent = 'Completa empresa, usuario y contraseña'; return; }
      if(!email || !email.includes('@')){ errEl.textContent = 'Escribe un correo electrónico válido'; return; }
      const { customFields, error: regFieldsError } = readProviderRegFieldValues(regFields);
      if(regFieldsError){ errEl.textContent = regFieldsError; return; }
      const btn = document.getElementById('btnRegister');
      btn.disabled = true; btn.textContent = 'Creando cuenta...';
      try{
        const res = await providerApiPost('/api/provider-auth', { action:'register', username, password, companyName, contactName, phone, email, customFields, country:'GT' });
        setProviderSession(res.token, res.username, res.companyName);
        renderDashboard();
      }catch(e){
        errEl.textContent = e.message || 'No se pudo crear la cuenta';
        btn.disabled = false; btn.textContent = 'Crear cuenta';
      }
    };
  }

  tabLogin.onclick = paintLogin;
  tabRegister.onclick = paintRegister;
  paintLogin();
}

async function renderDashboard(){
  document.body.className = 'dashboard-bg';
  const app = document.getElementById('app');
  app.innerHTML = `<div class="dash-empty">Cargando tus órdenes...</div>`;
  await loadOrders();
  paintListView();
  schedulePoll();
}

function schedulePoll(){
  if(dashPollTimer) clearTimeout(dashPollTimer);
  dashPollTimer = setTimeout(async ()=>{
    await loadOrders();
    if(currentView === 'list') paintListView();
    else if(currentView === 'detail') paintDetailView(currentOrderId);
    schedulePoll();
  }, 20000);
}

async function loadOrders(){
  try{
    allOrders = await providerApiGet('/api/provider-orders');
  }catch(e){
    const app = document.getElementById('app');
    if(app && !getProviderToken()) return; // ya se manejó (sesión expirada -> pantalla de login)
    if(app) app.innerHTML = `<div class="dash-empty">${e.message||'No se pudieron cargar tus órdenes'}</div>`;
    allOrders = [];
  }
}

function filteredOrders(){
  let list = allOrders;
  const todayStr = new Date(Date.now() - 6*3600*1000).toISOString().slice(0,10);
  if(activePeriod === 'hoy'){
    list = list.filter(o=>o.date === todayStr);
  } else if(activePeriod === '7dias'){
    const cutoff = new Date(Date.now() - 6*3600*1000 - 7*86400000).toISOString().slice(0,10);
    list = list.filter(o=>o.date >= cutoff);
  }
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(o=>(o.orderNumber||'').toLowerCase().includes(q));
  }
  return list;
}

function exportOrdersCsv(){
  const list = filteredOrders();
  if(!list.length){ alert('No hay órdenes para exportar.'); return; }
  const headers = ['Orden de compra','Categoría','Bodega','Fecha','Hora','Estado','Muelle'];
  const rows = list.map(o=>[
    o.orderNumber, o.category, o.scopeLabel, fmtDate(o.date), fmtTime(o.time),
    STATUS_LABEL[o.status]||o.status, (o.arrival&&o.arrival.dock)||''
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mis-ordenes.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function paintSettingsView(){
  currentView = 'settings';
  document.body.className = 'dashboard-bg';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="dash-topbar">
      <div>
        <div class="co-name">${getProviderCompany()||''}</div>
        <div class="co-sub">Portal de proveedores · Dockly</div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnLogout">Cerrar sesión</button>
      </div>
    </div>
    <div class="dash-body">
      <div class="back-row" id="btnBack">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Configuración de cuenta
      </div>
      <div id="settingsBody" style="max-width:520px;">
        <div class="dash-empty">Cargando...</div>
      </div>
    </div>
  `;
  document.getElementById('btnBack').onclick = ()=>{ paintListView(); };
  document.getElementById('btnLogout').onclick = ()=>{
    clearProviderSession();
    if(dashPollTimer){ clearTimeout(dashPollTimer); dashPollTimer = null; }
    renderAuthScreen();
  };

  const body = document.getElementById('settingsBody');
  let profile, regFields;
  try{
    [profile, regFields] = await Promise.all([
      providerApiGet('/api/provider-profile'),
      fetch('/api/provider-reg-formfields?country=GT').then(r=>r.json()).catch(()=>[])
    ]);
  }catch(e){
    body.innerHTML = `<div class="dash-empty">${e.message||'No se pudo cargar tu información'}</div>`;
    return;
  }
  const visibleRegFields = regFields.filter(f=>f.visible !== false);

  body.innerHTML = `
    <div class="expand-section" style="margin-bottom:16px;">
      <div class="expand-head open" style="cursor:default;">
        Información de la empresa
      </div>
      <div class="expand-body open" style="padding:0 18px 18px;">
        <div class="field"><label>Nombre de la empresa / proveedor</label><input id="setCompany" value="${profile.companyName||''}"></div>
        <div class="field"><label>Correo electrónico</label><input id="setEmail" type="email" value="${profile.email||''}"></div>
        <div class="field"><label>Nombre de contacto</label><input id="setContact" value="${profile.contactName||''}"></div>
        <div class="field"><label>Teléfono</label><input id="setPhone" value="${profile.phone||''}"></div>
        <div id="setCustomFieldsArea"></div>
        <div class="err-msg" id="setProfileErr"></div>
        <button class="primary" id="btnSaveProfile" style="max-width:220px;">Guardar cambios</button>
        <div id="setProfileOk" style="display:none;color:#0F5C36;font-size:12.5px;margin-top:8px;font-weight:700;">✓ Guardado correctamente</div>
      </div>
    </div>

    <div class="expand-section">
      <div class="expand-head open" style="cursor:default;">
        Contraseña
      </div>
      <div class="expand-body open" style="padding:0 18px 18px;">
        <div class="field"><label>Contraseña actual</label><input id="setCurPass" type="password"></div>
        <div class="field"><label>Nueva contraseña</label><input id="setNewPass" type="password" placeholder="mínimo 6 caracteres"></div>
        <div class="field"><label>Confirmar nueva contraseña</label><input id="setNewPass2" type="password"></div>
        <div class="err-msg" id="setPassErr"></div>
        <button class="primary" id="btnSavePass" style="max-width:220px;">Cambiar contraseña</button>
        <div id="setPassOk" style="display:none;color:#0F5C36;font-size:12.5px;margin-top:8px;font-weight:700;">✓ Contraseña actualizada</div>
      </div>
    </div>
  `;

  const customArea = document.getElementById('setCustomFieldsArea');
  customArea.innerHTML = visibleRegFields.map(f=>{
    const val = (profile.customFields||{})[f.label] || '';
    if(f.type === 'select'){
      return `<div class="field"><label>${f.label}</label><select id="set_${f.id}" style="width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--bg-elevated);color:var(--text);"><option value="">Selecciona...</option>${(f.options||[]).map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input id="set_${f.id}" type="${f.type==='tel'?'tel':(f.type==='number'?'number':(f.type==='date'?'date':'text'))}" value="${val}"></div>`;
  }).join('');

  document.getElementById('btnSaveProfile').onclick = async ()=>{
    const errEl = document.getElementById('setProfileErr');
    const okEl = document.getElementById('setProfileOk');
    errEl.textContent = ''; okEl.style.display = 'none';
    const companyName = document.getElementById('setCompany').value.trim();
    const email = document.getElementById('setEmail').value.trim();
    if(!companyName){ errEl.textContent = 'El nombre de la empresa no puede quedar vacío'; return; }
    if(!email || !email.includes('@')){ errEl.textContent = 'Escribe un correo electrónico válido'; return; }
    const customFields = {};
    visibleRegFields.forEach(f=>{
      const el = document.getElementById('set_'+f.id);
      if(el && el.value.trim()) customFields[f.label] = el.value.trim();
    });
    const btn = document.getElementById('btnSaveProfile');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      const res = await fetch('/api/provider-profile', {
        method:'PATCH',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+getProviderToken() },
        body: JSON.stringify({
          companyName, email,
          contactName: document.getElementById('setContact').value.trim(),
          phone: document.getElementById('setPhone').value.trim(),
          customFields
        })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo guardar');
      sessionStorage.setItem('provider_company', data.companyName);
      document.querySelectorAll('.co-name').forEach(el=>el.textContent = data.companyName);
      okEl.style.display = 'block';
    }catch(e){
      errEl.textContent = e.message || 'No se pudo guardar';
    }
    btn.disabled = false; btn.textContent = 'Guardar cambios';
  };

  document.getElementById('btnSavePass').onclick = async ()=>{
    const errEl = document.getElementById('setPassErr');
    const okEl = document.getElementById('setPassOk');
    errEl.textContent = ''; okEl.style.display = 'none';
    const currentPassword = document.getElementById('setCurPass').value;
    const newPassword = document.getElementById('setNewPass').value;
    const newPassword2 = document.getElementById('setNewPass2').value;
    if(!currentPassword || !newPassword){ errEl.textContent = 'Completa ambos campos de contraseña'; return; }
    if(newPassword.length < 6){ errEl.textContent = 'La nueva contraseña debe tener al menos 6 caracteres'; return; }
    if(newPassword !== newPassword2){ errEl.textContent = 'Las contraseñas nuevas no coinciden'; return; }
    const btn = document.getElementById('btnSavePass');
    btn.disabled = true; btn.textContent = 'Cambiando...';
    try{
      const res = await fetch('/api/provider-change-password', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+getProviderToken() },
        body: JSON.stringify({ currentPassword, newPassword })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo cambiar la contraseña');
      document.getElementById('setCurPass').value = '';
      document.getElementById('setNewPass').value = '';
      document.getElementById('setNewPass2').value = '';
      okEl.style.display = 'block';
    }catch(e){
      errEl.textContent = e.message || 'No se pudo cambiar la contraseña';
    }
    btn.disabled = false; btn.textContent = 'Cambiar contraseña';
  };
}

function paintDetailView(orderId){

    programado: fmtDateTimeMs(o.createdAt),
    llego: arr ? fmtDateTimeMs(arr.ts) : '',
    progreso: arr ? fmtDateTimeMs(arr.unloadingStartedAt) : '',

  document.getElementById('btnBack').onclick = ()=>{ paintListView(); };

renderApp();
</script>
